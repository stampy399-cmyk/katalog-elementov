<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сверка приёмов: мы против конкурента</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: #f4f7fb;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: 44px 0 64px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .toolbar {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 34px;
    }

    .tabs {
      display: flex;
      flex: 1 1 auto;
      gap: 12px;
      overflow-x: auto;
      padding: 2px 2px 8px;
    }

    .tab,
    .action {
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .tab {
      flex: 0 0 auto;
      padding: 14px 22px;
      background: #e7ebf2;
      color: #34405a;
      font-size: 20px;
    }

    .tab[aria-selected="true"] {
      background: #1f63e9;
      color: #ffffff;
    }

    .refresh {
      flex: 0 0 auto;
      background: #172033;
    }

    .action:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    .tab:hover,
    .action:hover {
      transform: translateY(-1px);
    }

    .tab:focus-visible,
    .action:focus-visible,
    video:focus-visible,
    audio:focus-visible {
      outline: 4px solid #91b4ff;
      outline-offset: 3px;
    }

    .message {
      margin: 42px 0;
      padding: 34px;
      border: 2px dashed #c5cedd;
      border-radius: 20px;
      background: #ffffff;
      color: #58647a;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 700;
      text-align: center;
    }

    .cards {
      display: grid;
      gap: 28px;
    }

    .card {
      padding: clamp(22px, 4vw, 34px);
      border: 1px solid #e0e5ee;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 14px 38px rgb(36 50 78 / 9%);
    }

    .card__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .card h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    .card__identity {
      display: flex;
      flex: 1 1 auto;
      align-items: flex-start;
      min-width: 0;
      gap: 18px;
    }

    .card__number {
      flex: 0 0 auto;
      color: #1f63e9;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }

    .card__details {
      min-width: 0;
    }

    .card__title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .status-badge {
      letter-spacing: 0.01em;
      text-transform: none;
    }

    .status-badge--unreviewed {
      background: #e5e7eb;
      color: #596275;
    }

    .status-badge--revise {
      background: #ffca28;
      color: #382800;
    }

    .status-badge--approved {
      background: #bdebd0;
      color: #17623e;
    }

    .card__comment {
      margin: 8px 0 0;
      color: #667085;
      font-size: 15px;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      flex: 0 0 auto;
      gap: 10px;
    }

    .action {
      min-height: 50px;
      padding: 12px 18px;
      background: #1f63e9;
      color: #ffffff;
      font-size: 18px;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .video-column {
      min-width: 0;
    }

    .video-label {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .video-label--ours {
      color: #137747;
    }

    .video-label--competitor {
      color: #9a3d35;
    }

    .video-box {
      position: relative;
      display: grid;
      aspect-ratio: 16 / 9;
      place-items: center;
      overflow: hidden;
      border-radius: 16px;
      background: #111827;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      object-fit: contain;
    }

    .video-box--audio {
      min-height: 112px;
      padding: 24px;
      aspect-ratio: auto;
      background: #e9eef6;
    }

    audio {
      display: block;
      width: 100%;
    }

    .placeholder {
      display: grid;
      width: 100%;
      height: 100%;
      padding: 24px;
      place-items: center;
      background: #e9f6ef;
      color: #17623e;
      font-size: clamp(21px, 3vw, 30px);
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
    }

    .placeholder--competitor {
      background: #f3f4f6;
      color: #596275;
    }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 24px, 680px);
        padding-top: 28px;
      }

      .card__top {
        display: block;
      }

      .actions {
        margin-top: 18px;
      }

      .videos {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .toolbar {
        flex-wrap: wrap;
      }

      .tabs {
        flex-basis: 100%;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      .action {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tab,
      .action {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Сверка приёмов: мы против конкурента</h1>

    <div class="toolbar">
      <nav class="tabs" aria-label="Семейства приёмов" role="tablist"></nav>
      <button class="action refresh" id="refresh" type="button">Обновить</button>
    </div>

    <section id="content" role="tabpanel" aria-labelledby="tab-family-0" aria-live="polite">
      <p class="message">Загружаем данные…</p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const families = [
        { nazvanie: 'Переходы', competitor: 'competitor', nash: 'nash' },
        { nazvanie: 'Частицы', competitor: 'competitor-chastitsy', nash: 'nash-chastitsy' },
        { nazvanie: 'Фильтры', competitor: 'competitor-filtry', nash: 'nash-filtry' },
        { nazvanie: 'Типографика', competitor: 'competitor-tipografika', nash: 'nash-tipografika' },
        { nazvanie: 'Инфографика', competitor: 'competitor-infografika', nash: 'nash-infografika' },
        { nazvanie: 'Камера', competitor: 'competitor-kamera', nash: 'nash-kamera' },
        { nazvanie: 'Футажи', competitor: 'competitor-futazhi', nash: 'nash-futazhi' },
        { nazvanie: 'Звук', competitor: 'competitor-zvuk', nash: 'nash-zvuk' }
      ];
      const defaultStatus = 'не просмотрено';
      const validStatuses = new Set([defaultStatus, 'доработать', 'утверждено']);
      const statusClasses = {
        'не просмотрено': 'status-badge--unreviewed',
        'доработать': 'status-badge--revise',
        'утверждено': 'status-badge--approved'
      };
      const content = document.querySelector('#content');
      const tabsContainer = document.querySelector('.tabs');
      const refreshButton = document.querySelector('#refresh');
      const familyData = new Map();
      const loadTokens = new Map();
      let activeFamily = families[0];
      let itemStatuses = new Map();
      let statusLoadToken = 0;
      let statusesLoaded = false;

      families.forEach((family, index) => {
        const tab = document.createElement('button');
        tab.className = 'tab';
        tab.id = `tab-family-${index}`;
        tab.type = 'button';
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-selected', String(index === 0));
        tab.dataset.familyIndex = String(index);
        tab.textContent = family.nazvanie;
        tabsContainer.append(tab);
      });

      const tabs = [...tabsContainer.querySelectorAll('.tab')];

      function showMessage(text) {
        content.replaceChildren();
        const message = document.createElement('p');
        message.className = 'message';
        message.textContent = text;
        content.append(message);
      }

      async function loadManifest(path) {
        try {
          const response = await fetch(path, { cache: 'no-store' });
          if (!response.ok) return null;
          const data = await response.json();
          return Array.isArray(data) ? data : null;
        } catch {
          return null;
        }
      }

      function itemGroupId(item) {
        if (!item || typeof item !== 'object') return '';
        const groupId = String(item.group_id || '').trim();
        if (groupId) return groupId;
        const filename = String(item.file || '').trim();
        return filename ? `file:${filename}` : '';
      }

      function itemStatusKey(familyName, groupId) {
        return `${familyName}\u0000${groupId}`;
      }

      async function loadStatuses() {
        const token = ++statusLoadToken;
        let nextStatuses = new Map();
        try {
          const response = await fetch('STATUS.json', { cache: 'no-store' });
          if (response.ok) {
            const data = await response.json();
            if (data && typeof data === 'object' && !Array.isArray(data)) {
              Object.entries(data).forEach(([number, record]) => {
                if (!record || typeof record !== 'object') return;
                const familyName = String(record.family || '').trim();
                const groupId = String(record.group_id || '').trim();
                const status = validStatuses.has(record.status) ? record.status : defaultStatus;
                if (!familyName || !groupId) return;
                nextStatuses.set(itemStatusKey(familyName, groupId), {
                  number: /^#\d{2,}$/.test(number) ? number : '#—',
                  status,
                  kommentariy: String(record.kommentariy || '').trim()
                });
              });
            }
          }
        } catch {
          nextStatuses = new Map();
        }
        if (statusLoadToken === token) {
          itemStatuses = nextStatuses;
          statusesLoaded = true;
        }
      }

      function getItemStatus(item, family) {
        const groupId = itemGroupId(item);
        return itemStatuses.get(itemStatusKey(family.nazvanie, groupId)) || {
          number: '#—',
          status: defaultStatus,
          kommentariy: ''
        };
      }

      function isOurMediaReady(item) {
        if (!item || typeof item.file !== 'string' || !item.file.trim()) return false;
        const status = String(item.status || '').trim().toLowerCase();
        const unavailable = ['pending', 'preparing', 'missing', 'error', 'готовится', 'нет'];
        return !unavailable.includes(status);
      }

      function makePlaceholder(text, competitor = false) {
        const placeholder = document.createElement('div');
        placeholder.className = `placeholder${competitor ? ' placeholder--competitor' : ''}`;
        placeholder.textContent = text;
        return placeholder;
      }

      function makeMedia(path, label, muted, isAudio) {
        const media = document.createElement(isAudio ? 'audio' : 'video');
        media.src = path;
        media.muted = muted;
        media.preload = 'metadata';
        media.setAttribute('aria-label', label);
        if (isAudio) {
          media.controls = true;
        } else {
          media.playsInline = true;
          media.setAttribute('tabindex', '0');
        }
        return media;
      }

      function makeMediaColumn(label, labelClass, isAudio) {
        const column = document.createElement('div');
        column.className = 'video-column';

        const heading = document.createElement('span');
        heading.className = `video-label ${labelClass}`;
        heading.textContent = label;

        const box = document.createElement('div');
        box.className = `video-box${isAudio ? ' video-box--audio' : ''}`;
        column.append(heading, box);
        return { column, box };
      }

      function createCard(item, ourItem, family) {
        const isAudio = family.nazvanie === 'Звук';
        const itemStatus = getItemStatus(item, family);
        const card = document.createElement('article');
        card.className = 'card';

        const top = document.createElement('div');
        top.className = 'card__top';

        const identity = document.createElement('div');
        identity.className = 'card__identity';

        const numberLabel = document.createElement('span');
        numberLabel.className = 'card__number';
        numberLabel.textContent = itemStatus.number;

        const details = document.createElement('div');
        details.className = 'card__details';

        const titleGroup = document.createElement('div');
        titleGroup.className = 'card__title';

        const title = document.createElement('h2');
        title.textContent = String(item.nazvanie || 'Приём без названия');
        titleGroup.append(title);

        const statusBadge = document.createElement('span');
        statusBadge.className = `badge status-badge ${statusClasses[itemStatus.status]}`;
        statusBadge.textContent = itemStatus.status;
        titleGroup.append(statusBadge);
        details.append(titleGroup);

        if (itemStatus.kommentariy) {
          const comment = document.createElement('p');
          comment.className = 'card__comment';
          comment.textContent = itemStatus.kommentariy;
          details.append(comment);
        }

        identity.append(numberLabel, details);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const playButton = document.createElement('button');
        playButton.className = 'action';
        playButton.type = 'button';
        playButton.textContent = '▶ Играть оба';

        actions.append(playButton);
        top.append(identity, actions);

        const videos = document.createElement('div');
        videos.className = 'videos';
        const ours = makeMediaColumn('НАШ', 'video-label--ours', isAudio);
        const competitor = makeMediaColumn('КОНКУРЕНТ', 'video-label--competitor', isAudio);
        const players = [];

        if (isOurMediaReady(ourItem)) {
          const ourMedia = makeMedia(`${family.nash}/${ourItem.file}`, `Наш вариант: ${title.textContent}`, true, isAudio);
          ours.box.append(ourMedia);
          players.push(ourMedia);
          ourMedia.addEventListener('error', () => {
            const playerIndex = players.indexOf(ourMedia);
            if (playerIndex !== -1) players.splice(playerIndex, 1);
            ourMedia.remove();
            ours.box.append(makePlaceholder('Наш вариант готовится'));
          }, { once: true });
        } else {
          ours.box.append(makePlaceholder('Наш вариант готовится'));
        }

        if (typeof item.file === 'string' && item.file.trim()) {
          const competitorMedia = makeMedia(`${family.competitor}/${item.file}`, `Вариант конкурента: ${title.textContent}`, false, isAudio);
          competitor.box.append(competitorMedia);
          players.push(competitorMedia);
          competitorMedia.addEventListener('error', () => {
            const playerIndex = players.indexOf(competitorMedia);
            if (playerIndex !== -1) players.splice(playerIndex, 1);
            competitorMedia.remove();
            competitor.box.append(makePlaceholder(`${isAudio ? 'Аудио' : 'Видео'} конкурента пока недоступно`, true));
          }, { once: true });
        } else {
          competitor.box.append(makePlaceholder(`${isAudio ? 'Аудио' : 'Видео'} конкурента пока недоступно`, true));
        }

        const pauseBoth = () => {
          players.forEach((video) => video.pause());
          playButton.textContent = '▶ Играть оба';
        };

        players.filter((media) => media.tagName === 'VIDEO').forEach((video) => {
          video.addEventListener('click', pauseBoth);
          video.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              pauseBoth();
            }
          });
        });

        playButton.addEventListener('click', () => {
          players.forEach((video) => {
            try {
              video.currentTime = 0;
            } catch {
              // Metadata may not be loaded yet; play still starts from the beginning.
            }
          });
          void Promise.allSettled(players.map((video) => video.play()));
          playButton.textContent = isAudio ? '⏸ Используйте плеер для паузы' : '⏸ Нажмите видео для паузы';
        });

        videos.append(ours.column, competitor.column);
        card.append(top, videos);
        return card;
      }

      function render(family) {
        const familyIndex = families.indexOf(family);
        content.setAttribute('aria-labelledby', `tab-family-${familyIndex}`);
        if (!statusesLoaded) {
          showMessage('Загружаем данные…');
          return;
        }
        const data = familyData.get(family.competitor);
        if (!data || !data.competitorManifest || data.competitorManifest.length === 0) {
          showMessage('Данные готовятся');
          return;
        }

        const ourByGroup = new Map(
          (data.ourManifest || [])
            .filter((item) => itemGroupId(item))
            .map((item) => [itemGroupId(item), item])
        );
        const competitorByGroup = new Map();

        data.competitorManifest.forEach((item) => {
          const groupId = itemGroupId(item);
          if (!groupId) return;
          if (!competitorByGroup.has(groupId)) competitorByGroup.set(groupId, item);
        });

        if (competitorByGroup.size === 0) {
          showMessage('Данные готовятся');
          return;
        }

        const cards = document.createElement('div');
        cards.className = 'cards';
        competitorByGroup.forEach((item, groupId) => {
          cards.append(createCard(item, ourByGroup.get(groupId), family));
        });
        content.replaceChildren(cards);
      }

      async function loadFamily(family) {
        if (window.location.protocol === 'file:') {
          showMessage('Данные готовятся');
          return;
        }

        const token = (loadTokens.get(family.competitor) || 0) + 1;
        loadTokens.set(family.competitor, token);
        const [competitorManifest, ourManifest] = await Promise.all([
          loadManifest(`${family.competitor}/MANIFEST.json`),
          loadManifest(`${family.nash}/MANIFEST.json`)
        ]);

        if (loadTokens.get(family.competitor) !== token) return;
        familyData.set(family.competitor, { competitorManifest, ourManifest });
        if (activeFamily === family) render(family);
      }

      function selectFamily(family) {
        activeFamily = family;
        tabs.forEach((tab) => {
          const isActive = families[Number(tab.dataset.familyIndex)] === family;
          tab.setAttribute('aria-selected', String(isActive));
        });

        if (familyData.has(family.competitor)) {
          render(family);
        } else {
          showMessage('Загружаем данные…');
          void loadFamily(family);
        }
      }

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          selectFamily(families[Number(tab.dataset.familyIndex)]);
        });
      });

      refreshButton.addEventListener('click', async () => {
        const family = activeFamily;
        refreshButton.disabled = true;
        refreshButton.textContent = 'Обновляем…';
        try {
          await Promise.all([loadFamily(family), loadStatuses()]);
          if (activeFamily === family) render(family);
        } finally {
          refreshButton.disabled = false;
          refreshButton.textContent = 'Обновить';
        }
      });

      selectFamily(activeFamily);
      void loadStatuses().then(() => {
        if (familyData.has(activeFamily.competitor)) render(activeFamily);
      });
    })();
  </script>
</body>
</html>
