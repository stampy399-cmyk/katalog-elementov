      function revisionsForProject(projectId) {
        const key = String(projectId);
        let revisions = state.fieldRevisions.get(key);
        if (!revisions) {
          revisions = { title: 0, channel: 0 };
          state.fieldRevisions.set(key, revisions);
        }
        return revisions;
      }

      function markProjectFieldManual(project, field) {
        if (field !== 'title' && field !== 'channel') return;
        project[`${field}Source`] = 'manual';
        revisionsForProject(project.id)[field] += 1;

      function stopProjectMetadata(projectId) {
        const key = String(projectId);
        const timer = state.metadataTimers.get(key);
        if (timer !== undefined) clearTimeout(timer);
        state.metadataTimers.delete(key);
        const request = state.metadataRequests.get(key);
        request?.controller?.abort();
        state.metadataRequests.delete(key);
      }

      function stopAllProjectMetadata() {
        for (const projectId of new Set([
          ...state.metadataTimers.keys(),
          ...state.metadataRequests.keys()
        ])) stopProjectMetadata(projectId);
      }

      function scheduleProjectMetadata(project) {
        const url = asText(project.url).trim();
        stopProjectMetadata(project.id);
        if (!url || typeof fetch !== 'function') return;
        const key = String(project.id);
        const request = {
          url,
          titleRevision: revisionsForProject(project.id).title,
          channelRevision: revisionsForProject(project.id).channel,
          titleSource: project.titleSource,
          channelSource: project.channelSource,
          controller: typeof AbortController === 'function' ? new AbortController() : null
        };
        state.metadataRequests.set(key, request);
        const timer = setTimeout(() => {
          state.metadataTimers.delete(key);
          fetchProjectMetadata(project.id, request);
        }, SAVE_DELAY);
        state.metadataTimers.set(key, timer);
      }

      async function fetchProjectMetadata(projectId, request) {
        const key = String(projectId);
        try {
          const response = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(request.url),
            request.controller ? { signal: request.controller.signal } : undefined);
          if (!response.ok) throw new Error('Метаданные ролика недоступны.');
          const metadata = await response.json();
          if (state.metadataRequests.get(key) !== request) return;
          const project = findProject(projectId);
          if (!project || project.url.trim() !== request.url) return;
          const revisions = revisionsForProject(project.id);
          let changed = false;
          if (request.titleSource === 'auto' && project.titleSource === 'auto'
              && revisions.title === request.titleRevision && asText(metadata?.title).trim()) {
            project.title = asText(metadata.title).trim();
            project.titleSource = 'auto';
            changed = true;
          }
          if (request.channelSource === 'auto' && project.channelSource === 'auto'
              && revisions.channel === request.channelRevision && asText(metadata?.author_name).trim()) {
            project.channel = asText(metadata.author_name).trim();
            project.channelSource = 'auto';
            changed = true;
          }
          if (changed) {
            if (state.videoComposer?.projectId && String(state.videoComposer.projectId) === String(project.id)) state.videoComposer.draft = project;
            saveProject(project);
            updateProjectVisual(project);
          }
        } catch (error) {
          // Metadata is optional, so a network failure must not affect local editing.
        } finally {
          if (state.metadataRequests.get(key) === request) state.metadataRequests.delete(key);
        }
      }

      function ensureVideoDraftProject() {
        if (!state.videoComposer) return null;
        if (state.videoComposer.projectId) return findProject(state.videoComposer.projectId);
        const project = normalizeProject({ id: makeId(), ...state.videoComposer.draft });
        state.projects.unshift(project);
        state.videoComposer.projectId = project.id;
        state.videoComposer.draft = project;
        state.activeProjectId = project.id;
        state.settings.activeProjectId = project.id;
        saveProject(project, false).catch(() => undefined);
        saveSettings(['activeProjectId']);
        return project;

      function addElement(projectId, image = '') {

      function updateVideoDraft(field, value) {
        if (!state.videoComposer) return;

      function updateProject(project, field, value) {

          project.completed = false;

          project[field] = value;

      function updateRepeat(element, decrement, button) {
        const next = Math.max(1, element.repeatCount + (decrement ? -1 : 1));
        if (next === element.repeatCount) return;

        saveElement(element);
        for (const badge of dom.appShell.querySelectorAll('.repeat-badge')) {

      function copyElement(source) {

        state.elements.push(clone);

      function removeElement(element) {
        const index = state.elements.findIndex((candidate) => String(candidate.id) === String(element.id));
        if (index < 0) return;
        const card = [...dom.workspaceInner.querySelectorAll('[data-element-id]')].find((node) => node.dataset.elementId === String(element.id));
        cancelElementCommit(element.id);
        state.elements.splice(index, 1);
        markCloudDirty();
        if (String(state.editingElementId) === String(element.id)) state.editingElementId = null;
        deleteElementFromDatabase(element.id).catch(() => undefined);
        updateProjectCounts(element.projectId);
        if (card) {
          card.classList.add('is-removing');
          setTimeout(renderFeed, 210);
        } else {
          renderFeed();
        }
      }

      function removeProject(project) {
        const index = state.projects.findIndex((candidate) => String(candidate.id) === String(project.id));
        if (index < 0) return;
        const projectElements = elementsForProject(project.id);
        cancelScheduledCommit(`project:${String(project.id)}`);
        for (const element of projectElements) cancelElementCommit(element.id);
        stopProjectMetadata(project.id);
        const wasActive = String(state.activeProjectId) === String(project.id);
        state.projects.splice(index, 1);
        state.elements = state.elements.filter((element) => String(element.projectId) !== String(project.id));
        markCloudDirty();
        if (wasActive) {
          const nextProject = state.projects[Math.min(index, state.projects.length - 1)] || null;
          state.activeProjectId = nextProject?.id || null;
          state.settings.activeProjectId = state.activeProjectId;
        }
        state.editingElementId = null;
        state.newElementId = null;
        if (String(state.videoComposer?.projectId) === String(project.id)) state.videoComposer = null;

      function cropFrameStyle(frame) {
        return `left:${frame.x * 100}%;top:${frame.y * 100}%;width:${frame.w * 100}%;height:${frame.h * 100}%;`;
      }

      function normalizeCrop(crop) {
        const fallback = { x: .1, y: .1, w: .8, h: .8 };
        if (!crop || typeof crop !== 'object') return fallback;
        const w = clamp(Number(crop.w) || fallback.w, .05, 1);
        const h = clamp(Number(crop.h) || fallback.h, .05, 1);
        return {
          x: clamp(Number(crop.x) || 0, 0, 1 - w),
          y: clamp(Number(crop.y) || 0, 0, 1 - h),
          w,
          h
        };
      }

      function renderCalibration() {
        const calibration = state.calibration;
        if (!calibration) {
          dom.calibrationSurface.classList.remove('is-open');
          dom.calibrationSurface.innerHTML = '';
          return;
        }
        dom.calibrationSurface.innerHTML = `
          <div class="calibration-card">
            <div class="calibration-head"><div><strong>Калибровка рамки</strong><br><span>Перетащите рамку и потяните за угол.</span></div><button class="icon-button" type="button" data-close-calibration aria-label="Закрыть">×</button></div>
            <div id="cropStage" class="crop-stage"><img src="${escapeAttribute(calibration.source)}" alt="Исходный скрин"><div id="cropFrame" class="crop-frame" style="${cropFrameStyle(calibration.frame)}"><span class="crop-handle" data-crop-handle="resize"></span></div></div>
            <div class="calibration-actions"><button id="cropDone" class="primary-button" type="button">Готово</button></div>
          </div>`;
        dom.calibrationSurface.classList.add('is-open');
      }

      function startCalibration(source, targetElementId = null) {
        state.calibration = { source, targetElementId, frame: normalizeCrop(state.settings.crop) };
        renderCalibration();
      }

      function closeCalibration() {
        state.calibration = null;
        state.cropDrag = null;
        renderCalibration();
      }

      function beginCropDrag(event) {
        if (!state.calibration) return;
        const stage = byId('cropStage');
        if (!stage) return;
        const rect = stage.getBoundingClientRect();
        state.cropDrag = {
          type: event.target.closest('[data-crop-handle]') ? 'resize' : 'move',
          startX: event.clientX,
          startY: event.clientY,
          stageWidth: rect.width,
          stageHeight: rect.height,
          frame: { ...state.calibration.frame }
        };
        event.preventDefault();
      }

      function moveCropDrag(event) {
        const drag = state.cropDrag;
        const calibration = state.calibration;
        if (!drag || !calibration) return;
        const dx = (event.clientX - drag.startX) / drag.stageWidth;
        const dy = (event.clientY - drag.startY) / drag.stageHeight;
        let next = { ...drag.frame };
        if (drag.type === 'resize') {
          next.w = clamp(drag.frame.w + dx, .05, 1 - drag.frame.x);
          next.h = clamp(drag.frame.h + dy, .05, 1 - drag.frame.y);
        } else {
          next.x = clamp(drag.frame.x + dx, 0, 1 - next.w);
          next.y = clamp(drag.frame.y + dy, 0, 1 - next.h);
        }
        calibration.frame = next;
        const frame = byId('cropFrame');
        if (frame) frame.style.cssText = cropFrameStyle(next);
      }

      async function imageFromDataUrl(dataUrl) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error('Скрин не удалось прочитать.'));
          image.src = dataUrl;
        });
      }

      async function cropImage(dataUrl, crop) {
        const image = await imageFromDataUrl(dataUrl);
        const frame = normalizeCrop(crop);
        const sourceWidth = Math.max(1, Math.round(image.naturalWidth * frame.w));
        const sourceHeight = Math.max(1, Math.round(image.naturalHeight * frame.h));
        const scale = Math.min(1, 1280 / Math.max(sourceWidth, sourceHeight));
        const width = Math.max(1, Math.round(sourceWidth * scale));
        const height = Math.max(1, Math.round(sourceHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');
        context.drawImage(image, Math.round(image.naturalWidth * frame.x), Math.round(image.naturalHeight * frame.y), sourceWidth, sourceHeight, 0, 0, width, height);
        return canvas.toDataURL('image/jpeg', .8);
      }

      async function compressImageDataUrl(dataUrl) {
        const image = await imageFromDataUrl(dataUrl);
        const sourceWidth = Math.max(1, image.naturalWidth || image.width);
        const sourceHeight = Math.max(1, image.naturalHeight || image.height);
        const scale = Math.min(1, 1280 / Math.max(sourceWidth, sourceHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(sourceWidth * scale));
        canvas.height = Math.max(1, Math.round(sourceHeight * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', .8);
      }

      async function completeCalibration() {
        const calibration = state.calibration;
        if (!calibration) return;
        const frame = normalizeCrop(calibration.frame);
        state.settings.crop = frame;
        state.settings.cropCalibrated = true;
        saveSettings(['crop', 'cropCalibrated']);
        closeCalibration();
        if (!calibration.targetElementId) {
          showToast('Рамка сохранена.');
          return;
        }
        try {
          const element = findElement(calibration.targetElementId);
          if (!element) return;
          element.image = await cropImage(calibration.source, frame);
          saveElement(element, false).catch(() => undefined);
          renderFeed();
        } catch (error) {
          showToast(error.message || 'Обрезка не удалась.');
        }
      }

      function dataUrlFromFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('Не удалось прочитать буфер обмена.'));
          reader.readAsDataURL(file);
        });
      }

      function currentProjectId() {
        if (state.activeProjectId && findProject(state.activeProjectId)) return findProject(state.activeProjectId).id;
        return state.projects[0]?.id || null;
      }

      async function handleImagePaste(file) {
        const projectId = currentProjectId();
        if (!projectId) {
          openVideoComposer();
          showToast('Сначала создайте ролик для этого скрина.');
          return;
        }
        try {
          const source = await compressImageDataUrl(await dataUrlFromFile(file));
          state.settings.lastCropSource = source;
          saveSettings(['lastCropSource']);
          const element = addElement(projectId, source);
          if (state.settings.cropCalibrated && state.settings.crop) {
            element.image = await cropImage(source, state.settings.crop);
            saveElement(element, false).catch(() => undefined);
            renderFeed();
          } else {
            startCalibration(source, element.id);
          }
        } catch (error) {
          showToast(error.message || 'Вставка скрина не удалась.');
        }
      }

      function parseTimecode(value) {
        const parts = asText(value).trim().split(':');
        if (!parts.length || parts.some((part) => !/^\d+(?:\.\d+)?$/.test(part))) return null;
        let seconds = 0;
        for (const part of parts) seconds = seconds * 60 + Number(part);
        return Number.isFinite(seconds) ? seconds : null;
      }

      function groupedElements() {
        const groups = new Map();
        for (const element of state.elements) {
          const key = elementName(element).toLocaleLowerCase().replace(/\s+/g, ' ').trim();
          const group = groups.get(key) || { name: elementName(element), count: 0, image: element.image, niches: new Set() };
          group.count += Math.max(1, element.repeatCount || 1);
          if (!group.image && element.image) group.image = element.image;
          const project = findProject(element.projectId);
          group.niches.add(project?.niche || 'Без ниши');
          groups.set(key, group);
        }
        return [...groups.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
      }

      function timelineMarkup(project) {
        const duration = parseTimecode(project.duration);
        const elements = elementsForProject(project.id);
        let stack = 0;
        const markers = [];
        for (const element of elements) {
          const time = parseTimecode(timecodesFrom(element)[0]);
          if (duration && time !== null && time <= duration) {
            const position = clamp((time / duration) * 100, 0, 100);
            markers.push(`<button class="timeline-marker" type="button" style="left:${position}%" aria-label="${escapeAttribute(elementName(element))}"><span class="timeline-tooltip">${escapeHtml(elementName(element))}</span></button>`);
          } else {
            stack += 1;
          }
        }
        const progress = projectProgress(project);
        return `<div class="timeline-row"><div class="timeline-name">${escapeHtml(project.title || 'Без названия')}</div><div class="timeline" data-duration="${escapeAttribute(project.duration || '—')}">${markers.join('')}${stack ? `<span class="timeline-stack">+${stack}</span>` : ''}</div><div class="mini-progress ${progress >= 100 ? 'is-complete' : ''}" style="--progress:${progress}%"><span></span></div></div>`;
      }

      const STAT_STOP_WORDS = new Set(('и в во не на что как с по для от до это а но или мы вы они он она оно ' +
        'the and for with from this that are was were have has into about your our you not all ' +
        'und der die das ein eine mit für von auf ist sind den dem nicht').split(/\s+/));

      function statisticsFor(projects) {
        const projectIds = new Set(projects.map((project) => String(project.id)));
        const elements = state.elements.filter((element) => projectIds.has(String(element.projectId)));
        const categories = new Map();
        const techniques = new Map();
        const keywords = new Map();
        for (const element of elements) {
          const category = categoryName(element.category) || 'Без категории';
          const categoryStat = categories.get(category) || { name: category, count: 0, repeats: 0 };
          categoryStat.count += 1;
          categoryStat.repeats += Math.max(1, Number(element.repeatCount) || 1);
          categories.set(category, categoryStat);
          const technique = asText(element.technique).trim();
          if (technique) techniques.set(technique, (techniques.get(technique) || 0) + 1);
          const words = `${element.description} ${element.technique}`.toLocaleLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
          for (const word of words) {
            if ([...word].length < 3 || STAT_STOP_WORDS.has(word)) continue;
            keywords.set(word, (keywords.get(word) || 0) + 1);
          }
        }
        const duration = projects.reduce((sum, project) => sum + (parseTimecode(project.duration) || 0), 0);
        const plannedSeconds = elements.length * 1.5;
        return {
          projects,
          elements,
          repeats: totalRepeats(elements),
          categories: [...categories.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ru')),
          techniques: [...techniques.entries()].map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ru')),
          keywords: [...keywords.entries()].map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ru')),
          withImage: elements.filter((element) => Boolean(element.image)).length,
          withTimecode: elements.filter((element) => timecodesFrom(element).length > 0).length,
          completed: projects.filter((project) => project.completed).length,
          plannedSeconds,
          duration
        };
      }

      function formatSeconds(seconds) {
        const total = Math.max(0, Math.round(seconds));
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
      }

      function statsSummaryMarkup(stats, includeProjects) {
        const completePercent = stats.projects.length ? Math.round((stats.completed / stats.projects.length) * 100) : 0;
        return `<div class="stat-summary">
          ${includeProjects ? `<div class="kpi"><div class="kpi-value">${stats.projects.length}</div><div class="kpi-label">Роликов</div></div>` : ''}
          <div class="kpi"><div class="kpi-value">${stats.elements.length}</div><div class="kpi-label">Элементов</div></div>
          <div class="kpi"><div class="kpi-value">${stats.repeats}</div><div class="kpi-label">Повторов</div></div>
          <div class="kpi"><div class="kpi-value">${stats.withImage}/${stats.elements.length}</div><div class="kpi-label">С картинкой</div></div>
          <div class="kpi"><div class="kpi-value">${completePercent}%</div><div class="kpi-label">Закончен</div></div>
        </div>`;
      }

      function statsListMarkup(items, total, kind) {
        if (!items.length) return '<div class="stat-note">Пока нет данных</div>';
        return `<div class="stat-list">${items.slice(0, 10).map((item) => {
          const percent = total ? Math.round((item.count / total) * 100) : 0;

          return `<div class="stat-entry"><span class="stat-entry-name">${kind === 'category' ? `<span class="category-icon">${categoryIcon(item.name)}</span>` : ''}${escapeHtml(item.name)}</span><span class="stat-entry-value">${label}</span>${kind === 'category' ? `<div class="stat-bar ${percent >= 100 ? 'is-complete' : ''}" style="--progress:${percent}%"><span></span></div>` : ''}</div>`;

        byId('statsTimeline').innerHTML = state.projects.map(timelineMarkup).join('') || '<div class="stat-note">Пока нет роликов</div>';
        requestAnimationFrame(() => drawBars(byId('statsBars')));

      function scheduleStatsUpdate() {
        if (!state.statsOpen) return;

      function renderStats() {

          dom.statsPanel.innerHTML = `<div class="panel-heading"><h2>📊 Статистика</h2><button class="icon-button close-panel" type="button" data-close-stats aria-label="Закрыть">×</button></div>

            <section class="stats-block"><h3>Ролики: элементы + повторы</h3><canvas id="statsBars" class="bar-chart" aria-label="График роликов"></canvas></section>

            <section class="stats-block"><h3>Структура роликов</h3><div id="statsTimeline"></div></section>`;

      function drawBars(canvas) {
        if (!canvas) return;
        const rows = state.projects.map((project) => ({
          name: project.title || 'Без названия',
          value: elementsForProject(project.id).length + totalRepeats(elementsForProject(project.id))
        }));
        const bounds = canvas.getBoundingClientRect();
        const ratio = Math.max(1, globalThis.devicePixelRatio || 1);
        canvas.width = Math.max(1, Math.floor(bounds.width * ratio));
        canvas.height = Math.max(1, Math.floor(bounds.height * ratio));
        const context = canvas.getContext('2d');
        context.scale(ratio, ratio);
        const width = bounds.width;
        const height = bounds.height;
        const maximum = Math.max(1, ...rows.map((row) => row.value));
        const start = performance.now();
        const duration = 500;
        const styles = getComputedStyle(document.documentElement);
        const accent = styles.getPropertyValue('--accent').trim();
        const muted = styles.getPropertyValue('--muted').trim();
        const surface = styles.getPropertyValue('--surface-raised').trim();
        const draw = (time) => {
          const progress = clamp((time - start) / duration, 0, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          context.clearRect(0, 0, width, height);
          context.fillStyle = surface;
          context.fillRect(0, 0, width, height);
          const left = 18;
          const bottom = 30;
          const chartHeight = Math.max(20, height - 48);
          const slot = (width - left * 2) / Math.max(1, rows.length);
          const barWidth = Math.max(5, Math.min(42, slot * .62));
          context.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
          context.textAlign = 'center';
          rows.forEach((row, index) => {
            const barHeight = (row.value / maximum) * chartHeight * eased;
            const x = left + index * slot + (slot - barWidth) / 2;
            const y = height - bottom - barHeight;
            context.fillStyle = accent;
            context.beginPath();
            context.roundRect(x, y, barWidth, barHeight, 3);
            context.fill();
            context.fillStyle = muted;
            const label = row.name.length > 12 ? `${row.name.slice(0, 11)}…` : row.name;
            context.fillText(label, x + barWidth / 2, height - 12);
          });
          if (progress < 1 && state.statsOpen) requestAnimationFrame(draw);
        };
        requestAnimationFrame(draw);
      }

      function exportSettings() {
        const copy = { ...state.settings };
        if (copy.backupDirectoryHandle) copy.backupDirectoryHandle = '[Локальная папка бэкапа сохраняется только в браузере]';
        return copy;
      }

      function catalogSnapshot() {
        return {
          version: CATALOG_VERSION,
          exportedAt: new Date().toISOString(),
          projects: state.projects.map((project) => ({ ...project, progress: projectProgress(project) })),
          elements: state.elements,
          categories: state.categories,
          settings: exportSettings()
        };
      }

      function base64FromText(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = '';
        const chunkSize = 0x8000;
        for (let start = 0; start < bytes.length; start += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(start, start + chunkSize));
        }
        return btoa(binary);
      }

      function textFromBase64(value) {
        const binary = atob(asText(value).replace(/\s/g, ''));
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        return new TextDecoder().decode(bytes);
      }

      function cloudHeaders(headers = {}) {
        const next = { Accept: 'application/vnd.github+json', ...headers };
        if (state.cloud.token) next.Authorization = `Bearer ${state.cloud.token}`;
        return next;
      }

      function emptyCloudSnapshot() {
        return { version: CATALOG_VERSION, exportedAt: '', projects: [], elements: [], categories: [], settings: {} };
      }

      function isCloudSnapshot(raw) {
        return Boolean(raw && typeof raw === 'object' && Array.isArray(raw.projects) && Array.isArray(raw.elements));
      }

      function cloneSnapshot(snapshot) {
        if (snapshot === undefined) return undefined;
        return JSON.parse(JSON.stringify(snapshot));
      }

      function prepareRemoteSnapshot(raw, meta = {}) {
        if (!isCloudSnapshot(raw)) throw new Error('Облачный data.json имеет неверную структуру.');
        return {
          raw,
          incoming: prepareImport(raw),
          sha: asText(meta.sha).trim(),
          etag: asText(meta.etag).trim(),
          empty: raw.projects.length === 0 && raw.elements.length === 0
        };
      }

      async function remoteSnapshotFromPayload(payload, contentsEtag = '') {
        if (!payload || payload.type !== 'file') throw new Error('Облачный data.json недоступен.');
        let source = '';
        if (payload.content && payload.encoding === 'base64') {
          source = textFromBase64(payload.content);
        } else if (payload.download_url) {
          const rawResponse = await fetch(payload.download_url, {
            method: 'GET',
            headers: { Accept: 'application/vnd.github.raw+json' },
            cache: 'no-store'
          });
          if (!rawResponse.ok) throw new Error(`GitHub raw GET: ${rawResponse.status}`);
          source = await rawResponse.text();
        } else {
          throw new Error('Облачный data.json не содержит содержимого.');
        }
        return prepareRemoteSnapshot(JSON.parse(source), { sha: payload.sha, etag: contentsEtag });
      }

      function getCloudSyncValue(key) {
        return new Promise((resolve, reject) => {
          const transaction = state.db.transaction('cloudSync', 'readonly');
          const request = transaction.objectStore('cloudSync').get(key);
          request.onsuccess = () => resolve(request.result?.value ?? null);
          request.onerror = () => reject(request.error || new Error('Не удалось прочитать облачный кэш.'));
        });
      }

      function writeCloudSyncBatch(entries = [], deleteKeys = []) {
        return runTransaction(['cloudSync'], 'readwrite', (transaction) => {
          const store = transaction.objectStore('cloudSync');
          for (const [key, value] of entries) store.put({ key, value, updatedAt: Date.now() });
          for (const key of deleteKeys) store.delete(key);
        });
      }

      function enqueueCloudSync(work, onError = null) {
        const job = state.cloud.syncQueue.then(work);
        state.cloud.syncQueue = job.catch((error) => {
          if (onError) onError(error);
        });
        return job;
      }

      function outboxMarker(record) {
        return JSON.stringify({
          version: 2,
          storage: 'indexedDB',
          revision: record.revision,
          baseSha: asText(record.baseSha).trim(),
          updatedAt: Date.now()
        });
      }

      function saveOutboxMarker(record) {
        return saveLocalValue(CLOUD_OUTBOX_KEY, outboxMarker(record));
      }

      function baseRecordFrom(snapshot, sha, contentsEtag) {
        const confirmed = cloneSnapshot(snapshot);
        return {
          version: 2,
          sha: asText(sha).trim(),
          contentsEtag: asText(contentsEtag).trim(),
          snapshot: confirmed,
          knownProjectIds: confirmed.projects.map((project) => String(project.id)),
          knownElementIds: confirmed.elements.map((element) => String(element.id)),
          savedAt: Date.now()
        };
      }

      function applyBaseRecord(record) {
        if (!record || !isCloudSnapshot(record.snapshot)) return false;
        state.cloud.baseSha = asText(record.sha).trim();
        state.cloud.baseEtag = asText(record.contentsEtag).trim();
        state.cloud.baseSnapshot = cloneSnapshot(record.snapshot);
        state.cloud.knownProjectIds = new Set((record.knownProjectIds || record.snapshot.projects.map((project) => project.id)).map(String));
        state.cloud.knownElementIds = new Set((record.knownElementIds || record.snapshot.elements.map((element) => element.id)).map(String));
        state.cloud.remoteProjectCount = record.snapshot.projects.length;
        state.cloud.initialPullDone = true;
        return true;
      }

      function validOutboxRecord(record) {
        return Boolean(record && Number.isInteger(record.revision) && record.revision > 0 && isCloudSnapshot(record.snapshot));
      }

      async function rememberRemoteSnapshot(raw) {
        if (!isCloudSnapshot(raw)) return false;
        await enqueueCloudSync(() => writeCloudSyncBatch([['cache', cloneSnapshot(raw)]]));
        return true;
      }

      async function loadCloudSyncState() {
        const [storedBase, storedOutbox, storedCache] = await Promise.all([
          getCloudSyncValue('base'), getCloudSyncValue('outbox'), getCloudSyncValue('cache')
        ]);
        applyBaseRecord(storedBase);

        let outbox = validOutboxRecord(storedOutbox) ? storedOutbox : null;
        const legacyOutboxText = localValue(CLOUD_OUTBOX_KEY);
        if (!outbox && legacyOutboxText) {
          try {
            const legacy = JSON.parse(legacyOutboxText);
            if (validOutboxRecord(legacy)) outbox = legacy;
          } catch (error) {
            state.cloud.outboxError = true;
          }
        }
        if (outbox) {
          outbox = {
            ...outbox,
            version: 2,
            baseSha: asText(outbox.baseSha || state.cloud.baseSha).trim(),
            baseEtag: asText(outbox.baseEtag || state.cloud.baseEtag).trim(),
            baseSnapshot: cloneSnapshot(isCloudSnapshot(outbox.baseSnapshot)
              ? outbox.baseSnapshot
              : (state.cloud.baseSnapshot || emptyCloudSnapshot()))
          };
          const outboxBase = baseRecordFrom(outbox.baseSnapshot, outbox.baseSha, outbox.baseEtag);
          await writeCloudSyncBatch([['base', outboxBase], ['outbox', outbox]]);
          applyBaseRecord(outboxBase);
          saveOutboxMarker(outbox);
          state.cloud.outbox = outbox;
          state.cloud.revision = Math.max(state.cloud.revision, outbox.revision);
          state.cloud.dirty = true;
          state.cloud.outboxError = false;
          state.cloud.baseSha = outbox.baseSha;
          state.cloud.baseEtag = outbox.baseEtag;
          state.cloud.baseSnapshot = cloneSnapshot(outbox.baseSnapshot);
          await rehydrateOutboxCatalog(outbox);
        } else if (legacyOutboxText) {
          removeLocalValue(CLOUD_OUTBOX_KEY);
        }

        let cacheMigrated = Boolean(storedCache);
        if (!storedCache) {
          const legacyCacheText = localValue(CLOUD_CACHE_KEY);
          if (legacyCacheText) {
            try {
              const legacyCache = JSON.parse(legacyCacheText);
              if (isCloudSnapshot(legacyCache)) {
                await writeCloudSyncBatch([['cache', legacyCache]]);
                cacheMigrated = true;
              }
            } catch (error) {
              // Invalid legacy cache is ignored; IndexedDB catalog data remains untouched.
            }
          }
        }
        if (cacheMigrated) removeLocalValue(CLOUD_CACHE_KEY);
      }

      async function rehydrateOutboxCatalog(record) {
        const incoming = prepareImport(record.snapshot);
        const base = isCloudSnapshot(record.baseSnapshot) ? record.baseSnapshot : emptyCloudSnapshot();
        const knownProjects = new Set(base.projects.map((project) => String(project.id)));
        const knownElements = new Set(base.elements.map((element) => String(element.id)));
        const currentProjectKeys = new Map(state.projects.map((project) => [String(project.id), project.id]));
        const currentElementKeys = new Map(state.elements.map((element) => [String(element.id), element.id]));
        const projectMap = new Map(incoming.projects.map((project) => [String(project.id), project]));
        const elementMap = new Map(incoming.elements.map((element) => [String(element.id), element]));
        let preservedUnknown = false;

        for (const project of state.projects) {
          const id = String(project.id);
          if (!knownProjects.has(id) && !projectMap.has(id)) {
            projectMap.set(id, project);
            preservedUnknown = true;
          }
        }
        for (const element of state.elements) {
          const id = String(element.id);
          if (!knownElements.has(id) && !elementMap.has(id) && projectMap.has(String(element.projectId))) {
            elementMap.set(id, element);
            preservedUnknown = true;
          }
        }

        state.projects = [...projectMap.values()];
        state.elements = [...elementMap.values()].filter((element) => projectMap.has(String(element.projectId)));
        state.categories = categoryRecords(state.elements, incoming.categories);
        state.settings = incoming.settings;
        state.activeProjectId = state.settings.activeProjectId && findProject(state.settings.activeProjectId)
          ? state.settings.activeProjectId : state.projects[0]?.id || null;
        state.editingElementId = null;
        state.newElementId = null;
        const automatic = applyAutomaticTimecodes();
        const finalProjectIds = new Set(state.projects.map((project) => String(project.id)));
        const finalElementIds = new Set(state.elements.map((element) => String(element.id)));
        await commit(() => runTransaction(['projects', 'elements', 'categories', 'settings'], 'readwrite', (transaction) => {
          const projects = transaction.objectStore('projects');
          const elements = transaction.objectStore('elements');
          for (const id of knownProjects) if (!finalProjectIds.has(id)) projects.delete(currentProjectKeys.get(id) ?? id);
          for (const id of knownElements) if (!finalElementIds.has(id)) elements.delete(currentElementKeys.get(id) ?? id);
          for (const project of state.projects) projects.put(project);
          for (const element of state.elements) elements.put(element);
          writeCategoryRecords(transaction);
          const settings = transaction.objectStore('settings');
          for (const [key, value] of Object.entries(state.settings)) settings.put({ key, value });
        }), { backup: false });
        if (automatic.length || preservedUnknown) persistCloudOutbox(catalogSnapshot());
        applyTheme();
      }

      function persistCloudOutbox(snapshot = catalogSnapshot()) {
        const record = {
          version: 2,
          revision: state.cloud.revision + 1,
          createdAt: Date.now(),
          baseSha: state.cloud.baseSha,
          baseEtag: state.cloud.baseEtag,
          baseSnapshot: cloneSnapshot(state.cloud.baseSnapshot || emptyCloudSnapshot()),
          snapshot: cloneSnapshot(snapshot)
        };
        state.cloud.revision = record.revision;
        state.cloud.outbox = record;
        state.cloud.dirty = true;
        state.cloud.outboxError = false;
        saveOutboxMarker(record);
        enqueueCloudSync(() => writeCloudSyncBatch([['outbox', record]]), () => {
          if (state.cloud.outbox?.revision === record.revision) {
            state.cloud.outboxError = true;
            setCloudError('Ошибка: локального хранилища');
          }
        });
        return true;
      }

      async function clearCloudOutbox(revision) {
        if (!state.cloud.outbox || state.cloud.outbox.revision !== revision) return false;
        await enqueueCloudSync(() => writeCloudSyncBatch([], ['outbox']));
        if (!state.cloud.outbox || state.cloud.outbox.revision !== revision) return false;
        removeLocalValue(CLOUD_OUTBOX_KEY);
        state.cloud.outbox = null;
        state.cloud.dirty = false;
        state.cloud.outboxError = false;
        return true;
      }

      function stableJson(value) {
        if (Array.isArray(value)) return `[${value.map(stableJson).join(',')}]`;
        if (value && typeof value === 'object') {
          return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableJson(value[key])}`).join(',')}}`;
        }
        return JSON.stringify(value);
      }

      function valuesEqual(left, right) {
        return stableJson(left) === stableJson(right);
      }

      function mergeRecordFields(base, remote, local, path, conflicts) {
        const merged = {};
        const keys = new Set([...Object.keys(base || {}), ...Object.keys(remote || {}), ...Object.keys(local || {})]);
        for (const key of [...keys].sort()) {
          const baseHas = hasOwn(base || {}, key);
          const remoteHas = hasOwn(remote || {}, key);
          const localHas = hasOwn(local || {}, key);
          const baseValue = baseHas ? base[key] : undefined;
          const remoteValue = remoteHas ? remote[key] : undefined;
          const localValueNext = localHas ? local[key] : undefined;
          const remoteChanged = remoteHas !== baseHas || !valuesEqual(remoteValue, baseValue);
          const localChanged = localHas !== baseHas || !valuesEqual(localValueNext, baseValue);
          let chosenHas = baseHas;
          let chosen = baseValue;
          if (remoteChanged && !localChanged) {
            chosenHas = remoteHas;
            chosen = remoteValue;
          } else if (localChanged && !remoteChanged) {
            chosenHas = localHas;
            chosen = localValueNext;
          } else if (remoteChanged && localChanged) {
            if (remoteHas === localHas && valuesEqual(remoteValue, localValueNext)) {
              chosenHas = remoteHas;
              chosen = remoteValue;
            } else if (key === 'updatedAt') {
              chosenHas = remoteHas || localHas;
              chosen = Math.max(Number(remoteValue) || 0, Number(localValueNext) || 0) || remoteValue || localValueNext;
            } else if (key === 'progress' || key === 'uses' || key === 'repeats') {
              chosenHas = localHas;
              chosen = localValueNext;
            } else {
              conflicts.push(`${path}.${key}`);
              continue;
            }
          }
          if (chosenHas) merged[key] = cloneSnapshot(chosen);
        }
        return merged;
      }

      function snapshotIdentityMap(rows, identity) {
        return new Map(rows.map((row) => [identity(row), row]));
      }

      function knownRemoteDeletions(knownIds, freshIds) {
        const fresh = new Set([...freshIds].map(String));
        return [...knownIds].map(String).filter((id) => !fresh.has(id)).sort();
      }

      function mergeEntityCollections(baseRows, remoteRows, localRows, identity, path, conflicts) {
        const baseMap = snapshotIdentityMap(baseRows, identity);
        const remoteMap = snapshotIdentityMap(remoteRows, identity);
        const localMap = snapshotIdentityMap(localRows, identity);
        const orderedIds = [];
        const seen = new Set();
        for (const row of [...localRows, ...remoteRows, ...baseRows]) {
          const id = identity(row);
          if (!seen.has(id)) {
            seen.add(id);
            orderedIds.push(id);
          }
        }
        const merged = [];
        for (const id of orderedIds) {
          const baseHas = baseMap.has(id);
          const remoteHas = remoteMap.has(id);
          const localHas = localMap.has(id);
          const base = baseMap.get(id);
          const remote = remoteMap.get(id);
          const local = localMap.get(id);
          if (!baseHas) {
            if (remoteHas && localHas) {
              const row = mergeRecordFields({}, remote, local, `${path}[${id}]`, conflicts);
              if (!conflicts.some((entry) => entry.startsWith(`${path}[${id}]`))) merged.push(row);
            } else if (localHas) merged.push(cloneSnapshot(local));
            else if (remoteHas) merged.push(cloneSnapshot(remote));
            continue;
          }
          if (!remoteHas && !localHas) continue;
          if (!remoteHas) {
            if (valuesEqual(local, base)) continue;
            conflicts.push(`${path}[${id}]: удалено в облаке, изменено локально`);
            continue;
          }
          if (!localHas) {
            if (valuesEqual(remote, base)) continue;
            conflicts.push(`${path}[${id}]: удалено локально, изменено в облаке`);
            continue;
          }
          merged.push(mergeRecordFields(base, remote, local, `${path}[${id}]`, conflicts));
        }
        return merged;
      }

      function mergeCloudSnapshots(base, remote, local) {
        if (![base, remote, local].every(isCloudSnapshot)) return { ok: false, conflicts: ['snapshot: неверная структура'] };
        const conflicts = [];
        const projectIdentity = (row) => String(row.id);
        const elementIdentity = (row) => String(row.id);
        const categoryIdentity = (row) => asText(row.key || categoryKey(row.name)).trim();
        const projects = mergeEntityCollections(base.projects, remote.projects, local.projects, projectIdentity, 'projects', conflicts);
        const elements = mergeEntityCollections(base.elements, remote.elements, local.elements, elementIdentity, 'elements', conflicts);
        const categories = mergeEntityCollections(base.categories || [], remote.categories || [], local.categories || [], categoryIdentity, 'categories', conflicts);
        const settings = mergeRecordFields(base.settings || {}, remote.settings || {}, local.settings || {}, 'settings', conflicts);
        if (conflicts.length) return { ok: false, conflicts: [...new Set(conflicts)].sort() };
        return {
          ok: true,
          conflicts: [],
          snapshot: {
            version: Math.max(Number(base.version) || 0, Number(remote.version) || 0, Number(local.version) || CATALOG_VERSION),
            exportedAt: new Date().toISOString(),
            projects,
            elements,
            categories,
            settings
          }
        };
      }

      async function rebaseOutboxRecord(record, freshRemote) {
        if (!validOutboxRecord(record) || !freshRemote || freshRemote.unchanged) {
          return { ok: false, conflicts: ['outbox: недоступна база слияния'] };
        }
        if (state.cloud.outbox?.revision !== record.revision) return { ok: false, stale: true, conflicts: [] };
        const base = isCloudSnapshot(record.baseSnapshot)
          ? record.baseSnapshot
          : (state.cloud.baseSnapshot || emptyCloudSnapshot());
        const merged = mergeCloudSnapshots(base, freshRemote.raw, record.snapshot);
        if (!merged.ok) return merged;
        const rebased = {
          ...record,
          version: 2,
          baseSha: freshRemote.sha,
          baseEtag: freshRemote.etag,
          baseSnapshot: cloneSnapshot(freshRemote.raw),
          snapshot: merged.snapshot,
          rebasedAt: Date.now()
        };
        const baseRecord = baseRecordFrom(freshRemote.raw, freshRemote.sha, freshRemote.etag);
        await enqueueCloudSync(() => writeCloudSyncBatch([['base', baseRecord], ['outbox', rebased]]));
        if (state.cloud.outbox?.revision !== record.revision) return { ok: false, stale: true, conflicts: [] };
        state.cloud.outbox = rebased;
        state.cloud.baseSha = freshRemote.sha;
        state.cloud.baseEtag = freshRemote.etag;
        state.cloud.baseSnapshot = cloneSnapshot(freshRemote.raw);
        updateKnownRemoteIds(freshRemote.incoming);
        state.cloud.initialPullDone = true;
        saveOutboxMarker(rebased);
        return { ok: true, record: rebased };
      }

      async function snapshotHash(serialized) {
        const bytes = new TextEncoder().encode(serialized);
        if (globalThis.crypto?.subtle) {
          const digest = new Uint8Array(await globalThis.crypto.subtle.digest('SHA-256', bytes));
          return [...digest].map((byte) => byte.toString(16).padStart(2, '0')).join('');
        }
        let hash = 2166136261;
        for (const byte of bytes) hash = Math.imul(hash ^ byte, 16777619) >>> 0;
        return `fnv1a-${hash.toString(16).padStart(8, '0')}`;
      }

      async function persistConfirmedBackup(snapshot, sha) {
        if (!isCloudSnapshot(snapshot)) return false;
        const confirmed = cloneSnapshot(snapshot);
        const serialized = JSON.stringify(confirmed);
        const hash = await snapshotHash(serialized);
        const record = { version: 2, sha: asText(sha).trim(), hash, bytes: new Blob([serialized]).size, snapshot: confirmed, savedAt: Date.now() };
        try {
          await enqueueCloudSync(() => writeCloudSyncBatch([['backup', record]]));
          const verified = await getCloudSyncValue('backup');
          if (!verified || verified.hash !== hash || !isCloudSnapshot(verified.snapshot) || !valuesEqual(verified.snapshot, confirmed)) return false;
        } catch (error) {
          return false;
        }
        try {
          localStorage.setItem(CLOUD_BACKUP_KEY, serialized);
          const fullStored = localStorage.getItem(CLOUD_BACKUP_KEY);
          if (fullStored === serialized) {
            saveLocalValue(CLOUD_BACKUP_COMPAT_KEY, JSON.stringify({ version: 2, storage: 'localStorage', key: CLOUD_BACKUP_KEY, hash, bytes: record.bytes }));
            return true;
          }
        } catch (error) {
          // Large snapshots fall back to the verified IndexedDB copy plus a compact manifest.
        }
        const manifest = JSON.stringify({ version: 2, storage: 'indexedDB', store: 'cloudSync', key: 'backup', sha: record.sha, hash, bytes: record.bytes, savedAt: record.savedAt });
        if (!saveLocalValue(CLOUD_BACKUP_KEY, manifest)) return false;
        saveLocalValue(CLOUD_BACKUP_COMPAT_KEY, manifest);
        return localValue(CLOUD_BACKUP_KEY) === manifest;
      }

      function setCloudError(message) {
        state.cloud.error = message;
        setSaveState('error', message);
      }

      function markCloudDirty({ allowDuringImport = false } = {}) {
        if (state.cloud.applying || (state.cloud.importing && !allowDuringImport)) return false;
        persistCloudOutbox();
        state.cloud.error = '';
        if (state.cloud.ready && state.cloud.token && !state.cloud.importing) scheduleCloudSave();
        setSaveState(state.cloud.token ? 'saving' : 'error', state.cloud.token ? 'Сохранение…' : 'Ошибка: нет токена');
        return true;
      }

      function scheduleCloudSave() {
        if (state.cloud.importing) return;
        clearTimeout(state.cloud.saveTimer);
        state.cloud.saveTimer = setTimeout(() => saveCloud().catch(() => undefined), CLOUD_SAVE_DELAY);
      }

      function updateKnownRemoteIds(incoming) {
        state.cloud.knownProjectIds = new Set(incoming.projects.map((project) => String(project.id)));
        state.cloud.knownElementIds = new Set(incoming.elements.map((element) => String(element.id)));
        state.cloud.remoteProjectCount = incoming.projects.length;
      }

      async function commitAppliedRemote(remote) {
        const record = baseRecordFrom(remote.raw, remote.sha, remote.etag);
        await enqueueCloudSync(() => writeCloudSyncBatch([['base', record], ['cache', cloneSnapshot(remote.raw)]]));
        state.cloud.baseSha = remote.sha;
        state.cloud.baseEtag = remote.etag;
        state.cloud.baseSnapshot = cloneSnapshot(remote.raw);
        state.cloud.observedSha = remote.sha;
        state.cloud.observedEtag = remote.etag || state.cloud.observedEtag;
        updateKnownRemoteIds(remote.incoming);
        state.cloud.initialPullDone = true;
      }

      function canApplyRemote() {
        return !state.cloud.dirty && !state.cloud.saving && !state.cloud.importing && !isTextEditing();
      }

      function remoteDataChanged(remote) {
        const remoteProjectIds = new Set(remote.incoming.projects.map((project) => String(project.id)));
        const remoteElementIds = new Set(remote.incoming.elements.map((element) => String(element.id)));
        return [...state.cloud.knownProjectIds].some((id) => !remoteProjectIds.has(id) && findProject(id))
          || [...state.cloud.knownElementIds].some((id) => !remoteElementIds.has(id) && findElement(id))
          || remote.incoming.projects.some((project) => JSON.stringify(findProject(project.id)) !== JSON.stringify(project))
          || remote.incoming.elements.some((element) => JSON.stringify(findElement(element.id)) !== JSON.stringify(element))
          || remoteSettingsEntries(remote).some(([key, value]) => JSON.stringify(state.settings[key]) !== JSON.stringify(value));
      }

      function remoteSettingsEntries(remote) {
        const rawSettings = remote?.raw?.settings;
        if (Array.isArray(rawSettings)) {
          return rawSettings.filter((row) => row && hasOwn(row, 'key')).map((row) => [row.key, remote.incoming.settings[row.key]]);
        }
        if (rawSettings && typeof rawSettings === 'object') {
          return Object.keys(rawSettings).map((key) => [key, remote.incoming.settings[key]]);
        }
        return [];
      }

      async function applyRemoteSnapshot(remote, { allowDirty = false, suppressCloudMark = false } = {}) {
        if (!remote || remote.unchanged) return false;
        if (!allowDirty && !canApplyRemote()) {
          state.cloud.pendingSnapshot = remote;
          return false;
        }
        const firstEmptyCloudMigration = remote.empty
          && !state.cloud.initialPullDone
          && !state.cloud.baseSnapshot
          && state.projects.length > 0;
        if (firstEmptyCloudMigration) {
          await commitAppliedRemote(remote);
          state.cloud.pendingSnapshot = null;
          if (!suppressCloudMark && state.projects.length > 0 && state.cloud.token && !state.cloud.outbox) markCloudDirty();
          setSaveState('saved', 'Сохранено');
          return true;
        }

        const changed = remoteDataChanged(remote);
        const previousEditing = state.editingElementId;
        const previousNew = state.newElementId;
        const previousActive = state.activeProjectId;
        const previousScroll = dom.workspace.scrollTop;
        const projectMap = new Map(state.projects.map((project) => [String(project.id), project]));
        const elementMap = new Map(state.elements.map((element) => [String(element.id), element]));
        const currentProjectKeys = new Map(state.projects.map((project) => [String(project.id), project.id]));
        const currentElementKeys = new Map(state.elements.map((element) => [String(element.id), element.id]));
        const previousKnownProjects = new Set(state.cloud.knownProjectIds);
        const previousKnownElements = new Set(state.cloud.knownElementIds);
        const remoteProjectIds = new Set(remote.incoming.projects.map((project) => String(project.id)));
        const remoteElementIds = new Set(remote.incoming.elements.map((element) => String(element.id)));
        const deletedElementIds = new Set(knownRemoteDeletions(previousKnownElements, remoteElementIds));
        for (const id of deletedElementIds) elementMap.delete(id);
        const deletedProjectIds = new Set();
        for (const id of knownRemoteDeletions(previousKnownProjects, remoteProjectIds)) {
          const hasUnknownChild = [...elementMap.values()].some((element) => String(element.projectId) === id && !previousKnownElements.has(String(element.id)));
          if (!hasUnknownChild) {
            projectMap.delete(id);
            deletedProjectIds.add(id);
          }
        }
        for (const project of remote.incoming.projects) projectMap.set(String(project.id), project);
        for (const element of remote.incoming.elements) elementMap.set(String(element.id), element);
        const preservedUnknown = [...projectMap.keys()].some((id) => !remoteProjectIds.has(id) && !previousKnownProjects.has(id))
          || [...elementMap.keys()].some((id) => !remoteElementIds.has(id) && !previousKnownElements.has(id));

        let automatic = [];
        state.cloud.applying = true;
        applyReadOnlyState();
        try {
          state.projects = [...projectMap.values()];
          state.elements = [...elementMap.values()].filter((element) => projectMap.has(String(element.projectId)));
          state.categories = categoryRecords(state.elements, remote.incoming.categories);
          state.settings = { ...state.settings, ...Object.fromEntries(remoteSettingsEntries(remote)) };
          state.activeProjectId = previousActive && findProject(previousActive) ? previousActive
            : (state.settings.activeProjectId && findProject(state.settings.activeProjectId) ? state.settings.activeProjectId : state.projects[0]?.id || null);
          state.editingElementId = previousEditing && findElement(previousEditing) ? previousEditing : null;
          state.newElementId = previousNew && findElement(previousNew) ? previousNew : null;
          automatic = applyAutomaticTimecodes();
          await commit(() => runTransaction(['projects', 'elements', 'categories', 'settings'], 'readwrite', (transaction) => {
            const projects = transaction.objectStore('projects');
            const elements = transaction.objectStore('elements');
            for (const id of deletedElementIds) elements.delete(currentElementKeys.get(id) ?? id);
            for (const id of deletedProjectIds) projects.delete(currentProjectKeys.get(id) ?? id);
            for (const project of remote.incoming.projects) projects.put(project);
            for (const element of remote.incoming.elements) elements.put(element);
            for (const element of automatic) elements.put(element);
            writeCategoryRecords(transaction);
            const settings = transaction.objectStore('settings');
            for (const [key, value] of remoteSettingsEntries(remote)) settings.put({ key, value });
          }), { backup: false });
          await commitAppliedRemote(remote);
          state.cloud.pendingSnapshot = null;
          applyTheme();
          if (changed || automatic.length) {
            renderFeed();
            dom.workspace.scrollTop = previousScroll;
          }
        } finally {
          state.cloud.applying = false;
          applyReadOnlyState();
        }
        if ((automatic.length || preservedUnknown) && state.cloud.token && !suppressCloudMark) markCloudDirty();
        setSaveState('saved', 'Сохранено');
        return changed || automatic.length > 0;
      }

      async function applyPendingRemoteSnapshot() {
        const pending = state.cloud.pendingSnapshot;
        if (!pending || !canApplyRemote()) return;
        await applyRemoteSnapshot(pending);
      }

      async function getCloudSnapshot({ force = false, apply = true } = {}) {
        const headers = cloudHeaders(force ? {} : { 'If-None-Match': state.cloud.observedEtag || '""' });
        const response = await fetch(GITHUB_CONTENTS_URL, { method: 'GET', headers, cache: 'no-store' });
        if (response.status === 304) return { unchanged: true };
        const responseEtag = response.headers.get('ETag') || '';
        let remote;
        if (response.status === 404) {
          remote = prepareRemoteSnapshot(emptyCloudSnapshot(), { sha: '', etag: responseEtag });
        } else {
          if (!response.ok) throw new Error(`GitHub GET: ${response.status}`);
          const payload = await response.json();
          remote = await remoteSnapshotFromPayload(payload, responseEtag);
        }
        state.cloud.observedSha = remote.sha;
        state.cloud.observedEtag = remote.etag || responseEtag || state.cloud.observedEtag;
        state.cloud.remoteProjectCount = remote.incoming.projects.length;
        state.cloud.error = state.cloud.token ? '' : 'Ошибка: нет токена';
        await rememberRemoteSnapshot(remote.raw);
        if (state.cloud.importing || state.cloud.pollPaused) return remote;
        if (apply) {
          if (canApplyRemote()) await applyRemoteSnapshot(remote);
          else state.cloud.pendingSnapshot = remote;
        }
        return remote;
      }

      async function archiveGuardedOutbox(record) {
        if (!validOutboxRecord(record) || state.cloud.outbox?.revision !== record.revision) return false;
        const archived = { ...record, blocked: true, blockedAt: Date.now(), reason: 'empty-local-remote-nonempty' };
        await enqueueCloudSync(() => writeCloudSyncBatch([['guardedOutbox', archived]], ['outbox']));
        saveLocalValue(CLOUD_GUARDED_OUTBOX_KEY, JSON.stringify({ version: 2, storage: 'indexedDB', key: 'guardedOutbox', revision: record.revision }));
        removeLocalValue(CLOUD_OUTBOX_KEY);
        state.cloud.outbox = null;
        state.cloud.dirty = false;
        state.cloud.outboxError = false;
        return true;
      }

      async function finalizeCloudPut(sending, sha) {
        await state.cloud.syncQueue;
        const confirmedSnapshot = cloneSnapshot(sending.snapshot);
        const baseRecord = baseRecordFrom(confirmedSnapshot, sha, '');
        const current = state.cloud.outbox;
        let rebased = null;
        let mergeConflicts = [];
        if (current && current.revision !== sending.revision) {
          const base = isCloudSnapshot(current.baseSnapshot) ? current.baseSnapshot : (state.cloud.baseSnapshot || emptyCloudSnapshot());
          const merged = mergeCloudSnapshots(base, confirmedSnapshot, current.snapshot);
          if (merged.ok) {
            rebased = {
              ...current,
              baseSha: sha,
              baseEtag: '',
              baseSnapshot: confirmedSnapshot,
              snapshot: merged.snapshot,
              rebasedAt: Date.now()
            };
          } else {
            mergeConflicts = merged.conflicts;
          }
        }
        const entries = [['base', baseRecord], ['cache', confirmedSnapshot]];
        const deleteKeys = [];
        if (!current || current.revision === sending.revision) deleteKeys.push('outbox');
        else if (rebased) entries.push(['outbox', rebased]);
        await enqueueCloudSync(() => writeCloudSyncBatch(entries, deleteKeys));

        state.cloud.baseSha = sha;
        state.cloud.baseEtag = '';
        state.cloud.baseSnapshot = confirmedSnapshot;
        state.cloud.observedSha = sha;
        updateKnownRemoteIds(prepareImport(confirmedSnapshot));
        state.cloud.initialPullDone = true;
        state.cloud.pendingSnapshot = null;
        if (!current || current.revision === sending.revision) {
          removeLocalValue(CLOUD_OUTBOX_KEY);
          state.cloud.outbox = null;
          state.cloud.dirty = false;
          state.cloud.outboxError = false;
        } else if (rebased) {
          state.cloud.outbox = rebased;
          state.cloud.dirty = true;
          saveOutboxMarker(rebased);
        }
        return { ok: mergeConflicts.length === 0, conflicts: mergeConflicts };
      }

      async function saveCloud() {
        if (!state.cloud.dirty || state.cloud.saving || state.cloud.importing) return;
        if (!state.cloud.token) {
          setCloudError('Ошибка: нет токена');
          return;
        }
        await state.cloud.syncQueue;
        let sending = state.cloud.outbox;
        if (!sending || state.cloud.outboxError) {
          setCloudError('Ошибка: локального хранилища');
          return;
        }
        state.cloud.saving = true;
        state.cloud.error = '';
        const generation = state.cloud.generation;
        let status = '';
        let succeeded = false;
        let conflictDetails = [];
        let retryCount = 0;
        try {
          let remote = await getCloudSnapshot({ force: true, apply: false });
          if (generation !== state.cloud.generation || state.cloud.importing) {
            status = 'cancelled';
          } else if (sending.snapshot.projects.length === 0 && remote.incoming.projects.length > 0) {
            if (!await archiveGuardedOutbox(sending)) status = 'cancelled';
            else {
              await applyRemoteSnapshot(remote, { allowDirty: true, suppressCloudMark: true });
              status = 'guarded';
            }
          } else if (remote.sha !== asText(sending.baseSha).trim()) {
            const rebased = await rebaseOutboxRecord(sending, remote);
            if (rebased.stale) status = 'cancelled';
            else if (!rebased.ok) {
              conflictDetails = rebased.conflicts;
              status = 'merge-conflict';
            } else {
              sending = rebased.record;
            }
          }

          while (!status) {
            if (generation !== state.cloud.generation || state.cloud.importing || state.cloud.outbox?.revision !== sending.revision) {
              status = 'cancelled';
              break;
            }
            if (sending.snapshot.projects.length === 0 && remote.incoming.projects.length > 0) {
              if (!await archiveGuardedOutbox(sending)) status = 'cancelled';
              else {
                await applyRemoteSnapshot(remote, { allowDirty: true, suppressCloudMark: true });
                status = 'guarded';
              }
              break;
            }
            if (!await persistConfirmedBackup(remote.raw, remote.sha)) {
              status = 'backup-error';
              break;
            }
            const response = await fetch(GITHUB_CONTENTS_URL, {
              method: 'PUT',
              headers: cloudHeaders({ 'Content-Type': 'application/json' }),
              body: JSON.stringify({
                message: 'chore: update catalog data',
                branch: GITHUB_BRANCH,
                content: base64FromText(JSON.stringify(sending.snapshot, null, 2)),
                ...(sending.baseSha ? { sha: sending.baseSha } : {})
              })
            });
            if (response.status === 409 || response.status === 422) {
              if (retryCount >= 1) {
                status = 'retry-conflict';
                break;
              }
              const fresh = await getCloudSnapshot({ force: true, apply: false });
              if (sending.snapshot.projects.length === 0 && fresh.incoming.projects.length > 0) {
                if (!await archiveGuardedOutbox(sending)) status = 'cancelled';
                else {
                  await applyRemoteSnapshot(fresh, { allowDirty: true, suppressCloudMark: true });
                  status = 'guarded';
                }
                break;
              }
              const rebased = await rebaseOutboxRecord(sending, fresh);
              if (rebased.stale) {
                status = 'cancelled';
                break;
              }
              if (!rebased.ok) {
                conflictDetails = rebased.conflicts;
                status = 'merge-conflict';
                break;
              }
              sending = rebased.record;
              remote = fresh;
              retryCount += 1;
              continue;
            }
            if (!response.ok) throw new Error(`GitHub PUT: ${response.status}`);
            const payload = await response.json();
            const sha = asText(payload?.content?.sha).trim() || sending.baseSha;
            const finalized = await finalizeCloudPut(sending, sha);
            succeeded = true;
            if (!finalized.ok) {
              conflictDetails = finalized.conflicts;
              status = 'post-put-conflict';
            }
            break;
          }
        } catch (error) {
          status = 'network';
        } finally {
          state.cloud.saving = false;
        }
        if (status === 'merge-conflict' || status === 'post-put-conflict') {
          const hint = conflictDetails.slice(0, 2).join(', ');
          setCloudError(`Ошибка: конфликт полей${hint ? ` — ${hint}` : ''}`);
        }
        else if (status === 'retry-conflict') setCloudError('Ошибка: конфликт SHA после одного повтора');
        else if (status === 'backup-error') setCloudError('Ошибка: резервная копия не сохранена');
        else if (status === 'network') setCloudError('Ошибка: сети');
        else if (status === 'guarded') setSaveState('saved', 'Сохранено');
        else if (status === 'cancelled') {
          if (state.cloud.dirty && state.cloud.token && !state.cloud.importing) scheduleCloudSave();
          setSaveState(state.cloud.dirty ? 'saving' : 'saved', state.cloud.dirty ? 'Сохранение…' : 'Сохранено');
        }
        else if (!status && succeeded) {
          if (state.cloud.dirty) scheduleCloudSave();
          setSaveState('saved', 'Сохранено');
        }
      }

      async function pollCloud() {
        if (state.cloud.pollInFlight || state.cloud.pollPaused || state.cloud.importing) return;
        state.cloud.pollInFlight = true;
        try {
          await getCloudSnapshot();
          await applyPendingRemoteSnapshot();
          if (state.cloud.dirty && state.cloud.token && !state.cloud.saving) scheduleCloudSave();
        } catch (error) {
          if (!state.cloud.dirty && !state.cloud.saving) setCloudError('Ошибка: сети');
        } finally {
          state.cloud.pollInFlight = false;
        }
      }

      function startCloudPolling() {
        clearInterval(state.cloud.pollTimer);
        state.cloud.pollTimer = setInterval(pollCloud, CLOUD_POLL_INTERVAL);
      }

      async function initializeCloud() {
        let cloudLoaded = false;
        try {
          await getCloudSnapshot({ force: true, apply: true });
          cloudLoaded = true;
          if (state.cloud.dirty && state.cloud.token) scheduleCloudSave();
          if (!state.cloud.dirty) setSaveState('saved', 'Сохранено');
        } catch (error) {
          const cached = await getCloudSyncValue('cache').catch(() => null);
          if (!state.projects.length && isCloudSnapshot(cached)) {
            try {
              await applyRemoteSnapshot(prepareRemoteSnapshot(cached), { suppressCloudMark: true });
            } catch (cacheError) {
              // IndexedDB remains the safe offline cache when a cached cloud snapshot is invalid.
            }
          }
          setCloudError('Ошибка: сети');
        }
        startCloudPolling();
        applyReadOnlyState();
        if (state.cloud.dirty && state.cloud.token) scheduleCloudSave();
        if (cloudLoaded && !state.cloud.token) setCloudError('Ошибка: нет токена');
      }
