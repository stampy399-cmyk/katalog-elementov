<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>РУЧНОЙ каталог отбора</title>
  <style>
    :root {
      --bg: #101215;
      --surface: #16191d;
      --surface-raised: #1b1f24;
      --line: #23262b;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #4f8cff;
      --accent-soft: rgba(79, 140, 255, .16);
      --danger: #e56b6f;
      --shadow: 0 16px 40px rgba(0, 0, 0, .22);
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-raised: #f0f2f4;
      --line: #dfe3e7;
      --text: #1d2127;
      --muted: #68707a;
      --accent: #3677e8;
      --accent-soft: rgba(54, 119, 232, .13);
      --shadow: 0 16px 40px rgba(20, 28, 38, .12);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .002em;
      transition: background 200ms ease-out, color 200ms ease-out;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    input, textarea {
      width: 100%;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      outline: 0;
    }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: .74; }
    textarea { resize: vertical; }

    .app { min-height: 100vh; padding: 0 20px 112px; }
    .topbar {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 880px;
      min-height: 58px;
      margin: 0 auto;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
      backdrop-filter: blur(14px);
    }
    .brand { flex: 0 0 auto; font-size: 15px; font-weight: 650; letter-spacing: -.012em; white-space: nowrap; }
    .search-wrap { flex: 1 1 auto; min-width: 80px; }
    .search {
      height: 32px;
      padding: 0 10px;
      background: var(--surface-raised);
      border: 1px solid transparent;
      transition: border-color 200ms ease-out, background 200ms ease-out;
    }
    .search:focus { border-color: var(--line); background: var(--surface); }
    .save-state { display: inline-flex; align-items: center; gap: 6px; min-width: 59px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .save-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 200ms ease-out, transform 200ms ease-out; }
    .save-state[data-state="saving"]::before { background: var(--accent); transform: scale(1.2); }
    .save-state[data-state="saved"]::before { border-radius: 1px; width: 8px; height: 5px; background: transparent; border-left: 1.5px solid var(--accent); border-bottom: 1.5px solid var(--accent); transform: rotate(-45deg) translateY(-1px); }
    .save-state[data-state="error"]::before { background: var(--danger); }
    .server-refresh { flex: 0 0 auto; min-height: 30px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-raised); color: var(--muted); cursor: pointer; white-space: nowrap; }
    .server-refresh:hover, .server-refresh:focus-visible { border-color: var(--accent); color: var(--text); }
    .server-refresh:disabled { cursor: wait; opacity: .55; }
    .icon-button, .quiet-button, .menu-item, .add-element, .project-toggle, .repeat-badge, .undo-button, .auto-progress {
      border: 0;
      cursor: pointer;
      background: transparent;
      transition: background 190ms ease-out, color 190ms ease-out, transform 190ms ease-out, opacity 190ms ease-out;
    }
    .icon-button { display: grid; width: 32px; height: 32px; place-items: center; padding: 0; border-radius: 8px; color: var(--muted); font-size: 18px; line-height: 1; }
    .icon-button:hover, .icon-button:focus-visible { color: var(--text); background: var(--surface-raised); }
    .icon-button:active, .quiet-button:active, .menu-item:active, .add-element:active { transform: scale(.96); }

    .feed { max-width: 880px; margin: 24px auto 0; }
    .empty-state { padding: 78px 20px; color: var(--muted); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 5px; color: var(--text); font-weight: 600; }
    .video-section, .video-composer, .element-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 5px 16px rgba(0, 0, 0, .06);
    }
    .video-section { overflow: clip; margin-bottom: 12px; transition: border-color 200ms ease-out, box-shadow 200ms ease-out, transform 200ms ease-out; }
    .video-section:focus-within { overflow: visible; border-color: color-mix(in srgb, var(--accent) 46%, var(--line)); }
    .section-top { position: relative; }
    .progress-track { position: absolute; top: 0; right: 0; left: 0; height: 2px; background: transparent; }
    .progress-track > span { display: block; width: var(--progress, 0%); height: 100%; background: var(--accent); transition: width 210ms ease-out; }
    .project-summary { display: flex; align-items: center; width: 100%; min-height: 75px; padding: 16px 18px 15px; text-align: left; }
    .project-toggle { flex: 1; min-width: 0; padding: 0; text-align: left; }
    .project-toggle:hover .project-title { color: var(--accent); }
    .project-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .project-title { overflow: hidden; font-size: 15px; font-weight: 650; letter-spacing: -.012em; text-overflow: ellipsis; white-space: nowrap; transition: color 190ms ease-out; }
    .complete-mark { flex: 0 0 auto; color: var(--accent); font-size: 13px; }
    .project-meta, .project-counts { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .project-counts { margin-top: 2px; }
    .project-percent { flex: 0 0 auto; padding-left: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .project-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 210ms ease-out; }
    .project-body-inner { min-height: 0; overflow: hidden; }
    .video-section.is-open .project-body { grid-template-rows: 1fr; }
    .project-editor { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; padding: 0 18px 16px; border-top: 1px solid transparent; transition: border-color 190ms ease-out; }
    .video-section.is-open .project-body-inner { overflow: visible; }
    .video-section.is-open .project-editor { padding-top: 14px; border-top-color: var(--line); }
    .field { min-width: 0; }
    .field label, .control-label { display: block; margin: 0 0 4px; color: var(--muted); font-size: 11px; }
    .field input { height: 31px; padding: 0 8px; border: 1px solid transparent; background: var(--surface-raised); }
    .field input:focus { border-color: var(--line); }
    .project-controls { display: flex; align-items: center; grid-column: 1 / -1; gap: 11px; padding-top: 3px; }
    .project-controls input[type="range"] { flex: 1; accent-color: var(--accent); }
    .range-value { width: 38px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .auto-progress { padding: 3px 5px; border-radius: 6px; color: var(--muted); font-size: 11px; }
    .auto-progress:hover:not(:disabled), .auto-progress:focus-visible:not(:disabled) { color: var(--accent); background: var(--surface-raised); }
    .auto-progress:disabled { cursor: default; opacity: .42; }
    .completion-control { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; cursor: pointer; }
    .completion-control input { width: 15px; height: 15px; accent-color: var(--accent); }

    .elements { padding: 0 18px 8px; }
    .element-card { position: relative; display: grid; grid-template-columns: minmax(190px, 40%) 1fr; min-height: 174px; margin: 0 0 10px; overflow: visible; transition: opacity 205ms ease-out, transform 205ms ease-out, border-color 200ms ease-out; }
    .element-card.is-new { animation: slide-in 205ms ease-out both; }
    .element-card.is-removing { opacity: 0; transform: translateY(10px); }
    @keyframes slide-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .element-card:hover, .element-card:focus-within { border-color: color-mix(in srgb, var(--accent) 36%, var(--line)); }
    .image-slot { position: relative; display: grid; min-height: 174px; place-items: center; overflow: hidden; border-radius: 11px 0 0 11px; background: var(--surface-raised); }
    .image-slot img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .paste-hint { width: calc(100% - 28px); padding: 22px 8px; border: 1px dashed color-mix(in srgb, var(--muted) 48%, transparent); border-radius: 9px; color: var(--muted); font-size: 12px; text-align: center; }
    .element-main { min-width: 0; padding: 16px 17px; }
    .element-description { min-height: 61px; padding: 0; font-size: 15px; line-height: 1.38; }
    .element-technique { height: 28px; margin-top: 8px; padding: 0; color: var(--muted); border-bottom: 1px solid transparent; transition: color 190ms ease-out, border-color 190ms ease-out; }
    .element-technique:focus { height: 37px; color: var(--text); border-color: var(--line); }
    .element-bottom { display: grid; grid-template-columns: 1fr 94px; gap: 8px; margin-top: 8px; }
    .category-combo { position: relative; min-width: 0; }
    .element-category, .element-timecode { height: 28px; padding: 0 28px 0 7px; background: var(--surface-raised); border: 1px solid transparent; }
    .element-category:focus, .element-timecode:focus { border-color: var(--line); }
    .element-timecode { padding-right: 7px; }
    .category-check { position: absolute; top: 6px; right: 8px; color: #34c759; font-size: 13px; font-weight: 700; line-height: 1; opacity: 0; pointer-events: none; transform: scale(.72); transition: opacity 180ms ease-out, transform 180ms ease-out; }
    .category-check.is-visible { opacity: 1; transform: scale(1); }
    .category-menu { position: absolute; z-index: 8; top: calc(100% + 5px); right: 0; left: 0; display: grid; max-height: 174px; padding: 4px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translateY(-3px) scale(.985); transition: opacity 180ms ease-out, transform 180ms ease-out; }
    .category-combo.is-open .category-menu { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .category-option { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 29px; padding: 0 7px; overflow: hidden; border: 0; border-radius: 5px; background: transparent; color: var(--text); cursor: pointer; text-align: left; text-overflow: ellipsis; white-space: nowrap; transition: background 180ms ease-out, color 180ms ease-out; }
    .category-option > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .option-check { flex: 0 0 auto; color: #34c759; font-size: 12px; font-weight: 700; }
    .category-option:hover, .category-option:focus-visible { background: var(--surface-raised); }
    .category-option.is-create { color: var(--accent); }
    .category-filter-link { display: block; max-width: 100%; margin-top: 4px; padding: 0; overflow: hidden; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; line-height: 1.15; text-align: left; text-overflow: ellipsis; white-space: nowrap; transition: color 180ms ease-out; }
    .category-filter-link:hover, .category-filter-link:focus-visible { color: var(--accent); }
    .category-filter-active { flex: 0 1 auto; min-width: 0; padding: 4px 7px; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-raised); color: var(--muted); cursor: pointer; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; transition: color 180ms ease-out, border-color 180ms ease-out; }
    .category-filter-active:hover, .category-filter-active:focus-visible { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 48%, var(--line)); }
    .legacy-fields { margin-top: 9px; color: var(--muted); }
    .legacy-fields summary { cursor: pointer; font-size: 12px; }
    .legacy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 7px; }
    .legacy-grid input { height: 28px; padding: 0 7px; background: var(--surface-raised); border: 1px solid transparent; }
    .legacy-grid input:focus { border-color: var(--line); }
    .repeat-badge { position: absolute; z-index: 2; top: 9px; right: 9px; min-width: 35px; padding: 4px 7px; border-radius: 99px; background: color-mix(in srgb, var(--bg) 80%, transparent); color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); }
    .repeat-badge:hover { background: var(--accent); color: #fff; }
    .repeat-badge.is-pulsing { animation: badge-pulse 200ms ease-out; }
    @keyframes badge-pulse { 50% { transform: scale(1.16); } }
    .card-actions { position: absolute; z-index: 3; right: 8px; bottom: 8px; display: flex; gap: 3px; opacity: 0; transform: translateY(3px); transition: opacity 190ms ease-out, transform 190ms ease-out; }
    .element-card:hover .card-actions, .element-card:focus-within .card-actions { opacity: 1; transform: translateY(0); }
    .card-action { display: grid; width: 27px; height: 27px; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--muted); cursor: pointer; }
    .card-action:hover { color: var(--text); background: var(--surface-raised); }
    .card-action.delete:hover { color: var(--danger); }
    .add-element { display: inline-flex; align-items: center; min-height: 35px; margin: 1px 0 7px; padding: 0 4px; color: var(--muted); font-size: 13px; }
    .add-element:hover { color: var(--accent); }

    .video-composer { margin-bottom: 12px; padding: 17px 18px; animation: composer-in 205ms ease-out both; }
    @keyframes composer-in { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: scale(1); } }
    .composer-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .composer-note { margin: 11px 0 0; color: var(--muted); font-size: 12px; }
    .add-video-wrap { display: flex; justify-content: center; padding: 22px 0 0; }
    .add-video { display: grid; width: 56px; height: 56px; place-items: center; border: 0; border-radius: 50%; background: var(--accent); color: #fff; cursor: pointer; box-shadow: 0 8px 22px rgba(79, 140, 255, .28); font-size: 18px; font-weight: 300; line-height: 1; transition: transform 190ms ease-out, box-shadow 190ms ease-out; }
    .add-video:hover { box-shadow: 0 11px 27px rgba(79, 140, 255, .4); transform: translateY(-2px); }
    .add-video:active { transform: scale(.94); }

    .panel {
      position: fixed;
      z-index: 25;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px) scale(.985);
      transition: opacity 190ms ease-out, transform 190ms ease-out;
    }
    .panel.is-open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .menu-panel { top: 52px; left: max(20px, calc(50% + 260px)); width: 205px; padding: 6px; border-radius: 10px; }
    .menu-item { display: flex; align-items: center; width: 100%; min-height: 34px; padding: 0 9px; border-radius: 7px; color: var(--text); text-align: left; }
    .menu-item:hover { background: var(--surface-raised); }
    .menu-separator { height: 1px; margin: 5px 4px; background: var(--line); }
    .stats-panel { top: 0; right: 0; bottom: 0; width: min(660px, 100vw); overflow-y: auto; padding: 22px; border-width: 0 0 0 1px; transform: translateX(14px); }
    .stats-panel.is-open { transform: translateX(0); }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .panel-heading h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
    .close-panel { font-size: 18px; }
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 19px; }
    .kpi { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised); }
    .kpi-value { overflow: hidden; font-size: 18px; font-weight: 700; letter-spacing: -.04em; line-height: 1; text-overflow: ellipsis; white-space: nowrap; }
    .kpi-label { overflow: hidden; margin-top: 6px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .stats-block { margin-top: 20px; }
    .stats-block h3 { margin: 0 0 9px; font-size: 13px; font-weight: 650; }
    .bar-chart { display: block; width: 100%; height: 190px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised); }
    .timeline-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .timeline-name { overflow: hidden; margin-bottom: 7px; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .timeline { position: relative; height: 23px; border-radius: 5px; background: var(--surface-raised); }
    .timeline::before, .timeline::after { position: absolute; top: 5px; color: var(--muted); font-size: 11px; }
    .timeline::before { left: 6px; content: "0"; }
    .timeline::after { right: 6px; content: attr(data-duration); }
    .timeline-marker { position: absolute; top: 3px; width: 3px; height: 17px; border: 0; border-radius: 2px; background: var(--accent); cursor: help; }
    .timeline-stack { position: absolute; top: 5px; right: 6px; color: var(--muted); font-size: 11px; }
    .timeline-tooltip { position: absolute; z-index: 3; bottom: calc(100% + 6px); left: 50%; width: max-content; max-width: 190px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); box-shadow: var(--shadow); color: var(--text); font-size: 11px; pointer-events: none; opacity: 0; transform: translate(-50%, 4px); transition: opacity 180ms ease-out, transform 180ms ease-out; }
    .timeline-marker:hover .timeline-tooltip, .timeline-marker:focus .timeline-tooltip { opacity: 1; transform: translate(-50%, 0); }
    .mini-progress { height: 2px; margin-top: 7px; overflow: hidden; border-radius: 2px; background: var(--line); }
    .mini-progress span { display: block; width: var(--progress); height: 100%; background: var(--accent); transition: width 210ms ease-out; }
    .top-list, .niche-list { display: grid; gap: 7px; }
    .top-entry, .niche-entry { display: flex; align-items: center; gap: 9px; padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-raised); }
    .mini-image { flex: 0 0 35px; width: 35px; height: 35px; border-radius: 6px; object-fit: cover; background: var(--line); }
    .top-copy { min-width: 0; flex: 1; }
    .top-name, .top-niches { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-name { font-size: 12px; }
    .top-niches { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .top-repeat { color: var(--muted); font-variant-numeric: tabular-nums; }
    .niche-entry { justify-content: space-between; color: var(--muted); font-size: 12px; }
    .niche-entry strong { color: var(--text); font-weight: 600; }

    .calibration-surface { position: fixed; z-index: 35; inset: 0; display: grid; place-items: center; padding: 24px; background: color-mix(in srgb, var(--bg) 86%, transparent); opacity: 0; pointer-events: none; transition: opacity 200ms ease-out; }
    .calibration-surface.is-open { opacity: 1; pointer-events: auto; }
    .calibration-card { width: min(860px, 100%); max-height: calc(100vh - 48px); padding: 16px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); transform: translateY(9px) scale(.99); transition: transform 200ms ease-out; }
    .calibration-surface.is-open .calibration-card { transform: translateY(0) scale(1); }
    .calibration-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
    .calibration-head strong { font-size: 13px; }
    .calibration-head span { color: var(--muted); font-size: 12px; }
    .crop-stage { position: relative; display: inline-block; max-width: 100%; overflow: hidden; line-height: 0; user-select: none; touch-action: none; }
    .crop-stage img { display: block; max-width: 100%; max-height: min(63vh, 620px); }
    .crop-frame { position: absolute; border: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgba(0, 0, 0, .4); cursor: move; }
    .crop-handle { position: absolute; right: -7px; bottom: -7px; width: 13px; height: 13px; border: 2px solid var(--surface); border-radius: 50%; background: var(--accent); cursor: nwse-resize; }
    .calibration-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .primary-button { min-height: 34px; padding: 0 13px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; transition: transform 190ms ease-out, filter 190ms ease-out; }
    .primary-button:hover { filter: brightness(1.06); }
    .primary-button:active { transform: scale(.97); }

    .toast { position: fixed; z-index: 50; bottom: 22px; left: 50%; display: flex; align-items: center; gap: 12px; padding: 10px 11px 10px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); box-shadow: var(--shadow); color: var(--text); opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: opacity 200ms ease-out, transform 200ms ease-out; }
    .toast.is-showing { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .undo-button { padding: 3px 4px; color: var(--accent); font-size: 12px; }
    .undo-button:hover { color: var(--text); }

    @media (max-width: 680px) {
      .app { padding-right: 12px; padding-left: 12px; }
      .topbar { gap: 9px; }
      .save-state { min-width: 9px; font-size: 0; }
      .project-editor, .composer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .element-card { grid-template-columns: 1fr; }
      .image-slot { min-height: 150px; max-height: 270px; border-radius: 11px 11px 0 0; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats-panel { padding: 17px 14px; }
      .menu-panel { right: 12px; left: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
    }
  </style>
  <style id="final-ui">
    :root {

      --line: #dfe3e7;
      --text: #1d2127;
      --muted: #68707a;
      --accent: #4f8cff;
      --accent-soft: rgba(79, 140, 255, .13);
      --danger: #d24f58;
      --success: #218739;
      --shadow: 0 16px 40px rgba(20, 28, 38, .12);
      color-scheme: light;
    }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px) scale(.992); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes reveal-menu { from { opacity: 0; transform: translateY(-5px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes reveal-panel { from { opacity: 0; transform: translateY(-5px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app-shell { display: block; height: auto; min-height: 100vh; }
      .topbar { position: sticky; top: 0; }
      .sidebar { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .video-list { display: flex; max-height: 172px; padding: 0 8px 8px; overflow-x: auto; overflow-y: hidden; }
      .video-row { flex: 0 0 210px; }
      .sidebar-footer { padding: 6px 8px; }
      .workspace { overflow: visible; }
      .workspace-inner { padding: 16px 12px; }
      .project-details-body, .composer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .element-card.is-expanded { grid-template-columns: 1fr; }
      .element-card.is-expanded .card-frame { min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); border-radius: 11px 11px 0 0; }
      .element-editor { padding-right: 88px; }
    }
    @media (hover: none) {
      .video-delete { opacity: .7; }
    }
    @media (max-width: 500px) {
      .save-state { min-width: 9px; font-size: 0; }
      .project-details-body, .composer-grid { grid-template-columns: 1fr; }
      .project-header-main { display: block; }
      .project-header-actions { margin-top: 12px; }
    }

    /* Cloud controls and the final contrast/stacking fixes live after the legacy styles. */
    :root { --surface-raised: #222831; --line: #343c47; }
    [data-theme="light"] { --bg: #f3f5f8; --surface: #ffffff; --surface-raised: #e9eef5; --line: #cbd5e1; }
    .search-wrap { position: relative; }
    .search-wrap::before { position: absolute; z-index: 1; top: 6px; left: 9px; content: "⌕"; color: var(--muted); font-size: 15px; pointer-events: none; }
    .search { padding-left: 28px; }
    .element-grid { isolation: isolate; }
    .element-card { z-index: 0; border-color: var(--line); background: var(--surface); box-shadow: 0 2px 4px rgba(0, 0, 0, .18), 0 12px 28px rgba(0, 0, 0, .10); }
    [data-theme="light"] .element-card { box-shadow: 0 2px 5px rgba(31, 41, 55, .10), 0 12px 26px rgba(31, 41, 55, .07); }
    .element-card.has-open-category, .element-card:focus-within { z-index: 30; overflow: visible; }
    .category-combo.is-open { z-index: 100; }
    .category-menu { z-index: 110; }
    .category-icon { display: inline-block; width: 1.25em; margin-right: 4px; text-align: center; }
    .menu-item { gap: 8px; }
    .menu-icon { width: 18px; text-align: center; opacity: .86; }
    .sidebar-heading > span:first-child::before { content: "🎞"; margin-right: 5px; }
    .sidebar-add { font-size: 12px; }
    .sidebar-add::before { content: "＋"; margin-right: 5px; font-size: 16px; }
    .video-row.is-complete .row-progress > span, .project-header.is-complete .project-header-actions::after, .mini-progress.is-complete span, .stat-bar.is-complete > span { background: var(--success); }
    .project-header.is-complete .project-header-actions::after { background: linear-gradient(90deg, var(--success) 0 var(--progress, 0%), var(--line) var(--progress, 0%) 100%); }
    .project-stats-button { margin: 14px 0 0 7px; padding: 5px 7px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; }
    .project-stats-button:hover, .project-stats-button:focus-visible { background: var(--surface-raised); color: var(--text); }
    .editing-element { margin-bottom: 16px; }
    .editing-element .element-card { width: 100%; }
    .grid-add { display: inline-grid; grid-column: auto; align-self: stretch; min-height: 120px; min-width: 132px; border: 1px dashed color-mix(in srgb, var(--muted) 58%, transparent); color: var(--muted); }
    .grid-add::before { content: "＋"; display: block; font-size: 22px; line-height: 1; }
    .stat-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .stat-summary .kpi { padding: 10px; }
    .stat-list { display: grid; gap: 7px; }
    .stat-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-raised); }
    .stat-entry-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat-entry-value { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .stat-bar { grid-column: 1 / -1; height: 4px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .stat-bar > span { display: block; width: var(--progress, 0%); height: 100%; background: var(--accent); transition: width 210ms ease-out; }
    .stat-bar.is-complete > span { background: var(--success); }
    .stat-note { color: var(--muted); font-size: 12px; }
    .modal-surface { position: fixed; z-index: 80; inset: 0; display: grid; place-items: center; padding: 20px; background: color-mix(in srgb, var(--bg) 72%, transparent); opacity: 0; pointer-events: none; transition: opacity 180ms ease-out; }
    .modal-surface.is-open { opacity: 1; pointer-events: auto; }
    .modal-card { width: min(420px, 100%); padding: 20px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: var(--shadow); transform: translateY(8px) scale(.985); transition: transform 180ms ease-out; }
    .modal-surface.is-open .modal-card { transform: translateY(0) scale(1); }
    .modal-card h2 { margin: 0 0 8px; font-size: 16px; }
    .modal-card p { margin: 0; color: var(--muted); }
    .modal-card input { height: 38px; margin-top: 14px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface-raised); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .modal-button { min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-raised); color: var(--text); cursor: pointer; }
    .modal-button:hover, .modal-button:focus-visible { border-color: var(--accent); }
    .modal-button-danger { border-color: color-mix(in srgb, var(--danger) 70%, var(--line)); background: var(--danger); color: #fff; }
    .modal-button:disabled { cursor: not-allowed; opacity: .45; }
    .modal-help { margin-top: 9px !important; font-size: 11px; }
    @media (max-width: 680px) { .stat-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 760px) { .player-dock { grid-template-columns: 1fr; padding: 20px 18px 0; } .player-copy { padding: 0 2px; } }
    @media (max-width: 620px) { .server-refresh { width: 32px; padding: 0; overflow: hidden; font-size: 0; } .server-refresh::before { content: "↻"; font-size: 17px; } }
    @media (max-width: 500px) { .brand { font-size: 12px; } .brand::after { content: none; } }
  </style>
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div class="brand">РУЧНОЙ каталог отбора</div>
      <div class="search-wrap"><input id="search" class="search" type="search" autocomplete="off" placeholder="Поиск по каталогу" aria-label="Поиск по каталогу"></div>
      <button id="categoryFilter" class="category-filter-active" type="button" hidden></button>
      <button id="serverRefresh" class="server-refresh" type="button" title="Перечитать data.json с сервера">Обновить с сервера</button>
      <div id="onlinePresence" class="online-presence" aria-live="polite">0 онлайн</div>
      <div id="saveState" class="save-state" data-state="saved" aria-live="polite">Сохранено</div>
      <button id="menuButton" class="icon-button" type="button" aria-label="Меню" aria-expanded="false">⋯</button>
    </header>
    <aside class="sidebar" aria-label="Ролики">
      <div class="sidebar-heading"><span>Ролики</span><span id="videoListCount" class="row-number"></span></div>
      <nav id="videoList" class="video-list" aria-label="Список роликов"></nav>
      <div class="sidebar-footer"><button id="addVideo" class="sidebar-add" type="button" aria-label="Добавить ролик">Ролик</button></div>
    </aside>
    <main id="workspace" class="workspace" aria-live="polite">
      <section id="playerDock" class="player-dock" aria-label="Плеер активного ролика" aria-live="off" hidden>
        <div id="playerFrame" class="player-frame"></div>
        <div class="player-copy"><strong>Источник точного таймкода</strong><span id="playerClock" class="player-clock">—</span><span id="playerStatus" class="player-status">Запустите ролик и остановите его на нужном кадре перед добавлением элемента.</span><a id="playerLink" class="player-link" target="_blank" rel="noopener noreferrer">Открыть на YouTube ↗</a></div>
      </section>
      <div id="workspaceInner" class="workspace-inner"></div>
    </main>
  </div>

  <section id="menuPanel" class="panel menu-panel" aria-label="Меню">
    <button class="menu-item" type="button" data-action="export-json"><span class="menu-icon">⇩</span>Экспорт JSON</button>
    <button class="menu-item" type="button" data-action="import-json"><span class="menu-icon">⇧</span>Импорт JSON</button>
    <button class="menu-item" type="button" data-action="export-claude"><span class="menu-icon">✦</span>Экспорт для Клода</button>
    <div class="menu-separator"></div>
    <button class="menu-item" type="button" data-action="cloud-token"><span class="menu-icon">🔑</span>Ключ записи</button>
    <button class="menu-item" type="button" data-action="backup-folder"><span class="menu-icon">▣</span>Папка бэкапа</button>
    <button class="menu-item" type="button" data-action="crop"><span class="menu-icon">✂</span>Обрезка</button>
    <button class="menu-item" type="button" data-action="recalibrate"><span class="menu-icon">⌗</span>Перекалибровка рамки</button>
    <button class="menu-item" type="button" data-action="theme"><span class="menu-icon">◐</span>Светлая тема</button>
    <button class="menu-item" type="button" data-action="stats"><span class="menu-icon">📊</span>Статистика</button>
  </section>

  <aside id="statsPanel" class="panel stats-panel" aria-label="Статистика"></aside>
  <section id="calibrationSurface" class="calibration-surface" aria-label="Калибровка обрезки"></section>
  <section id="modalSurface" class="modal-surface" aria-live="polite"></section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <script>
    (() => {
      'use strict';

      const DB_NAME = 'local-element-catalog';
      const DB_VERSION = 6;
      const CATALOG_VERSION = 5;
      const SAVE_DELAY = 240;
      const CLOUD_SAVE_DELAY = 1000;
      // GitHub Pages rebuilds on every commit and allows only ~10 builds per hour,
      // so catalog commits are batched instead of following each keystroke.
      const CLOUD_PUSH_DELAY = 45000;
      const CLOUD_PUSH_MIN_INTERVAL = 45000;
      const CLOUD_PUSH_BLUR_DELAY = 5000;
      const CLOUD_PUSH_MAX_DEFERRAL = 90000;
      const TYPING_QUIET_PERIOD = 1200;
      const CLOUD_POLL_INTERVAL = 3000;
      const CLOUD_WRITE_RACE_RETRIES = 3;
      const DELETE_CONFIRMATION = 'УДАЛИТЬ';
      const PUBLISHED_DATA_URL = 'data.json';
      const GITHUB_CONTENTS_URL = 'https://api.github.com/repos/stampy399-cmyk/katalog-elementov/contents/data.json';
      const GITHUB_GIT_URL = 'https://api.github.com/repos/stampy399-cmyk/katalog-elementov/git';
      const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/stampy399-cmyk/katalog-elementov/main/';
      const GITHUB_BRANCH = 'main';
      const MAX_IMAGE_ASSET_BYTES = 95 * 1024 * 1024;
      const MAX_CLOUD_JSON_BYTES = 1024 * 1024;
      // Эта страница публичная: любой зашитый в неё секрет читает каждый посетитель.
      // Ключ записи вводится вручную и хранится только в localStorage конкретного браузера.
      const CLOUD_TOKEN_KEY = 'katalog-elementov.cloud-token';
      const PRESENCE_CLIENT_KEY = 'katalog-elementov.presence-client-id';
      const PRESENCE_LOCAL_KEY = 'katalog-elementov.presence-peers';
      const PRESENCE_CHANNEL_NAME = 'katalog-elementov.presence';
      const PRESENCE_HEARTBEAT_INTERVAL = 5000;
      const PRESENCE_STALE_AFTER = 15000;
      const PRESENCE_REMOTE_WINDOW = 180000;
      const PREVIEW_CACHE_KEY = 'katalog-elementov.local-previews';
      const PREVIEW_CACHE_LIMIT = 14;
      const PREVIEW_CACHE_BYTES = 3 * 1024 * 1024;
      const CLOUD_CACHE_KEY = 'katalog-elementov.cloud-cache';
      const CLOUD_OUTBOX_KEY = 'katalog-elementov.cloud-outbox';
      const CLOUD_BACKUP_KEY = 'backup';
      const CLOUD_BACKUP_COMPAT_KEY = 'katalog-elementov.cloud-backup';
      const CLOUD_GUARDED_OUTBOX_KEY = 'katalog-elementov.cloud-guarded-outbox';
      const DEFAULT_SETTINGS = Object.freeze({
        theme: 'dark',
        crop: null,
        cropCalibrated: false,
        activeProjectId: null,
        lastCropSource: '',
        backupDirectoryHandle: null,
        backupLastWrittenAt: null
      });

      const byId = (id) => document.getElementById(id);
      const dom = {
        appShell: byId('appShell'),
        videoList: byId('videoList'),
        videoListCount: byId('videoListCount'),
        workspace: byId('workspace'),
        playerDock: byId('playerDock'),
        playerFrame: byId('playerFrame'),
        playerClock: byId('playerClock'),
        playerStatus: byId('playerStatus'),
        playerLink: byId('playerLink'),
        workspaceInner: byId('workspaceInner'),
        addVideo: byId('addVideo'),
        search: byId('search'),
        categoryFilter: byId('categoryFilter'),
        serverRefresh: byId('serverRefresh'),
        onlinePresence: byId('onlinePresence'),
        saveState: byId('saveState'),
        menuButton: byId('menuButton'),
        menuPanel: byId('menuPanel'),
        statsPanel: byId('statsPanel'),
        calibrationSurface: byId('calibrationSurface'),
        modalSurface: byId('modalSurface'),
        toast: byId('toast'),
        importFile: byId('importFile')
      };

      const state = {
        db: null,
        projects: [],
        elements: [],
        categories: [],
        settings: { ...DEFAULT_SETTINGS },
        search: '',
        categoryFilter: '',
        activeProjectId: null,
        editingElementId: null,
        videoComposer: null,
        newElementId: null,
        menuOpen: false,
        statsOpen: false,
        calibration: null,
        cropDrag: null,
        writeQueue: Promise.resolve(),
        pendingWrites: 0,
        saveTimers: new Map(),
        undo: null,
        undoTimer: null,
        backupTimer: null,
        backupInFlight: false,
        backupDirty: false,
        backupGeneration: 0,
        saveError: '',
        metadataTimers: new Map(),
        metadataRequests: new Map(),
        fieldRevisions: new Map(),
        sidebarRefreshTimer: null,
        statsTimer: null,
        modal: null,
        drafts: new Map(),
        lastTypingAt: 0,
        previewCache: new Map(),
        previewProbes: new Set(),
        previewResolved: new Map(),
        statsBarsDrawn: false,
        referenceHighlightTimer: null,
        player: {
          apiPromise: null,
          instance: null,
          projectId: null,
          videoId: '',
          ready: false,
          clockTimer: null,
          generation: 0
        },
        cloud: {
          token: '',
          observedEtag: '',
          observedSha: '',
          baseEtag: '',
          baseSha: '',
          baseSnapshot: null,
          dirty: false,
          saving: false,
          error: '',
          ready: false,
          applying: false,
          importing: false,
          pollPaused: false,
          saveTimer: null,
          outboxTimer: null,
          outboxPending: false,
          pollTimer: null,
          pollInFlight: false,
          pendingSnapshot: null,
          remoteProjectCount: 0,
          knownProjectIds: new Set(),
          knownElementIds: new Set(),
          initialPullDone: false,
          revision: 0,
          outbox: null,
          outboxError: false,
          syncQueue: Promise.resolve(),
          generation: 0,
          writeGeneration: 0,
          lastPushAt: 0,
          saveDueAt: 0,
          firstDirtyAt: 0,
          pendingPush: false
        },
        presence: {
          clientId: '',
          count: 1,
          channel: null,
          peers: new Map(),
          remoteActiveAt: 0,
          heartbeatTimer: null
        }
      };

      function hasOwn(object, key) {
        return Object.prototype.hasOwnProperty.call(object, key);
      }

      function makeId() {
        if (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function') {
          return globalThis.crypto.randomUUID();
        }
        return `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
      }

      function asText(value) {
        return value === undefined || value === null ? '' : String(value);
      }

      function localValue(key, fallback = '') {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch (error) {
          return fallback;
        }
      }

      function saveLocalValue(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (error) {
          return false;
        }
      }

      function removeLocalValue(key) {
        try {
          localStorage.removeItem(key);
          return true;
        } catch (error) {
          return false;
        }
      }

      function isTextEditing(target = document.activeElement) {
        if (!target || !(target instanceof Element)) return false;
        return Boolean(target.closest('input, textarea, select, [contenteditable="true"], [contenteditable=""], [contenteditable]:not([contenteditable="false"])'));
      }

      function isCloudReadOnly() {
        return state.cloud.applying || state.cloud.importing;
      }

      // A local draft is never lost: while a field is focused (and shortly after) an incoming
      // snapshot is queued, and any value the user typed is re-applied on top of it.
      const DRAFT_TTL = 10 * 60 * 1000;

      function draftKey(kind, id, field) {
        return `${kind}:${String(id)}:${field}`;
      }

      function rememberDraft(kind, id, field, value) {
        state.lastTypingAt = Date.now();
        if (!id || !field) return;
        state.drafts.set(draftKey(kind, id, field), { kind, id: String(id), field, value: asText(value), at: Date.now() });
      }

      function draftRecord(draft) {
        return draft.kind === 'project' ? findProject(draft.id) : findElement(draft.id);
      }

      function draftValueOf(record, field) {
        if (!record) return '';
        if (field === 'timecode') return timecodesFrom(record)[0] || '';
        return asText(record[field]);
      }

      function writeDraftValue(record, field, value) {
        if (field === 'timecode') record.timecodes = timecodesFrom({ timecodes: [value] });
        else record[field] = value;
      }

      function restoreDrafts() {
        const now = Date.now();
        const elements = [];
        const projects = [];
        const conflicts = [];
        for (const [key, draft] of [...state.drafts]) {
          if (now - draft.at > DRAFT_TTL) {
            state.drafts.delete(key);
            continue;
          }
          const record = draftRecord(draft);
          if (!record) {
            state.drafts.delete(key);
            continue;
          }
          const current = draftValueOf(record, draft.field);
          if (current === draft.value) {
            state.drafts.delete(key);
            continue;
          }
          writeDraftValue(record, draft.field, draft.value);
          if (asText(current).trim()) conflicts.push(draft.field);
          if (draft.kind === 'project') projects.push(record);
          else elements.push(record);
        }
        return { elements, projects, conflicts, count: elements.length + projects.length };
      }

      function isTypingPause() {
        return Date.now() - state.lastTypingAt < TYPING_QUIET_PERIOD;
      }

      function applyReadOnlyState() {
        const readOnly = isCloudReadOnly();
        dom.appShell.classList.toggle('is-read-only', readOnly);
        for (const field of dom.appShell.querySelectorAll('[data-project-field], [data-video-field], [data-element-field], [data-category-input]')) {
          field.readOnly = readOnly;
          if (field.matches('input[type="range"]')) field.disabled = readOnly;
        }
        for (const control of dom.appShell.querySelectorAll('[data-project-complete], [data-project-auto], [data-add-element], [data-delete-project], [data-delete-element], [data-copy-element], .repeat-badge, #addVideo')) {
          control.disabled = readOnly;
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function escapeHtml(value) {
        return asText(value).replace(/[&<>"']/g, (character) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[character]);
      }

      function escapeAttribute(value) {
        return escapeHtml(value);
      }

      function tagsFrom(value) {
        if (Array.isArray(value)) {
          return value.map(asText).map((tag) => tag.trim()).filter(Boolean);
        }
        if (typeof value === 'string') {
          return value.split(',').map((tag) => tag.trim()).filter(Boolean);
        }
        return [];
      }

      function categoryName(value) {
        return asText(value).trim().replace(/\s+/g, ' ');
      }

      function categoryKey(value) {
        return categoryName(value).toLocaleLowerCase();
      }

      function categoryIcon(value) {
        const name = categoryKey(value);
        if (name.includes('зум') || name.includes('zoom')) return '🔍';
        if (name.includes('инфограф') || name.includes('chart') || name.includes('graph')) return '📊';
        if (name.includes('переход') || name.includes('transition')) return '🎬';
        if (name.includes('типограф') || name.includes('text') || name.includes('title')) return '🔤';
        if (name.includes('футаж') || name.includes('footage') || name.includes('b-roll')) return '🎞';
        if (name.includes('камер') || name.includes('camera')) return '🎥';
        if (name.includes('звук') || name.includes('audio') || name.includes('музык')) return '🔊';
        if (name.includes('цвет') || name.includes('color')) return '🎨';
        if (name.includes('анимац') || name.includes('motion')) return '✨';
        return '◌';
      }

      function progressOverrideFrom(project) {
        const value = project?.progressOverride;
        if (value === null || value === undefined || value === '' || !Number.isFinite(Number(value))) return null;
        return clamp(Number(value), 0, 100);
      }

      function migrateLegacyTags(record) {
        if (record.legacyTagsMigrated) return false;
        const tags = tagsFrom(record.tags);
        const currentCategory = categoryName(record.category);
        if (!currentCategory && tags[0]) {
          record.category = categoryName(tags[0]);
        }
        const description = asText(record.description).trim();
        const descriptionLower = description.toLocaleLowerCase();
        const remaining = tags.slice(1).filter((tag, index, all) => {
          const key = tag.toLocaleLowerCase();
          return all.findIndex((candidate) => candidate.toLocaleLowerCase() === key) === index
            && !descriptionLower.includes(key);
        });
        if (remaining.length) {
          record.description = [description, `теги: ${remaining.join(', ')}`].filter(Boolean).join('\n');
        }
        if (hasOwn(record, 'tags')) {
          delete record.tags;
        }
        record.legacyTagsMigrated = true;
        return true;
      }

      function categoryRecords(elements, sourceCategories = []) {
        const records = new Map();
        for (const row of sourceCategories) {
          const name = categoryName(row?.name);
          const key = categoryKey(row?.key || name);
          if (name && key && !records.has(key)) records.set(key, { ...row, key, name, uses: 0, repeats: 0 });
        }
        for (const element of elements) {
          const name = categoryName(element.category);
          const key = categoryKey(name);
          if (!key) continue;
          const item = records.get(key) || {
            key,
            name,
            uses: 0,
            repeats: 0
          };
          item.uses += 1;
          item.repeats += Math.max(1, Number(element.repeatCount) || 1);
          records.set(key, item);
        }
        return [...records.values()].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
      }

      function rebuildCategories(sourceCategories = state.categories) {
        const records = categoryRecords(state.elements, sourceCategories);
        const byKey = new Map(records.map((record) => [record.key, record]));
        const changed = [];
        for (const element of state.elements) {
          const key = categoryKey(element.category);
          const next = key ? byKey.get(key)?.name || '' : '';
          if (element.category !== next) {
            element.category = next;
            changed.push(element);
          }
        }
        state.categories = records;
        return { records, changed };
      }

      function writeCategoryRecords(transaction, records = state.categories) {
        const store = transaction.objectStore('categories');
        for (const record of records) store.put(record);
      }

      function timecodesFrom(record) {
        const source = record && typeof record === 'object' ? record : {};
        const candidates = Array.isArray(source.timecodes) ? source.timecodes
          : (source.timecodes ? [source.timecodes] : [source.time, ...(Array.isArray(source.times) ? source.times : [])]);
        const firstText = candidates.map(asText).map((timecode) => timecode.trim()).find(Boolean);
        return firstText ? [firstText] : [];
      }

      function elementStartSeconds(record) {
        const range = timecodesFrom(record)[0] || '';
        const start = range.split(/\s*[–—-]\s*/, 1)[0];
        const seconds = parseTimecode(start);
        return seconds === null || seconds < 0 ? Number.POSITIVE_INFINITY : seconds;
      }

      function compareElementsChronologically(left, right) {
        const leftStart = elementStartSeconds(left);
        const rightStart = elementStartSeconds(right);
        return leftStart === rightStart ? 0 : leftStart - rightStart;
      }

      function chronologicalElements(elements = state.elements) {
        return [...elements]
          .map((element, index) => ({ element, index }))
          .sort((left, right) => compareElementsChronologically(left.element, right.element) || left.index - right.index)
          .map(({ element }) => element);
      }

      function normalizeProject(source, now = Date.now()) {
        const record = source && typeof source === 'object' ? { ...source } : {};
        if (!hasOwn(record, 'id') || record.id === '' || record.id === null || record.id === undefined) {
          record.id = makeId();
        }
        record.title = asText(record.title || record.name || '').trim();
        record.url = asText(record.url).trim();
        record.channel = asText(record.channel).trim();
        // Legacy non-empty metadata is conservative: it must never be replaced by a later lookup.
        record.titleSource = record.titleSource === 'auto' || (!hasOwn(record, 'titleSource') && !record.title)
          ? 'auto' : 'manual';
        record.channelSource = record.channelSource === 'auto' || (!hasOwn(record, 'channelSource') && !record.channel)
          ? 'auto' : 'manual';
        record.niche = asText(record.niche).trim();
        record.duration = asText(record.duration).trim();
        record.host = asText(record.host).trim();
        record.progress = clamp(Number.isFinite(Number(record.progress)) ? Number(record.progress) : 0, 0, 100);
        const override = progressOverrideFrom(record);
        record.progressOverride = override !== null ? override
          : (!hasOwn(record, 'progressOverride') && record.progress > 0 && record.progress < 100 ? record.progress : null);
        record.completed = Boolean(record.completed) || (!hasOwn(record, 'progressOverride') && record.progress === 100);
        if (record.completed) record.progressOverride = 100;
        if (!hasOwn(record, 'createdAt')) record.createdAt = now;
        if (!hasOwn(record, 'updatedAt')) record.updatedAt = now;
        return record;
      }

      function normalizeElement(source, now = Date.now()) {
        const record = source && typeof source === 'object' ? { ...source } : {};
        if (!hasOwn(record, 'id') || record.id === '' || record.id === null || record.id === undefined) {
          record.id = makeId();
        }
        record.projectId = hasOwn(record, 'projectId') ? record.projectId : '';
        record.image = asText(Array.isArray(record.image) ? record.image[0] : record.image);
        record.name = asText(record.name || record.title || '').trim();
        record.description = asText(record.description).trim();
        record.opinion = asText(record.opinion).trim();
        record.application = asText(record.application).trim();
        record.technique = asText(record.technique).trim();
        migrateLegacyTags(record);
        record.category = categoryName(record.category);
        record.timecodes = timecodesFrom(record);
        const explicitRepeat = Number(record.repeatCount);
        record.repeatCount = Number.isFinite(explicitRepeat) && explicitRepeat >= 1
          ? Math.max(1, Math.round(explicitRepeat))
          : 1;
        if (!hasOwn(record, 'createdAt')) record.createdAt = now;
        if (!hasOwn(record, 'updatedAt')) record.updatedAt = now;
        return record;
      }

      function migrateCursor(store, transform) {
        const request = store.openCursor();
        request.onsuccess = () => {
          const cursor = request.result;
          if (!cursor) return;
          const next = transform(cursor.value);
          if (next.changed) cursor.update(next.value);
          cursor.continue();
        };
      }

      function upgradeDatabase(event) {
        const db = event.target.result;
        const transaction = event.target.transaction;
        const previousVersion = event.oldVersion;
        const projects = db.objectStoreNames.contains('projects')
          ? transaction.objectStore('projects')
          : db.createObjectStore('projects', { keyPath: 'id' });
        const elements = db.objectStoreNames.contains('elements')
          ? transaction.objectStore('elements')
          : db.createObjectStore('elements', { keyPath: 'id' });
        const settings = db.objectStoreNames.contains('settings')
          ? transaction.objectStore('settings')
          : db.createObjectStore('settings', { keyPath: 'key' });
        const categories = db.objectStoreNames.contains('categories')
          ? transaction.objectStore('categories')
          : db.createObjectStore('categories', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('cloudSync')) {
          db.createObjectStore('cloudSync', { keyPath: 'key' });
        }

        if (!elements.indexNames.contains('projectId')) {
          elements.createIndex('projectId', 'projectId', { unique: false });
        }

        if (previousVersion < DB_VERSION) {
          migrateCursor(categories, (value) => {
            const next = { ...value };
            let changed = false;
            const name = categoryName(next.name || next.key);
            if (next.name !== name) {
              next.name = name;
              changed = true;
            }
            for (const key of ['uses', 'repeats']) {
              const count = Math.max(0, Math.round(Number(next[key]) || 0));
              if (next[key] !== count) {
                next[key] = count;
                changed = true;
              }
            }
            return { changed, value: next };
          });
          migrateCursor(projects, (value) => {
            const next = { ...value };
            let changed = false;
            for (const [key, fallback] of Object.entries({ channel: '', niche: '', host: '', progress: 0, completed: false })) {
              if (!hasOwn(next, key)) {
                next[key] = fallback;
                changed = true;
              }
            }
            if (!hasOwn(next, 'progressOverride')) {
              const legacyProgress = clamp(Number(next.progress) || 0, 0, 100);
              next.progressOverride = legacyProgress > 0 && legacyProgress < 100 ? legacyProgress : null;
              changed = true;
            }
            if (!hasOwn(next, 'updatedAt')) {
              next.updatedAt = Date.now();
              changed = true;
            }
            return { changed, value: next };
          });

          const elementCursor = elements.openCursor();
          elementCursor.onsuccess = () => {
            const cursor = elementCursor.result;
            if (cursor) {
              const next = { ...cursor.value };
              let changed = migrateLegacyTags(next);
              const category = categoryName(next.category);
              if (next.category !== category) {
                next.category = category;
                changed = true;
              }
              const timecodes = timecodesFrom(next);
              if (JSON.stringify(next.timecodes || []) !== JSON.stringify(timecodes)) {
                next.timecodes = timecodes;
                changed = true;
              }
              if (!hasOwn(next, 'repeatCount') || !Number.isFinite(Number(next.repeatCount)) || Number(next.repeatCount) < 1) {
                next.repeatCount = 1;
                changed = true;
              }
              if (!hasOwn(next, 'updatedAt')) {
                next.updatedAt = Date.now();
                changed = true;
              }
              if (changed) cursor.update(next);
              cursor.continue();
              return;
            }
          };

          const settingKeys = new Set();
          const settingCursor = settings.openCursor();
          settingCursor.onsuccess = () => {
            const cursor = settingCursor.result;
            if (cursor) {
              settingKeys.add(cursor.key);
              cursor.continue();
              return;
            }
            for (const [key, value] of Object.entries(DEFAULT_SETTINGS)) {
              if (!settingKeys.has(key)) settings.put({ key, value });
            }
          };
        }
      }

      function openDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = upgradeDatabase;
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error('Не удалось открыть локальную базу.'));
          request.onblocked = () => reject(new Error('База открыта в другой вкладке.'));
        });
      }

      function getAll(storeName) {
        return new Promise((resolve, reject) => {
          const transaction = state.db.transaction(storeName, 'readonly');
          const request = transaction.objectStore(storeName).getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error || new Error('Не удалось прочитать данные.'));
        });
      }

      function runTransaction(storeNames, mode, work) {
        return new Promise((resolve, reject) => {
          const transaction = state.db.transaction(storeNames, mode);
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => reject(transaction.error || new Error('Ошибка локального сохранения.'));
          transaction.onabort = () => reject(transaction.error || new Error('Сохранение отменено.'));
          try {
            work(transaction);
          } catch (error) {
            transaction.abort();
            reject(error);
          }
        });
      }

      async function loadCatalog() {
        const [projects, elements, settingsRows, categories] = await Promise.all([
          getAll('projects'), getAll('elements'), getAll('settings'), getAll('categories')
        ]);
        state.projects = projects.map((project) => normalizeProject(project));
        state.elements = elements.map((element) => normalizeElement(element));
        rebuildCategories(categories);
        await commit(() => runTransaction(['elements', 'categories'], 'readwrite', (transaction) => {
          for (const element of state.elements) transaction.objectStore('elements').put(element);
          writeCategoryRecords(transaction);
        }), { backup: false });
        const settings = { ...DEFAULT_SETTINGS };
        for (const row of settingsRows) {
          if (row && hasOwn(row, 'key')) settings[row.key] = row.value;
        }
        state.settings = settings;
        state.activeProjectId = settings.activeProjectId && findProject(settings.activeProjectId)
          ? settings.activeProjectId
          : state.projects[0]?.id || null;
        state.editingElementId = null;
        state.cloud.token = storedCloudToken();
        applyTheme();
        refreshBackupPermission();
      }

      function setSaveState(kind, message) {
        if (state.cloud.ready && !state.cloud.applying) {
          if (state.cloud.saving) {
            kind = 'saving';
            message = 'Отправка…';
          } else if (state.cloud.error) {
            kind = 'error';
            message = state.cloud.error;
          } else if (state.cloud.dirty) {
            kind = 'saving';
            message = 'В очереди';
          }
        }
        const text = message || ({ saving: 'Сохранение…', saved: 'Сохранено', error: 'Ошибка' }[kind] || 'Сохранено');
        if (dom.saveState.dataset.state !== kind) dom.saveState.dataset.state = kind;
        if (dom.saveState.textContent !== text) dom.saveState.textContent = text;
        dom.saveState.title = kind === 'error'
          ? `${text}. Данные сохранены локально. Клик — повторить отправку.`
          : (state.cloud.dirty ? 'Правки сохранены локально, отправка в облако пакетом. Клик — отправить сейчас.' : 'Все правки отправлены в облако.');
      }

      function cancelScheduledCommit(key) {
        const timer = state.saveTimers.get(key);
        if (timer === undefined) return false;
        clearTimeout(timer);
        state.saveTimers.delete(key);
        return true;
      }

      function cancelElementCommit(id) {
        return cancelScheduledCommit(`element:${String(id)}`);
      }

      function cancelAllScheduledCommits() {
        for (const timer of state.saveTimers.values()) clearTimeout(timer);
        state.saveTimers.clear();
      }

      function scheduleCommit(key, task, options = {}) {
        cancelScheduledCommit(key);
        setSaveState('saving');
        const timer = setTimeout(() => {
          state.saveTimers.delete(key);
          commit(task, options).catch(() => undefined);
        }, SAVE_DELAY);
        state.saveTimers.set(key, timer);
      }

      function commit(task, { backup = true } = {}) {
        state.pendingWrites += 1;
        setSaveState('saving');
        const job = state.writeQueue.then(task);
        state.writeQueue = job.catch(() => undefined);
        return job.then(() => {
          state.saveError = '';
          if (backup) scheduleBackup();
        }).catch((error) => {
          state.saveError = error.message || 'Ошибка сохранения';
          setSaveState('error', 'Ошибка');
          showToast('Данные остались в памяти: ошибка сохранения.');
          throw error;
        }).finally(() => {
          state.pendingWrites -= 1;
          if (state.pendingWrites === 0 && state.saveTimers.size === 0 && !state.saveError) setSaveState('saved');
        });
      }

      function saveProject(project, deferred = true) {
        project.progress = projectProgress(project);
        project.updatedAt = Date.now();
        markCloudDirty();
        const task = () => runTransaction(['projects'], 'readwrite', (transaction) => {
          transaction.objectStore('projects').put(project);
        });
        if (deferred) scheduleCommit(`project:${String(project.id)}`, task);
        else return commit(task);
        return undefined;
      }

      function saveElement(element, deferred = true) {
        const normalized = normalizeElement(element);
        for (const key of Object.keys(element)) if (!hasOwn(normalized, key)) delete element[key];
        Object.assign(element, normalized);
        element.updatedAt = Date.now();
        markCloudDirty();
        const { changed } = rebuildCategories();
        const task = () => runTransaction(['elements', 'categories'], 'readwrite', (transaction) => {
          const store = transaction.objectStore('elements');
          for (const item of new Set([element, ...changed])) store.put(item);
          writeCategoryRecords(transaction);
        });
        if (deferred) scheduleCommit(`element:${String(element.id)}`, task);
        else return commit(task);
        return undefined;
      }

      function saveSettings(keys, deferred = true, options = {}) {
        const normalizedKeys = [...new Set((Array.isArray(keys) ? keys : [keys]).map(asText).map((key) => key.trim()).filter(Boolean))];
        if (normalizedKeys.length === 0) return deferred ? undefined : Promise.resolve();
        if (options.cloud !== false) markCloudDirty();
        const task = () => runTransaction(['settings'], 'readwrite', (transaction) => {
          const store = transaction.objectStore('settings');
          for (const key of normalizedKeys) store.put({ key, value: state.settings[key] });
        });
        if (deferred) scheduleCommit(`settings:${normalizedKeys.join('|')}`, task, options);
        else return commit(task, options);
        return undefined;
      }

      function deleteElementFromDatabase(id) {
        const { changed } = rebuildCategories();
        return commit(() => runTransaction(['elements', 'categories'], 'readwrite', (transaction) => {
          transaction.objectStore('elements').delete(id);
          const store = transaction.objectStore('elements');
          for (const element of changed) store.put(element);
          writeCategoryRecords(transaction);
        }));
      }

      function deleteProjectFromDatabase(project, projectElements) {
        const { changed } = rebuildCategories();
        return commit(() => runTransaction(['projects', 'elements', 'categories', 'settings'], 'readwrite', (transaction) => {
          transaction.objectStore('projects').delete(project.id);
          const elements = transaction.objectStore('elements');
          for (const element of projectElements) elements.delete(element.id);
          for (const element of changed) elements.put(element);
          writeCategoryRecords(transaction);
          transaction.objectStore('settings').put({ key: 'activeProjectId', value: state.settings.activeProjectId });
        }));
      }

      function findProject(id) {
        return state.projects.find((project) => String(project.id) === String(id)) || null;
      }

      function findElement(id) {
        return state.elements.find((element) => String(element.id) === String(id)) || null;
      }

      function elementsForProject(projectId) {
        return chronologicalElements(state.elements.filter((element) => String(element.projectId) === String(projectId)));
      }

      function elementName(element) {
        return asText(element?.name).trim() || asText(element?.description).split('\n')[0].trim()
          || asText(element?.technique).trim() || 'Без названия';
      }

      function totalRepeats(elements) {
        return elements.reduce((total, element) => total + Math.max(1, Number(element.repeatCount) || 1), 0);
      }

      function projectMeta(project) {
        const meta = [asText(project?.channel).trim(), asText(project?.niche).trim()].filter(Boolean);
        return meta.length ? meta.join(' · ') : 'Канал и ниша не указаны';
      }

      function projectHaystack(project) {
        return [project?.title, project?.url, project?.channel, project?.niche, project?.host, project?.duration,
          project?.completed ? 'закончен готов completed' : `в работе ${projectProgress(project)}`]
          .map(asText).join(' ').toLocaleLowerCase();
      }

      function elementHaystack(element) {
        return [element?.name, element?.description, element?.opinion, element?.application, element?.technique,
          element?.category, timecodesFrom(element).join(' ')].map(asText).join(' ').toLocaleLowerCase();
      }

      function projectProgress(project) {
        if (!project || typeof project !== 'object') return 0;
        if (project.completed) return 100;
        const override = progressOverrideFrom(project);
        if (override !== null) return override;
        const duration = parseTimecode(project.duration);
        if (!duration || duration <= 0) return 0;
        const last = Math.max(0, ...elementsForProject(project.id)
          .map(elementStartSeconds)
          .filter(Number.isFinite));
        return clamp(Math.round((last / duration) * 100), 0, 100);
      }

      function projectInput(project, field, label, placeholder) {
        return `<div class="field"><label>${label}</label><input data-project-field="${field}" value="${escapeAttribute(project[field])}" placeholder="${escapeAttribute(placeholder)}" autocomplete="off"></div>`;
      }

      function projectIndex(project) {
        return Math.max(0, state.projects.findIndex((candidate) => String(candidate.id) === String(project?.id)));
      }

      function projectSlug(project) {
        const index = projectIndex(project) + 1;
        const title = asText(project?.title).trim();
        let base = title.normalize('NFKC').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '');
        if (!base) base = `Ролик-${index}`;
        const duplicates = state.projects.filter((candidate) => {
          const candidateBase = asText(candidate.title).trim().normalize('NFKC').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '') || `Ролик-${projectIndex(candidate) + 1}`;
          return candidateBase.toLocaleLowerCase() === base.toLocaleLowerCase();
        });
        return duplicates.length > 1 ? `${base}-${index}` : base;
      }

      function elementNumber(element) {
        const list = elementsForProject(element?.projectId);
        return Math.max(0, list.findIndex((candidate) => String(candidate.id) === String(element?.id))) + 1;
      }

      function elementAnchor(project, element) {
        return `${projectSlug(project)}#${String(elementNumber(element)).padStart(2, '0')}`;
      }

      // #NN inside any text is a live link between elements. Links are derived from the text
      // on every render, never stored, so they can never fall out of sync with the catalog.
      const REFERENCE_PATTERN = /#(\d{1,3})/g;
      const ELEMENT_TEXT_FIELDS = Object.freeze(['description', 'technique', 'name', 'opinion', 'application']);

      function elementTextFor(element) {
        return ELEMENT_TEXT_FIELDS.map((field) => asText(element?.[field])).join('\n');
      }

      function referenceNumbersIn(text) {
        const numbers = new Set();
        for (const match of asText(text).matchAll(REFERENCE_PATTERN)) {
          const number = Number(match[1]);
          if (Number.isInteger(number) && number > 0) numbers.add(number);
        }
        return numbers;
      }

      function referenceBacklinks(projectId) {
        const backlinks = new Map();
        const list = elementsForProject(projectId);
        list.forEach((element, index) => {
          const from = index + 1;
          for (const number of referenceNumbersIn(elementTextFor(element))) {
            if (number === from || number > list.length) continue;
            const sources = backlinks.get(number) || new Set();
            sources.add(from);
            backlinks.set(number, sources);
          }
        });
        return backlinks;
      }

      function linkifyReferences(text, total) {
        const value = asText(text);
        let result = '';
        let cursor = 0;
        for (const match of value.matchAll(REFERENCE_PATTERN)) {
          const number = Number(match[1]);
          result += escapeHtml(value.slice(cursor, match.index));
          cursor = match.index + match[0].length;
          const label = `#${String(number).padStart(2, '0')}`;
          result += number > 0 && number <= total
            ? `<button class="ref-link" type="button" data-ref-number="${number}" title="Перейти к элементу ${label}">${label}</button>`
            : escapeHtml(match[0]);
        }
        return result + escapeHtml(value.slice(cursor));
      }

      // Repetition weight = explicit ×N plus every #NN mention of this element in other texts.
      function repetitionWeight(element, backlinkCount = 0) {
        return Math.max(1, Number(element?.repeatCount) || 1) + Math.max(0, backlinkCount);
      }

      function repeatHeatLevel(weight) {
        if (weight <= 1) return 0;
        return clamp(Math.round(((weight - 1) / 5) * 6), 1, 6);
      }

      function applyRepeatHeat(badge, weight) {
        const level = repeatHeatLevel(weight);
        if (badge.dataset.heat !== String(level)) {
          badge.dataset.heat = String(level);
          badge.style.setProperty('--heat', (level / 6).toFixed(3));
        }
        badge.title = `Клик: +1, Alt+клик: −1. Вес повторяемости ${weight} (×N и ссылки #NN).`;
      }

      // #NN links, backlink lists and repeat heat are derived from text, so they are
      // refreshed in place instead of re-rendering the grid.
      function referenceChipMarkup(from) {
        const label = `#${String(from).padStart(2, '0')}`;
        return `<button class="ref-link" type="button" data-ref-number="${from}" title="Перейти к элементу ${label}">${label}</button>`;
      }

      function refreshReferenceVisuals(projectId = state.activeProjectId) {
        const project = findProject(projectId);
        if (!project) return;
        const list = elementsForProject(project.id);
        const backlinks = referenceBacklinks(project.id);
        list.forEach((element, index) => {
          const card = dom.workspaceInner.querySelector(`[data-element-id="${CSS.escape(String(element.id))}"]`);
          if (!card) return;
          const sources = [...(backlinks.get(index + 1) || [])].sort((left, right) => left - right);
          const badge = card.querySelector('.repeat-badge');
          if (badge) {
            const label = `×${element.repeatCount}`;
            if (badge.textContent !== label) badge.textContent = label;
            badge.dataset.repeatCount = String(element.repeatCount);
            applyRepeatHeat(badge, repetitionWeight(element, sources.length));
          }
          const compact = card.querySelector('.element-compact');
          if (!compact) return;
          let node = compact.querySelector('.element-backlinks');
          if (!sources.length) {
            node?.remove();
            return;
          }
          if (!node) {
            node = document.createElement('div');
            node.className = 'element-backlinks';
            compact.append(node);
          }
          const markup = `упоминается в: ${sources.map(referenceChipMarkup).join(' ')}`;
          if (node.innerHTML !== markup) node.innerHTML = markup;
        });
      }

      function highlightElementNumber(number) {
        const list = elementsForProject(state.activeProjectId);
        const target = list[Number(number) - 1];
        if (!target) {
          showToast(`Элемент #${String(number).padStart(2, '0')} не найден в этом ролике.`);
          return;
        }
        const card = dom.workspaceInner.querySelector(`[data-element-id="${CSS.escape(String(target.id))}"]`);
        if (!card) return;
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        clearTimeout(state.referenceHighlightTimer);
        for (const node of dom.workspaceInner.querySelectorAll('.is-referenced')) node.classList.remove('is-referenced');
        card.classList.add('is-referenced');
        state.referenceHighlightTimer = setTimeout(() => card.classList.remove('is-referenced'), 2200);
      }

      async function copyAnchor(anchor) {
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(anchor);
            showToast(`Якорь скопирован: ${anchor}`);
            return true;
          }
        } catch (error) {
          // file:// may deny Clipboard API; the DOM fallback below remains local.
        }
        try {
          const field = document.createElement('textarea');
          field.value = anchor;
          field.setAttribute('readonly', '');
          field.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
          document.body.append(field);
          field.select();
          const copied = document.execCommand('copy');
          field.remove();
          showToast(copied ? `Якорь скопирован: ${anchor}` : `Якорь: ${anchor}`);
          return copied;
        } catch (error) {
          showToast(`Якорь: ${anchor}`);
          return false;
        }
      }

      function searchNeedles(query) {
        const raw = asText(query).trim().toLocaleLowerCase();
        if (!raw) return [];
        const needles = [raw];
        const onlyNumber = /^#(\d{1,3})$/.exec(raw);
        if (onlyNumber) needles.push(`#${String(Number(onlyNumber[1])).padStart(2, '0')}`);
        return [...new Set(needles)];
      }

      function elementSearchText(project, element) {
        const number = String(elementNumber(element)).padStart(2, '0');
        return [projectHaystack(project), elementHaystack(element), `#${number}`, elementAnchor(project, element), projectSlug(project)]
          .map(asText).join(' ').toLocaleLowerCase();
      }

      function matchesElement(project, element, query, activeCategory) {
        if (activeCategory && categoryKey(element.category) !== activeCategory) return false;
        const needles = searchNeedles(query);
        if (!needles.length) return true;
        const haystack = elementSearchText(project, element);
        return needles.some((needle) => haystack.includes(needle));
      }

      function matchesProject(project, query, activeCategory) {
        if (!query && !activeCategory) return true;
        const needles = searchNeedles(query);
        if (needles.length && needles.some((needle) => projectHaystack(project).includes(needle))) return true;
        return elementsForProject(project.id).some((element) => matchesElement(project, element, query, activeCategory));
      }

      function videoRow(project) {
        const elements = elementsForProject(project.id);
        const progress = projectProgress(project);
        const active = String(state.activeProjectId) === String(project.id);
        const untitled = !asText(project.title).trim() || project.title === 'Без названия';
        return `<div class="video-row ${active ? 'is-active' : ''} ${untitled ? 'is-untitled' : ''} ${progress >= 100 ? 'is-complete' : ''}" data-select-project="${escapeAttribute(project.id)}" style="--progress:${progress}%">
