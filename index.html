      }

      function isCatalogSnapshot(raw) {
        return Boolean(raw && typeof raw === 'object' && Array.isArray(raw.projects) && Array.isArray(raw.elements));
      }

      function prepareRemoteSnapshot(raw, meta = {}) {
        if (!isCatalogSnapshot(raw)) throw new Error('data.json имеет неверную структуру.');
        return {
          raw,
          incoming: prepareImport(raw),
          etag: asText(meta.etag).trim(),
          empty: raw.projects.length === 0 && raw.elements.length === 0
        };
      }

      async function getPublishedSnapshot() {
        if (globalThis.location?.protocol === 'file:' && isCatalogSnapshot(globalThis.PUBLISHED_CATALOG)) {
          return prepareRemoteSnapshot(globalThis.PUBLISHED_CATALOG, { etag: 'embedded-file-snapshot' });
        }
        const separator = PUBLISHED_DATA_URL.includes('?') ? '&' : '?';
        const response = await fetch(`${PUBLISHED_DATA_URL}${separator}v=${Date.now()}`, {
          method: 'GET',
          headers: { Accept: 'application/json' },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(`data.json GET: ${response.status}`);
        return prepareRemoteSnapshot(await response.json(), {
          etag: response.headers.get('ETag') || ''
        });
      }

      function recordsById(records) {
        return new Map((Array.isArray(records) ? records : []).map((record) => [String(record.id), record]));
      }

      function sameValue(left, right) {
        return JSON.stringify(left) === JSON.stringify(right);
      }

      function mergeServerRecord(local, remote, baseline, remoteOwnedFields = []) {
        if (!local) return { ...remote };
        const result = { ...remote };
        const remoteOwned = new Set(remoteOwnedFields);
        const keys = new Set([...Object.keys(local), ...Object.keys(remote), ...Object.keys(baseline || {})]);
        for (const key of keys) {
          if (remoteOwned.has(key)) {
            if (hasOwn(remote, key)) result[key] = remote[key];
            continue;
          }
          if (!baseline) {
            if (hasOwn(local, key)) result[key] = local[key];
            continue;
          }
          const ownerChanged = hasOwn(local, key) && !sameValue(local[key], baseline[key]);
          if (ownerChanged) result[key] = local[key];
          else if (!hasOwn(remote, key)) delete result[key];
        }
        return result;
      }

      function mergePublishedCatalog(remoteRaw) {
        const baseline = isCatalogSnapshot(state.settings.serverBaseline)
          ? state.settings.serverBaseline
          : (isCatalogSnapshot(globalThis.OWNER_BASELINE) ? globalThis.OWNER_BASELINE : { projects: [], elements: [] });
        const localProjects = recordsById(state.projects);
        const remoteProjects = recordsById(remoteRaw.projects);
        const baselineProjects = recordsById(baseline.projects);
        const aliases = new Map();
        const remoteByVideo = new Map(remoteRaw.projects.map((project) => [youtubeVideoId(project.url), project]).filter(([videoId]) => videoId));
        const projects = [];

        for (const remote of remoteRaw.projects) {
          const id = String(remote.id);
          if (baselineProjects.has(id) && !localProjects.has(id)) continue;
          projects.push(mergeServerRecord(localProjects.get(id), remote, baselineProjects.get(id), ['id']));
        }
        for (const local of state.projects) {
          const id = String(local.id);
          if (remoteProjects.has(id)) continue;
          const canonical = remoteByVideo.get(youtubeVideoId(local.url));
          if (canonical) {
            aliases.set(id, String(canonical.id));
            continue;
          }
          projects.push({ ...local });
        }

        const projectIds = new Set(projects.map((project) => String(project.id)));
        const localElements = recordsById(state.elements);
        const remoteElements = recordsById(remoteRaw.elements);
        const baselineElements = recordsById(baseline.elements);
        const elements = [];

        for (const remote of remoteRaw.elements) {
          const id = String(remote.id);
          if (baselineElements.has(id) && !localElements.has(id)) continue;
          const projectId = aliases.get(String(remote.projectId)) || String(remote.projectId);
          if (!projectIds.has(projectId)) continue;
          const merged = mergeServerRecord(localElements.get(id), remote, baselineElements.get(id), ['id', 'projectId', 'family', 'freq_videos', 'freq_total', 'tier']);
          merged.projectId = projectId;
          elements.push(merged);
        }
        for (const local of state.elements) {
          const id = String(local.id);
          if (remoteElements.has(id)) continue;
          const projectId = aliases.get(String(local.projectId)) || String(local.projectId);
          if (!projectIds.has(projectId)) continue;
          elements.push({ ...local, projectId });
        }

        const familyStats = new Map(FAMILY_ORDER.map((family) => [family, { total: 0, projects: new Set() }]));
        for (const element of elements) {
          if (!familyStats.has(element.family)) element.family = 'OTHER';
          const stats = familyStats.get(element.family);
          stats.total += 1;
          stats.projects.add(String(element.projectId));
        }
        for (const element of elements) {
          const stats = familyStats.get(element.family);
          element.freq_videos = stats.projects.size;
          element.freq_total = stats.total;
          element.tier = projects.length > 0 && stats.projects.size / projects.length >= BASE_VIDEO_THRESHOLD ? 'base' : 'unique';
        }

        return {
          ...remoteRaw,
          projects,
          elements,
          settings: { ...state.settings, serverBaseline: remoteRaw }
        };
      }

      async function refreshFromPublishedData({ force = false, notify = false } = {}) {
        if (dom.serverRefresh.disabled) return false;
        if (notify && (isTextEditing() || isTypingPause())) {
          showToast('Закончите редактирование: ваш текст не будет потерян.');
          return false;
        }
        dom.serverRefresh.disabled = true;
        dom.serverRefresh.textContent = 'Обновление…';
        try {
          const remote = await getPublishedSnapshot();
          const hasLocalCatalog = state.projects.length > 0 || state.elements.length > 0;
          if (hasLocalCatalog && isCatalogSnapshot(state.settings.serverBaseline) && sameValue(state.settings.serverBaseline, remote.raw)) {
            if (notify) showToast('Сервер уже объединён. Локальные правки сохранены.');
            return false;
          }
          const merged = hasLocalCatalog ? mergePublishedCatalog(remote.raw) : {
            ...remote.raw,
            settings: { ...state.settings, ...remote.raw.settings, serverBaseline: remote.raw }
          };
          await importCatalog(merged, { notify: false });
          if (notify) showToast('Сервер объединён. Локальные правки сохранены.');
          return true;
        } finally {
          dom.serverRefresh.disabled = false;
          dom.serverRefresh.textContent = 'Обновить с сервера';
        }
      }
      function presenceClientId() {
        try {
          const existing = sessionStorage.getItem(PRESENCE_CLIENT_KEY);
          if (existing) return existing;
          const clientId = makeId();
          sessionStorage.setItem(PRESENCE_CLIENT_KEY, clientId);
          return clientId;
        } catch (error) {
          return makeId();
        }
      }

      // Presence never writes to the repository: a commit per heartbeat exhausted the
      // GitHub Pages build budget (~10 builds/hour) and every deploy started to fail.
      function readPresencePeers() {
        try {
          const raw = JSON.parse(localValue(PRESENCE_LOCAL_KEY, '{}'));
          if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
          const peers = {};
          for (const [clientId, lastSeen] of Object.entries(raw)) {
            const timestamp = Number(lastSeen);
            if (clientId && Number.isFinite(timestamp) && timestamp > 0) peers[clientId] = timestamp;
          }
          return peers;
        } catch (error) {
          return {};
        }
      }

      function writePresencePeers(peers) {
        saveLocalValue(PRESENCE_LOCAL_KEY, JSON.stringify(peers));
      }

      function livePresencePeers(now = Date.now()) {
        for (const [clientId, lastSeen] of state.presence.peers) {
          if (now - lastSeen > PRESENCE_STALE_AFTER) state.presence.peers.delete(clientId);
        }
        return state.presence.peers;
      }

      function presenceCount(now = Date.now()) {
        const peers = livePresencePeers(now);
        const tabs = new Set([state.presence.clientId, ...peers.keys()]).size;
        const remote = now - state.presence.remoteActiveAt < PRESENCE_REMOTE_WINDOW ? 1 : 0;
        return { tabs, remote, total: tabs + remote };
      }

      function renderPresence() {
        const { tabs, remote, total } = presenceCount();
        state.presence.count = total;
        dom.onlinePresence.textContent = `${total} онлайн`;
        dom.onlinePresence.title = remote
          ? `Вкладок этого браузера: ${tabs}. Партнёр правил каталог менее ${Math.round(PRESENCE_REMOTE_WINDOW / 60000)} мин назад.`
          : `Вкладок этого браузера: ${tabs}. Правок с других машин недавно не было.`;
      }

      function markRemotePresence() {
        state.presence.remoteActiveAt = Date.now();
        renderPresence();
      }

      function heartbeatPresence() {
        const now = Date.now();
        const peers = readPresencePeers();
        for (const [clientId, lastSeen] of Object.entries(peers)) {
          if (clientId !== state.presence.clientId && now - lastSeen <= PRESENCE_STALE_AFTER) {
            state.presence.peers.set(clientId, lastSeen);
          }
        }
        peers[state.presence.clientId] = now;
        for (const [clientId, lastSeen] of Object.entries(peers)) {
          if (now - lastSeen > PRESENCE_STALE_AFTER) delete peers[clientId];
        }
        writePresencePeers(peers);
        try {
          state.presence.channel?.postMessage({ type: 'ping', clientId: state.presence.clientId, at: now });
        } catch (error) {
          // BroadcastChannel is optional; localStorage already carries the heartbeat.
        }
        renderPresence();
      }

      function initializePresence() {
        state.presence.clientId = presenceClientId();
        if (typeof BroadcastChannel === 'function') {
          try {
            state.presence.channel = new BroadcastChannel(PRESENCE_CHANNEL_NAME);
            state.presence.channel.addEventListener('message', (event) => {
              const message = event.data;
              if (!message || message.clientId === state.presence.clientId) return;
              if (message.type === 'leave') state.presence.peers.delete(message.clientId);
              else state.presence.peers.set(message.clientId, Date.now());
              renderPresence();
            });
          } catch (error) {
            state.presence.channel = null;
          }
        }
        globalThis.addEventListener('storage', (event) => {
          if (event.key === PRESENCE_LOCAL_KEY) {
            const now = Date.now();
            for (const [clientId, lastSeen] of Object.entries(readPresencePeers())) {
              if (clientId !== state.presence.clientId && now - lastSeen <= PRESENCE_STALE_AFTER) {
                state.presence.peers.set(clientId, lastSeen);
              }
            }
            renderPresence();
          }
        });
        globalThis.addEventListener('pagehide', () => {
          try {
            state.presence.channel?.postMessage({ type: 'leave', clientId: state.presence.clientId, at: Date.now() });
          } catch (error) {
            // Nothing to do while the tab is closing.
          }
          const peers = readPresencePeers();
          delete peers[state.presence.clientId];
          writePresencePeers(peers);
        });
        heartbeatPresence();
        clearInterval(state.presence.heartbeatTimer);
        state.presence.heartbeatTimer = setInterval(heartbeatPresence, PRESENCE_HEARTBEAT_INTERVAL);
      }

      function downloadText(filename, content, type = 'text/plain;charset=utf-8') {
        const blob = new Blob([content], { type });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }

      function exportJson() {
        downloadText('katalog-elementov.json', JSON.stringify(catalogSnapshot(), null, 2), 'application/json;charset=utf-8');
        showToast('JSON экспортирован.');
      }

      function importedSettings(rawSettings) {
        const result = { ...DEFAULT_SETTINGS };
        if (Array.isArray(rawSettings)) {
          for (const item of rawSettings) if (item && hasOwn(item, 'key')) result[item.key] = item.value;
        } else if (rawSettings && typeof rawSettings === 'object') {
          Object.assign(result, rawSettings);
        }
        if (state.settings.backupDirectoryHandle) result.backupDirectoryHandle = state.settings.backupDirectoryHandle;
        if (state.settings.backupLastWrittenAt) result.backupLastWrittenAt = state.settings.backupLastWrittenAt;
        return result;
      }

      function prepareImport(raw) {
        if (!raw || typeof raw !== 'object') throw new Error('Файл импорта не является каталогом.');
        const rawProjects = Array.isArray(raw.projects) ? raw.projects : (Array.isArray(raw.videos) ? raw.videos : null);
        const rawElements = Array.isArray(raw.elements) ? raw.elements : [];
        if (!rawProjects) throw new Error('В импорте отсутствуют ролики.');
        const projects = rawProjects.map((project) => normalizeProject(project));
        const ids = new Set();
        for (const project of projects) {
          const key = String(project.id);
          if (ids.has(key)) throw new Error('В импорте повторяется id ролика.');
          ids.add(key);
        }
        const elements = rawElements.map((element) => normalizeElement(element));
        const elementIds = new Set();
        for (const element of elements) {
          const key = String(element.id);
          if (elementIds.has(key)) throw new Error('В импорте повторяется id элемента.');
          if (!ids.has(String(element.projectId))) throw new Error('Элемент ссылается на отсутствующий ролик.');
          elementIds.add(key);
        }
        const categories = categoryRecords(elements, Array.isArray(raw.categories) ? raw.categories : []);
        const byKey = new Map(categories.map((category) => [category.key, category.name]));
        for (const element of elements) element.category = byKey.get(categoryKey(element.category)) || '';
        return { projects, elements, categories, settings: importedSettings(raw.settings) };
      }

      async function importCatalog(raw, { notify = true } = {}) {
        const incoming = prepareImport(raw);
        cancelAllScheduledCommits();
        stopAllProjectMetadata();
        clearTimeout(state.backupTimer);
        state.backupTimer = null;
        state.backupGeneration += 1;
        state.backupDirty = false;
        await state.writeQueue;
        await commit(() => runTransaction(['projects', 'elements', 'categories', 'settings'], 'readwrite', (transaction) => {
          const projects = transaction.objectStore('projects');
          const elements = transaction.objectStore('elements');
          const categories = transaction.objectStore('categories');
          const settings = transaction.objectStore('settings');
          projects.clear();
          elements.clear();
          categories.clear();
          settings.clear();
          for (const project of incoming.projects) projects.put(project);
          for (const element of incoming.elements) elements.put(element);
          for (const category of incoming.categories) categories.put(category);
          for (const [key, value] of Object.entries(incoming.settings)) settings.put({ key, value });
        }));
        state.projects = incoming.projects;
        state.elements = incoming.elements;
        state.categories = incoming.categories;
        state.settings = incoming.settings;
        state.activeProjectId = state.settings.activeProjectId && findProject(state.settings.activeProjectId)
          ? state.settings.activeProjectId : state.projects[0]?.id || null;
        state.editingElementId = null;
        state.videoComposer = null;
        state.newElementId = null;
        applyTheme();
        renderFeed();
        if (notify) showToast('Импорт завершён.');
      }

      function markdownValue(value) {
        return asText(value).replace(/\r?\n/g, '\n  ');
      }

      function exportElementRows() {
        return chronologicalElements().flatMap((element, index) => {
          const project = findProject(element.projectId);
          return project ? [{
            project,
            element,
            globalNumber: index + 1,
            localNumber: elementNumber(element),
            anchor: elementAnchor(project, element)
          }] : [];
        });
      }

      function safeFilePart(value, fallback = 'element', maxLength = 72) {
        let part = asText(value).normalize('NFKC').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '-').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^[.\s-]+|[.\s-]+$/g, '');
        if (!part) part = fallback;
        if (/^(con|prn|aux|nul|com[1-9]|lpt[1-9])$/i.test(part)) part = `_${part}`;
        return [...part].slice(0, maxLength).join('') || fallback;
      }

      function timecodeFilePart(element) {
        const timecode = timecodesFrom(element)[0];
        return timecode ? safeFilePart(timecode.replace(/:/g, '-'), 'NO-TC', 24) : 'NO-TC';
      }

      function claudeImageName(row) {
        return `${String(row.globalNumber).padStart(3, '0')}_${timecodeFilePart(row.element)}_${safeFilePart(elementName(row.element), 'element')}.jpg`;
      }

      function claudeMarkdown(imageReferences = new Map()) {
        const lines = ['# Каталог монтажных элементов', ''];
        for (const project of state.projects) {
          const progress = projectProgress(project);
          lines.push(`## ${markdownValue(project.title || 'Без названия')}`);
          lines.push(`- Project ID: ${markdownValue(project.id)}`);
          lines.push(`- Anchor: ${projectSlug(project)}`);
          lines.push(`- URL: ${markdownValue(project.url) || '—'}`);
          lines.push(`- Channel: ${markdownValue(project.channel) || '—'}`);
          lines.push(`- Niche: ${markdownValue(project.niche) || '—'}`);
          lines.push(`- Duration: ${markdownValue(project.duration) || '—'}`);
          lines.push(`- Progress: ${progress}%`);
          lines.push(`- Progress mode: ${project.progressOverride === null ? 'Auto' : 'Manual override'}`);
          lines.push(`- Completed: ${project.completed ? 'true' : 'false'}`);
          lines.push(`- Host: ${markdownValue(project.host) || '—'}`);
          lines.push(`- Title source: ${markdownValue(project.titleSource) || '—'}`);
          lines.push(`- Channel source: ${markdownValue(project.channelSource) || '—'}`);
          lines.push(`- Created: ${markdownValue(project.createdAt) || '—'}`);
          lines.push(`- Updated: ${markdownValue(project.updatedAt) || '—'}`);
          lines.push('');
          for (const row of exportElementRows().filter((item) => String(item.project.id) === String(project.id))) {
            const { element } = row;
            const image = imageReferences.get(String(element.id)) || '—';
            lines.push(`### ${String(row.globalNumber).padStart(3, '0')} · #${String(row.localNumber).padStart(2, '0')} · ${markdownValue(elementName(element))}`);
            lines.push(`- Anchor: ${row.anchor}`);
            lines.push(`- ID: ${markdownValue(element.id)}`);
            lines.push(`- Project ID: ${markdownValue(element.projectId)}`);
            lines.push(`- Image: ${image}`);
            lines.push(`- Name: ${markdownValue(element.name) || '—'}`);
            lines.push(`- Description: ${markdownValue(element.description) || '—'}`);
            lines.push(`- Opinion: ${markdownValue(element.opinion) || '—'}`);
            lines.push(`- Application: ${markdownValue(element.application) || '—'}`);
            lines.push(`- Technique: ${markdownValue(element.technique) || '—'}`);
            lines.push(`- Category: ${markdownValue(element.category) || '—'}`);
            lines.push(`- Timecode: ${timecodesFrom(element)[0] || '—'}`);
            lines.push(`- Repeat count: ${element.repeatCount}`);
            lines.push(`- Created: ${markdownValue(element.createdAt) || '—'}`);
            lines.push(`- Updated: ${markdownValue(element.updatedAt) || '—'}`);
            lines.push('');
          }
        }
        return lines.join('\n');
      }

      async function blobFromDataUrl(dataUrl) {
        const match = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(dataUrl);
        if (!match) throw new Error('Неверный формат изображения.');
        const mime = match[1] || 'application/octet-stream';
        const body = match[3];
        if (match[2]) {
          const binary = atob(body);
          const bytes = new Uint8Array(binary.length);
          for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
          return new Blob([bytes], { type: mime });
        }
        return new Blob([decodeURIComponent(body)], { type: mime });
      }

      async function writeFile(directory, name, content) {
        const handle = await directory.getFileHandle(name, { create: true });
        const stream = await handle.createWritable();
        await stream.write(content);
        await stream.close();
      }

      function downloadBlob(filename, blob) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }

      async function jpegFromDataUrl(dataUrl) {
        const image = await imageFromDataUrl(dataUrl);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, image.naturalWidth || image.width);
        canvas.height = Math.max(1, image.naturalHeight || image.height);
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        return new Promise((resolve, reject) => canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Не удалось подготовить JPEG.'));
        }, 'image/jpeg', .9));
      }

      async function exportForClaude() {
        closeMenu();
        const rows = exportElementRows();
        const imageReferences = new Map();
        const prepared = [];
        for (const row of rows) {
          if (!row.element.image) continue;
          const filename = claudeImageName(row);
          const blob = await jpegFromDataUrl(row.element.image);
          prepared.push({ filename, blob });
          imageReferences.set(String(row.element.id), filename);
        }
        const markdown = claudeMarkdown(imageReferences);
        if (typeof window.showDirectoryPicker !== 'function') {
          downloadText('KATALOG.md', markdown);
          for (const file of prepared) downloadBlob(file.filename, file.blob);
          showToast('KATALOG.md и JPEG загружены отдельно.');
          return;
        }
        try {
          const parent = await window.showDirectoryPicker({ mode: 'readwrite' });
          const directory = parent.name === 'KATALOG-ANALIZ' ? parent : await parent.getDirectoryHandle('KATALOG-ANALIZ', { create: true });
          for (const file of prepared) await writeFile(directory, file.filename, file.blob);
          await writeFile(directory, 'KATALOG.md', markdown);
          showToast(`KATALOG-ANALIZ сохранён: ${prepared.length} JPEG.`);
        } catch (error) {
          if (error?.name === 'AbortError') return;
          downloadText('KATALOG.md', markdown);
          for (const file of prepared) downloadBlob(file.filename, file.blob);
          showToast('Папка недоступна; KATALOG.md и JPEG загружены отдельно.');
        }
      }

      async function chooseBackupFolder() {
        closeMenu();
        if (typeof window.showDirectoryPicker !== 'function') {
          showToast('Выбор папки не поддерживается этим браузером.');
          return;
        }
        try {
          clearTimeout(state.backupTimer);
          state.backupGeneration += 1;
          state.backupDirty = false;
          state.settings.backupDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          const permission = typeof state.settings.backupDirectoryHandle.requestPermission === 'function'
            ? await state.settings.backupDirectoryHandle.requestPermission({ mode: 'readwrite' }) : 'granted';
          if (permission !== 'granted') throw new Error('Нет доступа к папке бэкапа.');
          await saveSettings(['backupDirectoryHandle'], false, { backup: false });
          await writeBackup();
          showToast('Папка бэкапа подключена.');
        } catch (error) {
          if (error?.name !== 'AbortError') showToast('Папка бэкапа недоступна.');
        }
      }

      function scheduleBackup() {
        if (!state.settings.backupDirectoryHandle) return;
        state.backupDirty = true;
        clearTimeout(state.backupTimer);
        const generation = state.backupGeneration;
        state.backupTimer = setTimeout(() => writeBackup(generation).catch((error) => {
          state.saveError = error.message || 'Ошибка бэкапа';
          showToast('Автобэкап не записан: требуется доступ к папке.');
        }), 700);
      }

      async function backupPermission(directory, request = false) {
        if (!directory?.getFileHandle) return 'denied';
        if (typeof directory.queryPermission !== 'function') return 'granted';
        const current = await directory.queryPermission({ mode: 'readwrite' });
        if (current === 'granted' || !request || typeof directory.requestPermission !== 'function') return current;
        return directory.requestPermission({ mode: 'readwrite' });
      }

      async function refreshBackupPermission() {
        const directory = state.settings.backupDirectoryHandle;
        if (!directory?.getFileHandle) return;
        try {
          const permission = await backupPermission(directory);
          if (permission !== 'granted') showToast('Автобэкап ждёт доступа к выбранной папке.');
        } catch (error) {
          showToast('Не удалось проверить папку автобэкапа.');
        }
      }

      async function writeBackupFile(directory, snapshot) {
        await writeFile(directory, 'katalog-elementov-backup.json.tmp', snapshot);
        await writeFile(directory, 'katalog-elementov-backup.json', snapshot);
        try { await directory.removeEntry('katalog-elementov-backup.json.tmp'); } catch (error) { /* best-effort cleanup */ }
      }

      async function writeBackup(generation = state.backupGeneration) {
        const directory = state.settings.backupDirectoryHandle;
        if (!directory?.getFileHandle || generation !== state.backupGeneration) return;
        state.backupDirty = true;
        if (state.backupInFlight) return;
        state.backupInFlight = true;
        try {
          while (state.backupDirty && generation === state.backupGeneration) {
            state.backupDirty = false;
            const permission = await backupPermission(directory);
            if (permission !== 'granted') throw new Error('Доступ к папке бэкапа не подтверждён.');
            await writeBackupFile(directory, JSON.stringify(catalogSnapshot(), null, 2));
            state.settings.backupLastWrittenAt = Date.now();
            await saveSettings(['backupLastWrittenAt'], false, { backup: false });
          }
        } finally {
          state.backupInFlight = false;
          if (state.backupDirty && generation === state.backupGeneration) scheduleBackup();
        }
      }

      function reCalibrate() {
        closeMenu();
        if (!state.settings.lastCropSource) {
          showToast('Нет исходного скрина для перекалибровки.');
          return;
        }
        startCalibration(state.settings.lastCropSource, null);
      }

      function showCropStatus() {
        closeMenu();
        showToast(state.settings.cropCalibrated
          ? 'Обрезка включена: используется сохранённая рамка.'
          : 'Обрезка настроится при первой вставке кадра.');
      }

      function selectProject(projectId) {
        const project = findProject(projectId);
        if (!project) return;
        state.activeProjectId = project.id;
        state.settings.activeProjectId = project.id;
        state.editingElementId = null;
        saveSettings(['activeProjectId']);
        setView('catalog');
      }

      dom.workspaceInner.addEventListener('load', (event) => {
        const image = event.target;
        if (!(image instanceof HTMLImageElement) || !image.matches('.image-slot img')) return;
        const card = image.closest('[data-element-id]');
        if (!card) return;
        const key = `${card.dataset.elementId}\n${image.dataset.previewSource || ''}`;
        state.previewResolved.set(key, image.currentSrc || image.src);
      }, true);

      dom.workspaceInner.addEventListener('pointerdown', (event) => {
        const video = event.target.closest('video[data-comparison-video]');
        if (!video) return;
        video.src = video.dataset.comparisonVideo;
        delete video.dataset.comparisonVideo;
        video.load();
      }, true);

      dom.workspaceInner.addEventListener('error', (event) => {
        const image = event.target;
        if (!(image instanceof HTMLImageElement) || !image.matches('.image-slot img')) return;
        let sources = [];
        try {
          sources = JSON.parse(image.dataset.previewSources || '[]');
        } catch (parseError) {
          sources = [];
        }
        const next = Number(image.dataset.previewIndex || 0) + 1;
        if (Array.isArray(sources) && sources[next]) {
          image.dataset.previewIndex = String(next);
          image.src = sources[next];
          return;
        }
        showUnavailablePreview(image);
      }, true);

      dom.appShell.addEventListener('click', (event) => {
        const pairButton = event.target.closest('[data-lightbox-pair]');
        if (pairButton) {
          openPairLightbox(pairButton.dataset.lightboxPair);
          return;
        }
        const comparisonMedia = event.target.closest('[data-lightbox-media]');
        if (comparisonMedia) {
          openMediaLightbox(comparisonMedia);
          return;
        }
        const deleteProject = event.target.closest('[data-delete-project]');
        if (deleteProject) {
          event.stopPropagation();
          const project = findProject(deleteProject.dataset.deleteProject);
          if (project) showDeleteModal('project', project);
          return;
        }
        const select = event.target.closest('[data-select-project]');
        if (select) {
          selectProject(select.dataset.selectProject);
          return;
        }
        if (event.target.closest('#addVideo')) {
          openVideoComposer();
          return;
        }
        const section = event.target.closest('[data-project-id]');
        const autoProgress = event.target.closest('[data-project-auto]');
        if (autoProgress && section) {
          const project = findProject(section.dataset.projectId);
          if (project) {
            project.completed = false;
            project.progressOverride = null;
            project.progress = projectProgress(project);
            saveProject(project);
            updateProjectVisual(project);
            scheduleStatsUpdate();
          }
          return;
        }
        if (event.target.closest('[data-open-stats]')) {
          openStats();
          return;
        }
        const add = event.target.closest('[data-add-element]');
        if (add) {
          addElement(add.dataset.addElement);
          return;
        }
        const anchorButton = event.target.closest('[data-copy-anchor]');
        if (anchorButton) {
          copyAnchor(anchorButton.dataset.copyAnchor);
          return;
        }
        const referenceLink = event.target.closest('[data-ref-number]');
        if (referenceLink) {
          event.stopPropagation();
          highlightElementNumber(referenceLink.dataset.refNumber);
          return;
        }
        const collapse = event.target.closest('[data-collapse-element]');
        if (collapse) {
          event.stopPropagation();
          state.editingElementId = null;
          state.newElementId = null;
          renderWorkspace();
          return;
        }
        const card = event.target.closest('[data-element-id]');
        if (!card) return;
        const element = findElement(card.dataset.elementId);
        if (!element) return;
        const categoryFilter = event.target.closest('[data-category-filter]');
        if (categoryFilter) {
          setCategoryFilter(categoryFilter.dataset.categoryFilter);
        } else if (event.target.closest('.repeat-badge')) {
          updateRepeat(element, event.altKey, event.target.closest('.repeat-badge'));
        } else if (event.target.closest('[data-copy-element]')) {
          copyElement(element);
        } else if (event.target.closest('[data-delete-element]')) {
          showDeleteModal('element', element);
        } else if (!card.classList.contains('is-expanded') && !event.target.closest('input, textarea, summary, [data-category-choice]')) {
          state.editingElementId = element.id;
          renderWorkspace();
          requestAnimationFrame(() => dom.workspaceInner.querySelector(`[data-element-id="${CSS.escape(String(element.id))}"] [data-element-field="description"]`)?.focus());
        }
      });

      dom.appShell.addEventListener('input', (event) => {
        const input = event.target;
        state.lastTypingAt = Date.now();
        const videoField = input.dataset.videoField;
        if (videoField) {
          updateVideoDraft(videoField, input.value);
          return;
        }
        const section = input.closest('[data-project-id]');
        const projectField = input.dataset.projectField;
        if (projectField && section) {
          const project = findProject(section.dataset.projectId);
          if (project) {
            if (projectField !== 'progress') rememberDraft('project', project.id, projectField, input.value);
            updateProject(project, projectField, input.value);
          }
          return;
        }
        if (input.matches('[data-category-input]')) {
          showCategoryMenu(input);
          return;
        }
        const card = input.closest('[data-element-id]');
        const elementField = input.dataset.elementField;
        if (elementField && card) {
          const element = findElement(card.dataset.elementId);
          if (element) {
            rememberDraft('element', element.id, elementField, input.value);
            updateElement(element, elementField, input.value);
            if (input.matches('.element-description')) resizeDescription(input);
          }
        }
      });

      dom.appShell.addEventListener('change', (event) => {
        const checkbox = event.target.closest('[data-project-complete]');
        if (!checkbox) return;
        const section = checkbox.closest('[data-project-id]');
        const project = section && findProject(section.dataset.projectId);
        if (!project) return;
        project.completed = checkbox.checked;
        project.progressOverride = checkbox.checked ? 100 : null;
        project.progress = projectProgress(project);
        saveProject(project);
        updateProjectVisual(project);
        scheduleStatsUpdate();
      });

      dom.appShell.addEventListener('focusin', (event) => {
        const categoryInput = event.target.closest('[data-category-input]');
        if (categoryInput) showCategoryMenu(categoryInput);
        const section = event.target.closest('[data-project-id]');
        if (section && String(state.activeProjectId) !== String(section.dataset.projectId)) selectProject(section.dataset.projectId);
      });

      dom.appShell.addEventListener('focusout', (event) => {
        const categoryInput = event.target.closest('[data-category-input]');
        if (categoryInput) {
          setTimeout(() => {
            const combo = categoryInput.closest('.category-combo');
            if (combo && !combo.contains(document.activeElement)) {
              const card = categoryInput.closest('[data-element-id]');
              const element = card && findElement(card.dataset.elementId);
              if (element) selectCategory(element, categoryInput.value);
              hideCategoryMenu(categoryInput);
            }
          }, 0);
        }
        if (event.target.matches('input, textarea')) {
          if (event.target.dataset.elementField) refreshReferenceVisuals();
        }
      });

      dom.appShell.addEventListener('mousedown', (event) => {
        const choice = event.target.closest('[data-category-choice]');
        if (!choice) return;
        const card = choice.closest('[data-element-id]');
        const element = card && findElement(card.dataset.elementId);
        if (!element) return;
        event.preventDefault();
        selectCategory(element, choice.dataset.categoryChoice);
      });

      dom.appShell.addEventListener('keydown', (event) => {
        const categoryInput = event.target.closest('[data-category-input]');
        if (categoryInput) {
          const card = categoryInput.closest('[data-element-id]');
          const element = card && findElement(card.dataset.elementId);
          if (!element) return;
          if (event.key === 'Enter') {
            event.preventDefault();
            selectCategory(element, categoryInput.value);
          } else if (event.key === 'Tab') {
            selectCategory(element, categoryInput.value);
          } else if (event.key === 'Escape') {
            event.preventDefault();
            event.stopPropagation();
            categoryInput.value = element.category;
            hideCategoryMenu(categoryInput);
          }
          return;
        }
        if (event.key === 'Enter' && !event.shiftKey && event.target.closest('[data-video-composer]')) {
          event.preventDefault();
          finishVideoComposer();
          return;
        }
        const card = event.target.closest('.element-card');
        if (card && event.target === card && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          state.editingElementId = card.dataset.elementId;
          renderWorkspace();
        }
      });

      dom.search.addEventListener('input', () => {
        state.search = dom.search.value;
        renderFeed();
      });

      dom.categoryFilter.addEventListener('click', () => {
        state.categoryFilter = '';
        renderFeed();
      });

      dom.tierFilter.addEventListener('click', (event) => {
        const value = event.target.closest('[data-tier-filter]')?.dataset.tierFilter;
        if (!['all', 'base', 'unique'].includes(value)) return;
        state.tierFilter = value;
        state.editingElementId = null;
        renderFeed();
      });

      dom.familyFilter.addEventListener('change', () => {
        state.familyFilter = FAMILY_ORDER.includes(dom.familyFilter.value) ? dom.familyFilter.value : 'all';
        state.editingElementId = null;
        renderFeed();
      });

      dom.viewSwitch.addEventListener('click', (event) => {
        const view = event.target.closest('[data-view]')?.dataset.view;
        if (view) setView(view);
      });

      globalThis.addEventListener('hashchange', () => {
        const view = globalThis.location.hash === '#comparison' ? 'comparison' : 'catalog';
        if (view !== state.view) setView(view, false);
      });

      dom.menuButton.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleMenu();
      });

      dom.menuPanel.addEventListener('click', (event) => {
        const action = event.target.closest('[data-action]')?.dataset.action;
        if (!action) return;
        if (action === 'export-json') exportJson();
        if (action === 'import-json') {
          closeMenu();
          dom.importFile.click();
        }
        if (action === 'export-claude') exportForClaude();
        if (action === 'backup-folder') chooseBackupFolder();
        if (action === 'crop') showCropStatus();
        if (action === 'recalibrate') reCalibrate();
        if (action === 'theme') toggleTheme();
        if (action === 'stats') openStats();
      });

      dom.importFile.addEventListener('change', async () => {
        const [file] = dom.importFile.files;
        dom.importFile.value = '';
        if (!file) return;
        try {
          await importCatalog(JSON.parse(await file.text()));
        } catch (error) {
          showToast(error.message || 'Импорт не удался.');
        }
      });

      dom.statsPanel.addEventListener('click', (event) => {
        if (event.target.closest('[data-close-stats]')) closeStats();
        const referenceLink = event.target.closest('[data-ref-number]');
        if (referenceLink) {
          closeStats();
          highlightElementNumber(referenceLink.dataset.refNumber);
        }
      });

      dom.calibrationSurface.addEventListener('click', (event) => {
        if (event.target.closest('[data-close-calibration]')) closeCalibration();
        if (event.target.closest('#cropDone')) completeCalibration();
      });
      dom.calibrationSurface.addEventListener('pointerdown', (event) => {
        if (event.target.closest('#cropFrame')) beginCropDrag(event);
      });
      document.addEventListener('pointermove', moveCropDrag);
      document.addEventListener('pointerup', () => { state.cropDrag = null; });

      dom.modalSurface.addEventListener('click', (event) => {
        const action = event.target.closest('[data-modal-action]')?.dataset.modalAction;
        if (!action) return;
        const modal = state.modal;
        if (!modal) return;
        if (action === 'cancel') {
          closeModal();
          return;
        }
        if (action === 'delete') {
          if (modal.kind === 'project') {
            const confirmation = dom.modalSurface.querySelector('[data-delete-confirmation]')?.value || '';
            if (!deleteConfirmationMatches(confirmation)) {
              showToast(`Введите «${DELETE_CONFIRMATION}» для удаления.`);
              return;
            }
          }
          closeModal();
          if (modal.kind === 'project') removeProject(modal.record);
          else removeElement(modal.record);
        }
      });
      dom.modalSurface.addEventListener('input', (event) => {
        const confirmation = event.target.closest('[data-delete-confirmation]');
        if (!confirmation || !state.modal) return;
        state.modal.confirmation = confirmation.value;
        const button = dom.modalSurface.querySelector('[data-modal-action="delete"]');
        if (button) button.disabled = !deleteConfirmationMatches(confirmation.value);
      });
      dom.modalSurface.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeModal();
        if (event.key === 'Enter' && event.target.matches('[data-delete-confirmation]')) {
          event.preventDefault();
          dom.modalSurface.querySelector('[data-modal-action="delete"]')?.click();
        }
      });

      dom.lightbox.addEventListener('click', (event) => {
        if (event.target.closest('[data-lightbox-close]')) {
          closeLightbox();
          return;
        }
        if (event.target.closest('[data-lightbox-prev]')) {
          moveLightbox(-1);
          return;
        }
        if (event.target.closest('[data-lightbox-next]')) {
          moveLightbox(1);
          return;
        }
        if (event.target === dom.lightbox || event.target === dom.lightboxContent || event.target.matches('[data-lightbox-backdrop]')) closeLightbox();
      });

      document.addEventListener('paste', (event) => {
        if (isTextEditing(event.target)) return;
        const item = [...(event.clipboardData?.items || [])].find((candidate) => candidate.type.startsWith('image/'));
        if (!item) return;
        event.preventDefault();
        const capturedTimecode = captureTimecodeAtPaste(event.clipboardData);
        handleImagePaste(item.getAsFile(), capturedTimecode);
      });

      document.addEventListener('click', (event) => {
        if (state.menuOpen && !dom.menuPanel.contains(event.target) && !dom.menuButton.contains(event.target)) closeMenu();
      });

      document.addEventListener('keydown', (event) => {
        if (state.lightbox) {
          if (event.key === 'Escape') closeLightbox();
          if (event.key === 'ArrowLeft') moveLightbox(-1);
          if (event.key === 'ArrowRight') moveLightbox(1);
          if (['Escape', 'ArrowLeft', 'ArrowRight'].includes(event.key)) event.preventDefault();
          return;
        }
        if (event.key !== 'Escape') return;
        if (state.categoryFilter) {
          state.categoryFilter = '';
          renderFeed();
        }
        if (state.menuOpen) closeMenu();
        if (state.statsOpen) closeStats();
        if (state.calibration) closeCalibration();
        if (state.modal) closeModal();
      });

      function runCatalogSelfTest() {
        const failures = [];
        let total = 0;
        const expect = (condition, label) => {
          total += 1;
          if (!condition) failures.push(label);
        };
        expect(capturedTimecodeFromText('0:51 / 15:02') === '0:51', 'screenshot timecode');
        expect(capturedTimecodeFromText('https://youtu.be/example?t=61') === '1:01', 'URL timecode');
        expect(capturedTimecodeFromText('0:51') === '', 'ambiguous text is ignored');
        expect(formatCapturedTimecode(3661.9) === '1:01:01', 'media timecode format');
        const earlyRange = { id: 'early', timecodes: ['0:03–0:10'] };
        const middleRange = { id: 'middle', timecodes: ['2:51–2:59'] };
        const lateRange = { id: 'late', timecodes: ['10:55.0–10:56.5'] };
        expect(elementStartSeconds(earlyRange) === 3, 'range start 0:03 is numeric 3');
        expect(elementStartSeconds(middleRange) === 171, 'range start 2:51 is numeric 171');
        expect(elementStartSeconds(lateRange) === 655, 'range start 10:55.0 is numeric 655');
        const stableOrder = chronologicalElements([lateRange, middleRange, earlyRange, { ...middleRange, id: 'middle-2' }]).map((element) => element.id);
        expect(stableOrder.join() === 'early,middle,middle-2,late', 'range ordering is numeric and stable');
        expect(youtubeVideoId('https://www.youtube.com/watch?v=QOUszAHEZAE&t=211s') === 'QOUszAHEZAE', 'YouTube video ID');
        expect(youtubeStartSeconds('https://youtu.be/QOUszAHEZAE?t=3m31s') === 211, 'YouTube start time');
        expect(capturedTimecodeFromPlayer({ getCurrentTime: () => 51.9 }) === '0:51', 'live player timecode');
        expect(capturedTimecodeFromPlayer(null) === '', 'missing player timecode');
        expect(catalogAssetUrl('assets/elements/example.jpg?v=abc').includes('assets/elements/example.jpg?v=abc'), 'asset URL resolution');
        expect(deleteConfirmationMatches('УДАЛИТЬ') && !deleteConfirmationMatches('Удалить'), 'delete confirmation word');

        expect(linkifyReferences('ровно как #05 и #24', 30).match(/data-ref-number="(\d+)"/g)?.join() === 'data-ref-number="5",data-ref-number="24"', '#NN links in text');
        expect(!linkifyReferences('#99', 5).includes('data-ref-number'), 'unknown #NN stays plain text');
        expect(linkifyReferences('<b>#03</b>', 5).startsWith('&lt;b&gt;'), 'reference text stays escaped');
        expect([...referenceNumbersIn('см. #05, #24 и #5')].join() === '5,24', 'reference numbers parsed');

        const previewElement = { id: 'preview-test', image: 'assets/elements/preview-test.jpg?v=7' };
        expect(previewSourceList(previewElement).length === 3, 'published preview falls back to raw URL');
        state.previewCache.set('preview-test', 'data:image/jpeg;base64,AAAA');
        expect(previewSourceList(previewElement)[0].startsWith('data:'), 'captured frame is shown before the build lands');
        state.previewCache.delete('preview-test');

        const draftElement = normalizeElement({ id: 'draft-test', projectId: 'draft-project', description: 'remote text' });
        state.elements.push(draftElement);
        state.drafts.set(draftKey('element', 'draft-test', 'description'), { kind: 'element', id: 'draft-test', field: 'description', value: 'мой черновик', at: Date.now() });
        const restoredDrafts = restoreDrafts();
        expect(restoredDrafts.count === 1 && draftElement.description === 'мой черновик', 'draft survives an incoming snapshot');
        expect(restoredDrafts.conflicts.length === 1, 'overwritten remote text is reported');
        state.elements = state.elements.filter((element) => element.id !== 'draft-test');
        state.drafts.clear();

        expect(presenceCount().total >= 1, 'presence counts at least this tab');
        expect(isCatalogSnapshot({ projects: [], elements: [] }), 'published catalog shape');
        expect(!isCatalogSnapshot({ projects: [] }), 'invalid published catalog shape');
        return Object.freeze({ passed: total - failures.length, total, failures: Object.freeze(failures) });
      }

      globalThis.__catalogSelfTest = runCatalogSelfTest;

      dom.serverRefresh.addEventListener('click', () => {
        refreshFromPublishedData({ force: true, notify: true }).catch((error) => {
          showToast(error.message || 'Не удалось обновить data.json.');
        });
      });

      async function initialize() {
        loadPreviewCache();
        try {
          state.db = await openDatabase();
          await loadCatalog();
        } catch (error) {
          setSaveState('error', 'Ошибка');
          dom.workspaceInner.innerHTML = '<div class="workspace-empty"><div><strong>Локальная база недоступна</strong>Проверьте, что браузер разрешает IndexedDB для локального файла.</div></div>';
          showToast(error.message || 'Не удалось открыть базу.');
          return;
        }
        try {
          try {
            await refreshFromPublishedData();
          } catch (error) {
            if (!state.projects.length) showToast(error.message || 'Не удалось загрузить data.json.');
          }
          await loadOursTech();
          renderFeed();
          setSaveState('saved');
          initializePresence();
        } catch (error) {
          setSaveState('error', 'Ошибка интерфейса');
          dom.workspaceInner.innerHTML = '<div class="workspace-empty"><div><strong>Не удалось отрисовать каталог</strong>Данные в локальной базе сохранены. Обновите страницу.</div></div>';
          showToast(error.message || 'Не удалось отрисовать каталог.');
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
