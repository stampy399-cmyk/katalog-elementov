        if (!commitSha) throw cloudWriteError('Создание catalog commit: GitHub не вернул SHA.');
        if (shouldCancel()) {
          const error = cloudWriteError('Облачная запись отменена из-за замены каталога.');
          error.cloudCancelled = true;
          throw error;
        }
        try {
          await githubApiJson(`/refs/heads/${branch}`, {
            method: 'PATCH',
            body: { sha: commitSha, force: false }
          }, 'Обновление main ref');
        } catch (error) {
          if (error.status === 409 || error.status === 422) error.cloudRace = true;
          throw error;
        }
        return { dataBlobSha, commitSha, ...externalized };
      }

      async function recoverCommittedGitData(snapshot, remote) {
        const externalized = await externalizeSnapshotDataUrls(snapshot);
        if (!cloudSnapshotsSemanticallyEqual(externalized.snapshot, remote?.raw)) return null;
        return {
          dataBlobSha: remote.sha,
          commitSha: '',
          ...externalized
        };
      }

      function emptyCloudSnapshot() {
        return { version: CATALOG_VERSION, exportedAt: '', projects: [], elements: [], categories: [], settings: {} };
      }

      function isCloudSnapshot(raw) {
        return Boolean(raw && typeof raw === 'object' && Array.isArray(raw.projects) && Array.isArray(raw.elements));
      }

      function snapshotVersion(snapshot) {
        const version = Number(snapshot?.version);
        return Number.isFinite(version) ? version : 0;
      }

      function snapshotExportedAt(snapshot) {
        const timestamp = Date.parse(asText(snapshot?.exportedAt));
        return Number.isFinite(timestamp) ? timestamp : 0;
      }

      function isPublishedSnapshotNewer(server, local) {
        if (!isCloudSnapshot(server)) return false;
        if (!isCloudSnapshot(local)) return true;
        const serverVersion = snapshotVersion(server);
        const localVersion = snapshotVersion(local);
        if (serverVersion !== localVersion) return serverVersion > localVersion;
        return snapshotExportedAt(server) > snapshotExportedAt(local);
      }

      function cloneSnapshot(snapshot) {
        if (snapshot === undefined) return undefined;
        return JSON.parse(JSON.stringify(snapshot));
      }

      function cloudSnapshotSemantics(snapshot) {
        const sorted = (rows, identity) => [...(Array.isArray(rows) ? rows : [])]
          .sort((left, right) => identity(left).localeCompare(identity(right), 'en'));
        const settings = Array.isArray(snapshot?.settings)
          ? Object.fromEntries(snapshot.settings.filter((row) => row && hasOwn(row, 'key')).map((row) => [row.key, row.value]))
          : (snapshot?.settings || {});
        return {
          version: Number(snapshot?.version) || CATALOG_VERSION,
          projects: sorted(snapshot?.projects, (row) => String(row?.id ?? '')),
          elements: sorted(snapshot?.elements, (row) => String(row?.id ?? '')),
          categories: sorted(snapshot?.categories, (row) => asText(row?.key || categoryKey(row?.name))),
          settings
        };
      }

      function cloudSnapshotsSemanticallyEqual(left, right) {
        return isCloudSnapshot(left)
          && isCloudSnapshot(right)
          && valuesEqual(cloudSnapshotSemantics(left), cloudSnapshotSemantics(right));
      }

      function compactOutboxRecord(record) {
        return {
          ...record,
          version: 2,
          baseSha: asText(record.baseSha).trim(),
          baseEtag: asText(record.baseEtag).trim(),
          ...(isCloudSnapshot(record.baseSnapshot) ? { baseSnapshot: cloneSnapshot(record.baseSnapshot) } : {}),
          ...(isCloudSnapshot(record.localSnapshot) ? { localSnapshot: cloneSnapshot(record.localSnapshot) } : {}),
          localConflicts: Array.isArray(record.localConflicts) ? [...new Set(record.localConflicts)].sort() : []
        };
      }

      function prepareRemoteSnapshot(raw, meta = {}) {
        if (!isCloudSnapshot(raw)) throw new Error('Облачный data.json имеет неверную структуру.');
        return {
          raw,
          incoming: prepareImport(raw),
          sha: asText(meta.sha).trim(),
          etag: asText(meta.etag).trim(),
          empty: raw.projects.length === 0 && raw.elements.length === 0
        };
      }

      async function remoteSnapshotFromPayload(payload, contentsEtag = '') {
        if (!payload || payload.type !== 'file') throw new Error('Облачный data.json недоступен.');
        let source = '';
        if (payload.content && payload.encoding === 'base64') {
          source = textFromBase64(payload.content);
        } else if (payload.download_url) {
          const rawResponse = await fetch(payload.download_url, {
            method: 'GET',
            headers: { Accept: 'application/vnd.github.raw+json' },
            cache: 'no-store'
          });
          if (!rawResponse.ok) throw new Error(`GitHub raw GET: ${rawResponse.status}`);
          source = await rawResponse.text();
        } else {
          throw new Error('Облачный data.json не содержит содержимого.');
        }
        return prepareRemoteSnapshot(JSON.parse(source), { sha: payload.sha, etag: contentsEtag });
      }

      function getCloudSyncValue(key) {
        return new Promise((resolve, reject) => {
          const transaction = state.db.transaction('cloudSync', 'readonly');
          const request = transaction.objectStore('cloudSync').get(key);
          request.onsuccess = () => resolve(request.result?.value ?? null);
          request.onerror = () => reject(request.error || new Error('Не удалось прочитать облачный кэш.'));
        });
      }

      function writeCloudSyncBatch(entries = [], deleteKeys = []) {
        return runTransaction(['cloudSync'], 'readwrite', (transaction) => {
          const store = transaction.objectStore('cloudSync');
          for (const [key, value] of entries) store.put({ key, value, updatedAt: Date.now() });
          for (const key of deleteKeys) store.delete(key);
        });
      }

      function enqueueCloudSync(work, onError = null) {
        const job = state.cloud.syncQueue.then(work);
        state.cloud.syncQueue = job.catch((error) => {
          if (onError) onError(error);
        });
        return job;
      }

      function outboxMarker(record) {
        return JSON.stringify({
          version: 2,
          storage: 'indexedDB',
          revision: record.revision,
          baseSha: asText(record.baseSha).trim(),
          updatedAt: Date.now()
        });
      }

      function saveOutboxMarker(record) {
        return saveLocalValue(CLOUD_OUTBOX_KEY, outboxMarker(record));
      }

      function baseRecordFrom(snapshot, sha, contentsEtag) {
        const confirmed = cloneSnapshot(snapshot);
        return {
          version: 2,
          sha: asText(sha).trim(),
          contentsEtag: asText(contentsEtag).trim(),
          snapshot: confirmed,
          knownProjectIds: confirmed.projects.map((project) => String(project.id)),
          knownElementIds: confirmed.elements.map((element) => String(element.id)),
          savedAt: Date.now()
        };
      }

      function applyBaseRecord(record) {
        if (!record || !isCloudSnapshot(record.snapshot)) return false;
        state.cloud.baseSha = asText(record.sha).trim();
        state.cloud.baseEtag = asText(record.contentsEtag).trim();
        state.cloud.baseSnapshot = cloneSnapshot(record.snapshot);
        state.cloud.knownProjectIds = new Set((record.knownProjectIds || record.snapshot.projects.map((project) => project.id)).map(String));
        state.cloud.knownElementIds = new Set((record.knownElementIds || record.snapshot.elements.map((element) => element.id)).map(String));
        state.cloud.remoteProjectCount = record.snapshot.projects.length;
        state.cloud.initialPullDone = true;
        return true;
      }

      function validOutboxRecord(record) {
        return Boolean(record && Number.isInteger(record.revision) && record.revision > 0 && isCloudSnapshot(record.snapshot));
      }

      async function rememberRemoteSnapshot(raw) {
        if (!isCloudSnapshot(raw)) return false;
        await enqueueCloudSync(() => writeCloudSyncBatch([['cache', cloneSnapshot(raw)]]));
        return true;
      }

      async function loadCloudSyncState() {
        const localSnapshot = catalogSnapshot();
        const [storedBase, storedOutbox, storedCache] = await Promise.all([
          getCloudSyncValue('base'), getCloudSyncValue('outbox'), getCloudSyncValue('cache')
        ]);
        const hadStoredBase = applyBaseRecord(storedBase);

        let outbox = validOutboxRecord(storedOutbox) ? storedOutbox : null;
        const legacyOutboxText = localValue(CLOUD_OUTBOX_KEY);
        if (!outbox && legacyOutboxText) {
          try {
            const legacy = JSON.parse(legacyOutboxText);
            if (validOutboxRecord(legacy)) outbox = legacy;
          } catch (error) {
            state.cloud.outboxError = true;
          }
        }
        if (outbox) {
          const legacyBaseSnapshot = isCloudSnapshot(outbox.baseSnapshot) ? outbox.baseSnapshot : null;
          const baseSha = asText(outbox.baseSha || state.cloud.baseSha).trim();
          const baseEtag = asText(outbox.baseEtag || state.cloud.baseEtag).trim();
          if (legacyBaseSnapshot) {
            const legacyBase = baseRecordFrom(legacyBaseSnapshot, baseSha, baseEtag);
            await writeCloudSyncBatch([['base', legacyBase]]);
            applyBaseRecord(legacyBase);
          }
          outbox = compactOutboxRecord({ ...outbox, baseSha, baseEtag });
          state.cloud.outbox = outbox;
          state.cloud.revision = Math.max(state.cloud.revision, outbox.revision);
          state.cloud.dirty = true;
          state.cloud.outboxError = false;
          const localChanged = hadStoredBase
            && !cloudSnapshotsSemanticallyEqual(localSnapshot, state.cloud.baseSnapshot);
          const localReplacesOutbox = localChanged
            && !cloudSnapshotsSemanticallyEqual(localSnapshot, outbox.snapshot);
          if (localReplacesOutbox) {
            persistCloudOutbox(localSnapshot);
            await state.cloud.syncQueue;
          } else {
            await writeCloudSyncBatch([['outbox', outbox]]);
            saveOutboxMarker(outbox);
            if (!localChanged) await rehydrateOutboxCatalog(outbox);
          }
        } else if (legacyOutboxText) {
          removeLocalValue(CLOUD_OUTBOX_KEY);
        }

        if (!outbox && hadStoredBase && !cloudSnapshotsSemanticallyEqual(localSnapshot, state.cloud.baseSnapshot)) {
          persistCloudOutbox(localSnapshot);
          await state.cloud.syncQueue;
        }

        let cacheMigrated = Boolean(storedCache);
        if (!storedCache) {
          const legacyCacheText = localValue(CLOUD_CACHE_KEY);
          if (legacyCacheText) {
            try {
              const legacyCache = JSON.parse(legacyCacheText);
              if (isCloudSnapshot(legacyCache)) {
                await writeCloudSyncBatch([['cache', legacyCache]]);
                cacheMigrated = true;
              }
            } catch (error) {
              // Invalid legacy cache is ignored; IndexedDB catalog data remains untouched.
            }
          }
        }
        if (cacheMigrated) removeLocalValue(CLOUD_CACHE_KEY);
      }

      async function rehydrateOutboxCatalog(record) {
        const incoming = prepareImport(record.snapshot);
        const base = isCloudSnapshot(record.baseSnapshot)
          ? record.baseSnapshot
          : (state.cloud.baseSnapshot || emptyCloudSnapshot());
        const knownProjects = new Set(base.projects.map((project) => String(project.id)));
        const knownElements = new Set(base.elements.map((element) => String(element.id)));
        const currentProjectKeys = new Map(state.projects.map((project) => [String(project.id), project.id]));
        const currentElementKeys = new Map(state.elements.map((element) => [String(element.id), element.id]));
        const projectMap = new Map(incoming.projects.map((project) => [String(project.id), project]));
        const elementMap = new Map(incoming.elements.map((element) => [String(element.id), element]));
        let preservedUnknown = false;

        for (const project of state.projects) {
          const id = String(project.id);
          if (!knownProjects.has(id) && !projectMap.has(id)) {
            projectMap.set(id, project);
            preservedUnknown = true;
          }
        }
        for (const element of state.elements) {
          const id = String(element.id);
          if (!knownElements.has(id) && !elementMap.has(id) && projectMap.has(String(element.projectId))) {
            elementMap.set(id, element);
            preservedUnknown = true;
          }
        }

        state.projects = [...projectMap.values()];
        state.elements = [...elementMap.values()].filter((element) => projectMap.has(String(element.projectId)));
        state.categories = categoryRecords(state.elements, incoming.categories);
        state.settings = incoming.settings;
        state.activeProjectId = state.settings.activeProjectId && findProject(state.settings.activeProjectId)
          ? state.settings.activeProjectId : state.projects[0]?.id || null;
        state.editingElementId = null;
        state.newElementId = null;
        const finalProjectIds = new Set(state.projects.map((project) => String(project.id)));
        const finalElementIds = new Set(state.elements.map((element) => String(element.id)));
        await commit(() => runTransaction(['projects', 'elements', 'categories', 'settings'], 'readwrite', (transaction) => {
          const projects = transaction.objectStore('projects');
          const elements = transaction.objectStore('elements');
          for (const id of knownProjects) if (!finalProjectIds.has(id)) projects.delete(currentProjectKeys.get(id) ?? id);
          for (const id of knownElements) if (!finalElementIds.has(id)) elements.delete(currentElementKeys.get(id) ?? id);
          for (const project of state.projects) projects.put(project);
          for (const element of state.elements) elements.put(element);
          writeCategoryRecords(transaction);
          const settings = transaction.objectStore('settings');
          for (const [key, value] of Object.entries(state.settings)) settings.put({ key, value });
        }), { backup: false });
        if (preservedUnknown) persistCloudOutbox(catalogSnapshot());
        applyTheme();
      }

      function persistCloudOutbox(snapshot = catalogSnapshot()) {
        const localSnapshot = cloneSnapshot(snapshot);
        const previous = validOutboxRecord(state.cloud.outbox) ? state.cloud.outbox : null;
        const previousLocal = isCloudSnapshot(previous?.localSnapshot) ? previous.localSnapshot : previous?.snapshot;
        const merged = previous && isCloudSnapshot(previousLocal)
          ? mergeCloudSnapshots(previousLocal, previous.snapshot, localSnapshot)
          : { ok: true, snapshot: localSnapshot, conflicts: [] };
        const previousConflicts = Array.isArray(previous?.localConflicts) ? previous.localConflicts : [];
        const previousStickyConflicts = previousConflicts.filter((path) =>
          !conflictFieldsChanged([path], previousLocal, localSnapshot)
        );
        const localConflicts = [...new Set([
          ...previousStickyConflicts,
          ...(merged.ok ? [] : merged.conflicts)
        ])].sort();
        const baseSnapshot = isCloudSnapshot(previous?.baseSnapshot)
          ? previous.baseSnapshot
          : (state.cloud.baseSnapshot || emptyCloudSnapshot());
        const record = compactOutboxRecord({
          version: 2,
          revision: state.cloud.revision + 1,
          createdAt: Date.now(),
          baseSha: previous?.baseSha ?? state.cloud.baseSha,
          baseEtag: previous?.baseEtag ?? state.cloud.baseEtag,
          baseSnapshot,
          snapshot: merged.ok ? merged.snapshot : cloneSnapshot(previous.snapshot),
          localSnapshot,
          localConflicts
        });
        state.cloud.revision = record.revision;
        state.cloud.outbox = record;
        state.cloud.dirty = true;
        state.cloud.outboxError = false;
        saveOutboxMarker(record);
        enqueueCloudSync(() => writeCloudSyncBatch([['outbox', record]]), () => {
          if (state.cloud.outbox?.revision === record.revision) {
            state.cloud.outboxError = true;
            setCloudError('Ошибка: локального хранилища');
          }
        });
        return true;
      }

      async function clearCloudOutbox(revision) {
        if (!state.cloud.outbox || state.cloud.outbox.revision !== revision) return false;
        await enqueueCloudSync(() => writeCloudSyncBatch([], ['outbox']));
        if (!state.cloud.outbox || state.cloud.outbox.revision !== revision) return false;
        removeLocalValue(CLOUD_OUTBOX_KEY);
        state.cloud.outbox = null;
        state.cloud.dirty = state.cloud.outboxPending;
        state.cloud.outboxError = false;
        return true;
      }

      function stableJson(value) {
        if (Array.isArray(value)) return `[${value.map(stableJson).join(',')}]`;
        if (value && typeof value === 'object') {
          return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableJson(value[key])}`).join(',')}}`;
        }
        return JSON.stringify(value);
      }

      function valuesEqual(left, right) {
        return stableJson(left) === stableJson(right);
      }

      function snapshotConflictValue(snapshot, path) {
        const entity = /^(projects|elements|categories)\[([^\]]+)\](?:\.([^:]+))?/.exec(path);
        if (entity) {
          const [, collection, id, field] = entity;
          const row = (snapshot?.[collection] || []).find((entry) => String(
            collection === 'categories' ? asText(entry.key || categoryKey(entry.name)).trim() : entry.id
          ) === id);
          if (!field) return { exists: Boolean(row), value: row };
          return { exists: Boolean(row && hasOwn(row, field)), value: row?.[field] };
        }
        const setting = /^settings\.([^:]+)/.exec(path);
        if (setting) {
          const settings = snapshot?.settings || {};
          return { exists: hasOwn(settings, setting[1]), value: settings[setting[1]] };
        }
        return { exists: false, value: undefined };
      }

      function conflictFieldsChanged(conflicts, before, after) {
        return conflicts.some((path) => !valuesEqual(
          snapshotConflictValue(before, path), snapshotConflictValue(after, path)
        ));
      }

      function mergeRecordFields(base, remote, local, path, conflicts) {
        const merged = {};
        const keys = new Set([...Object.keys(base || {}), ...Object.keys(remote || {}), ...Object.keys(local || {})]);
        for (const key of [...keys].sort()) {
          const baseHas = hasOwn(base || {}, key);
          const remoteHas = hasOwn(remote || {}, key);
          const localHas = hasOwn(local || {}, key);
          const baseValue = baseHas ? base[key] : undefined;
          const remoteValue = remoteHas ? remote[key] : undefined;
          const localValueNext = localHas ? local[key] : undefined;
          const remoteChanged = remoteHas !== baseHas || !valuesEqual(remoteValue, baseValue);
          const localChanged = localHas !== baseHas || !valuesEqual(localValueNext, baseValue);
          let chosenHas = baseHas;
          let chosen = baseValue;
          if (remoteChanged && !localChanged) {
            chosenHas = remoteHas;
            chosen = remoteValue;
          } else if (localChanged && !remoteChanged) {
            chosenHas = localHas;
            chosen = localValueNext;
          } else if (remoteChanged && localChanged) {
            if (remoteHas === localHas && valuesEqual(remoteValue, localValueNext)) {
              chosenHas = remoteHas;
              chosen = remoteValue;
            } else if (key === 'updatedAt') {
              chosenHas = remoteHas || localHas;
              chosen = Math.max(Number(remoteValue) || 0, Number(localValueNext) || 0) || remoteValue || localValueNext;
            } else if (key === 'progress' || key === 'uses' || key === 'repeats') {
              chosenHas = localHas;
              chosen = localValueNext;
            } else {
              conflicts.push(`${path}.${key}`);
              continue;
            }
          }
          if (chosenHas) merged[key] = cloneSnapshot(chosen);
        }
        return merged;
      }

      function snapshotIdentityMap(rows, identity) {
        return new Map(rows.map((row) => [identity(row), row]));
      }

      function knownRemoteDeletions(knownIds, freshIds) {
        const fresh = new Set([...freshIds].map(String));
        return [...knownIds].map(String).filter((id) => !fresh.has(id)).sort();
      }

      function mergeEntityCollections(baseRows, remoteRows, localRows, identity, path, conflicts) {
        const baseMap = snapshotIdentityMap(baseRows, identity);
        const remoteMap = snapshotIdentityMap(remoteRows, identity);
        const localMap = snapshotIdentityMap(localRows, identity);
        const orderedIds = [];
        const seen = new Set();
        for (const row of [...localRows, ...remoteRows, ...baseRows]) {
          const id = identity(row);
          if (!seen.has(id)) {
            seen.add(id);
            orderedIds.push(id);
          }
        }
        const merged = [];
        for (const id of orderedIds) {
          const baseHas = baseMap.has(id);
          const remoteHas = remoteMap.has(id);
          const localHas = localMap.has(id);
          const base = baseMap.get(id);
          const remote = remoteMap.get(id);
          const local = localMap.get(id);
          if (!baseHas) {
            if (remoteHas && localHas) {
              const row = mergeRecordFields({}, remote, local, `${path}[${id}]`, conflicts);
              if (!conflicts.some((entry) => entry.startsWith(`${path}[${id}]`))) merged.push(row);
            } else if (localHas) merged.push(cloneSnapshot(local));
            else if (remoteHas) merged.push(cloneSnapshot(remote));
            continue;
          }
          if (!remoteHas && !localHas) continue;
          if (!remoteHas) {
            if (valuesEqual(local, base)) continue;
            conflicts.push(`${path}[${id}]: удалено в облаке, изменено локально`);
            continue;
          }
          if (!localHas) {
            if (valuesEqual(remote, base)) continue;
            conflicts.push(`${path}[${id}]: удалено локально, изменено в облаке`);
            continue;
          }
          merged.push(mergeRecordFields(base, remote, local, `${path}[${id}]`, conflicts));
        }
        return merged;
      }

      function mergeCloudSnapshots(base, remote, local) {
        if (![base, remote, local].every(isCloudSnapshot)) return { ok: false, conflicts: ['snapshot: неверная структура'] };
        const conflicts = [];
        const projectIdentity = (row) => String(row.id);
        const elementIdentity = (row) => String(row.id);
        const categoryIdentity = (row) => asText(row.key || categoryKey(row.name)).trim();
        const projects = mergeEntityCollections(base.projects, remote.projects, local.projects, projectIdentity, 'projects', conflicts);
        const elements = mergeEntityCollections(base.elements, remote.elements, local.elements, elementIdentity, 'elements', conflicts);
        const categories = mergeEntityCollections(base.categories || [], remote.categories || [], local.categories || [], categoryIdentity, 'categories', conflicts);
        const settings = mergeRecordFields(base.settings || {}, remote.settings || {}, local.settings || {}, 'settings', conflicts);
        if (conflicts.length) return { ok: false, conflicts: [...new Set(conflicts)].sort() };
        return {
          ok: true,
          conflicts: [],
          snapshot: {
            version: Math.max(Number(base.version) || 0, Number(remote.version) || 0, Number(local.version) || CATALOG_VERSION),
            exportedAt: new Date().toISOString(),
            projects,
            elements,
            categories,
            settings
          }
        };
      }

      async function rebaseOutboxRecord(record, freshRemote) {
        if (!validOutboxRecord(record) || !freshRemote || freshRemote.unchanged) {
          return { ok: false, conflicts: ['outbox: недоступна база слияния'] };
        }
        if (state.cloud.outbox?.revision !== record.revision) return { ok: false, stale: true, conflicts: [] };
        const base = isCloudSnapshot(record.baseSnapshot)
          ? record.baseSnapshot
          : (state.cloud.baseSnapshot || emptyCloudSnapshot());
        const merged = mergeCloudSnapshots(base, freshRemote.raw, record.snapshot);
        if (!merged.ok) return merged;
        const rebased = {
          ...record,
          version: 2,
          baseSha: freshRemote.sha,
          baseEtag: freshRemote.etag,
          baseSnapshot: cloneSnapshot(freshRemote.raw),
          snapshot: merged.snapshot,
          rebasedAt: Date.now()
        };
        const compactRebased = compactOutboxRecord(rebased);
        const baseRecord = baseRecordFrom(freshRemote.raw, freshRemote.sha, freshRemote.etag);
        await enqueueCloudSync(() => writeCloudSyncBatch([['base', baseRecord], ['outbox', compactRebased]]));
        if (state.cloud.outbox?.revision !== record.revision) return { ok: false, stale: true, conflicts: [] };
        state.cloud.outbox = compactRebased;
        state.cloud.baseSha = freshRemote.sha;
        state.cloud.baseEtag = freshRemote.etag;
        state.cloud.baseSnapshot = cloneSnapshot(freshRemote.raw);
        updateKnownRemoteIds(freshRemote.incoming);
        state.cloud.initialPullDone = true;
        saveOutboxMarker(compactRebased);
        return { ok: true, record: compactRebased };
      }

      async function snapshotHash(serialized) {
        const bytes = new TextEncoder().encode(serialized);
        if (globalThis.crypto?.subtle) {
          const digest = new Uint8Array(await globalThis.crypto.subtle.digest('SHA-256', bytes));
          return [...digest].map((byte) => byte.toString(16).padStart(2, '0')).join('');
        }
        let hash = 2166136261;
        for (const byte of bytes) hash = Math.imul(hash ^ byte, 16777619) >>> 0;
        return `fnv1a-${hash.toString(16).padStart(8, '0')}`;
      }

      async function persistConfirmedBackup(snapshot, sha) {
        if (!isCloudSnapshot(snapshot)) return false;
        const confirmed = cloneSnapshot(snapshot);
        const serialized = JSON.stringify(confirmed);
        const hash = await snapshotHash(serialized);
        const record = { version: 2, sha: asText(sha).trim(), hash, bytes: new Blob([serialized]).size, snapshot: confirmed, savedAt: Date.now() };
        try {
          await enqueueCloudSync(() => writeCloudSyncBatch([['backup', record]]));
          const verified = await getCloudSyncValue('backup');
          if (!verified || verified.hash !== hash || !isCloudSnapshot(verified.snapshot) || !valuesEqual(verified.snapshot, confirmed)) return false;
        } catch (error) {
          return false;
        }
        try {
          localStorage.setItem(CLOUD_BACKUP_KEY, serialized);
          const fullStored = localStorage.getItem(CLOUD_BACKUP_KEY);
          if (fullStored === serialized) {
            saveLocalValue(CLOUD_BACKUP_COMPAT_KEY, JSON.stringify({ version: 2, storage: 'localStorage', key: CLOUD_BACKUP_KEY, hash, bytes: record.bytes }));
            return true;
          }
        } catch (error) {
          // Large snapshots fall back to the verified IndexedDB copy plus a compact manifest.
        }
        const manifest = JSON.stringify({ version: 2, storage: 'indexedDB', store: 'cloudSync', key: 'backup', sha: record.sha, hash, bytes: record.bytes, savedAt: record.savedAt });
        if (!saveLocalValue(CLOUD_BACKUP_KEY, manifest)) return false;
        saveLocalValue(CLOUD_BACKUP_COMPAT_KEY, manifest);
        return localValue(CLOUD_BACKUP_KEY) === manifest;
      }

      function setCloudError(message) {
        state.cloud.error = message;
        setSaveState('error', message);
      }

      function markCloudDirty({ allowDuringImport = false } = {}) {
        if (state.cloud.applying || (state.cloud.importing && !allowDuringImport)) return false;
        if (!state.cloud.dirty || !state.cloud.firstDirtyAt) state.cloud.firstDirtyAt = Date.now();
        clearTimeout(state.cloud.saveTimer);
        state.cloud.saveTimer = null;
        state.cloud.saveDueAt = 0;
        clearTimeout(state.cloud.outboxTimer);
        state.cloud.outboxTimer = null;
        state.cloud.dirty = true;
        state.cloud.error = '';
        setSaveState('saving', 'Сохранение…');
        if (allowDuringImport) {
          state.cloud.outboxPending = false;
          persistCloudOutbox();
          return true;
        }
        state.cloud.outboxPending = true;
        state.cloud.outboxTimer = setTimeout(() => {
          state.cloud.outboxTimer = null;
          if (!state.cloud.outboxPending) return;
          state.cloud.outboxPending = false;
          persistCloudOutbox();
          state.cloud.syncQueue.then(() => {
            if (state.cloud.ready && state.cloud.dirty && !state.cloud.outboxError && !state.cloud.outboxPending && !state.cloud.importing) {
              scheduleCloudSave();
            }
          });
        }, CLOUD_SAVE_DELAY);
        return true;
      }

      // Every push is a commit and every commit is a GitHub Pages build, so pushes are
      // batched: at most one per CLOUD_PUSH_MIN_INTERVAL, and never one per keystroke.
      // A pending deadline is never pushed further away — the poll runs every few seconds
      // and would otherwise postpone the upload forever.
      function scheduleCloudSave(delay = CLOUD_PUSH_DELAY) {
        if (state.cloud.importing || state.cloud.outboxPending || state.cloud.outboxTimer) return;
        const now = Date.now();
        const earliest = state.cloud.lastPushAt ? state.cloud.lastPushAt + CLOUD_PUSH_MIN_INTERVAL : now;
        const latest = (state.cloud.firstDirtyAt || now) + CLOUD_PUSH_MAX_DEFERRAL;
        const dueAt = Math.max(Math.min(now + delay, Math.max(latest, earliest)), earliest);
        if (state.cloud.saveTimer && state.cloud.saveDueAt <= dueAt) return;
        clearTimeout(state.cloud.saveTimer);
        state.cloud.saveDueAt = dueAt;
        state.cloud.pendingPush = true;
        state.cloud.saveTimer = setTimeout(() => {
          state.cloud.saveTimer = null;
          state.cloud.saveDueAt = 0;
          state.cloud.pendingPush = false;
          saveCloud().catch(() => undefined);
        }, Math.max(0, dueAt - Date.now()));
        setSaveState('saving');
      }

      function flushCloudSave(force = false) {
        if (!state.cloud.dirty || state.cloud.importing) return;
        if (!force) {
          scheduleCloudSave(CLOUD_PUSH_BLUR_DELAY);
          return;
        }
        clearTimeout(state.cloud.saveTimer);
        state.cloud.saveTimer = null;
        state.cloud.pendingPush = false;
        saveCloud().catch(() => undefined);
      }

      function updateKnownRemoteIds(incoming) {
        state.cloud.knownProjectIds = new Set(incoming.projects.map((project) => String(project.id)));
        state.cloud.knownElementIds = new Set(incoming.elements.map((element) => String(element.id)));
        state.cloud.remoteProjectCount = incoming.projects.length;
      }

      async function commitAppliedRemote(remote) {
        const record = baseRecordFrom(remote.raw, remote.sha, remote.etag);
        await enqueueCloudSync(() => writeCloudSyncBatch([['base', record], ['cache', cloneSnapshot(remote.raw)]]));
        state.cloud.baseSha = remote.sha;
        state.cloud.baseEtag = remote.etag;
        state.cloud.baseSnapshot = cloneSnapshot(remote.raw);
        state.cloud.observedSha = remote.sha;
        state.cloud.observedEtag = remote.etag || state.cloud.observedEtag;
        updateKnownRemoteIds(remote.incoming);
        state.cloud.initialPullDone = true;
      }

      function canApplyRemote() {
        return !state.cloud.dirty && !state.cloud.saving && !state.cloud.importing && !isTextEditing() && !isTypingPause();
      }

      function remoteDataChanged(remote) {
        const remoteProjectIds = new Set(remote.incoming.projects.map((project) => String(project.id)));
        const remoteElementIds = new Set(remote.incoming.elements.map((element) => String(element.id)));
        return [...state.cloud.knownProjectIds].some((id) => !remoteProjectIds.has(id) && findProject(id))
          || [...state.cloud.knownElementIds].some((id) => !remoteElementIds.has(id) && findElement(id))
          || remote.incoming.projects.some((project) => !valuesEqual(findProject(project.id), project))
          || remote.incoming.elements.some((element) => {
            const local = findElement(element.id);
            return !valuesEqual(local, remoteElementWithLocalImage(element, local));
          })
          || remoteSettingsEntries(remote).some(([key, value]) => !valuesEqual(state.settings[key], value));
      }

      function remoteElementWithLocalImage(remoteElement, localElement) {
        const remoteImage = asText(remoteElement?.image).trim();
        const localImage = asText(localElement?.image).trim();
        if (!remoteImage && localImage) return { ...remoteElement, image: localElement.image };
        return remoteElement;
      }

      function preservePreviewImages(render) {
        const previews = new Map();
        for (const card of dom.workspaceInner.querySelectorAll('[data-element-id]')) {
          const image = card.querySelector('.image-slot img');
          if (image) previews.set(previewImageKey(card, image), image);
        }
        render();
        for (const card of dom.workspaceInner.querySelectorAll('[data-element-id]')) {
          const image = card.querySelector('.image-slot img');
          if (!image) continue;
          const preserved = previews.get(previewImageKey(card, image));
          if (preserved && preserved !== image) image.replaceWith(preserved);
        }
      }

      function renderFeedPreservingPreviewImages() {
        preservePreviewImages(renderFeed);
      }

      function patchRemoteFeed(previousActiveId, previousVisibleIds, changedElementIds) {
        if (state.videoComposer || state.editingElementId || state.newElementId || state.search.trim() || state.categoryFilter) return false;
        if (String(state.activeProjectId) !== String(previousActiveId)) return false;
        const project = findProject(state.activeProjectId);
        const grid = dom.workspaceInner.querySelector('#elementGrid');
        if (!project || !grid) return false;

        const cards = [...grid.children].filter((node) => node.classList.contains('element-card'));
        const currentIds = cards.map((card) => String(card.dataset.elementId));
        const nextElements = elementsForProject(project.id);
        const nextIds = nextElements.map((element) => String(element.id));
        if (!valuesEqual(currentIds, previousVisibleIds) || !valuesEqual(nextIds, previousVisibleIds)) return false;

        const cardsById = new Map(cards.map((card) => [String(card.dataset.elementId), card]));
        for (const element of nextElements) {
          const id = String(element.id);
          if (!changedElementIds.has(id)) continue;
          const card = cardsById.get(id);
          if (!card) return false;
          preservePreviewImages(() => { card.outerHTML = elementCard(project, element); });
        }
        updateProjectCounts(project.id);
        renderSidebar();
        if (state.statsOpen) renderStats();
        applyReadOnlyState();
        return true;
      }

      function remoteSettingsEntries(remote) {
        const rawSettings = remote?.raw?.settings;
        if (Array.isArray(rawSettings)) {
          return rawSettings.filter((row) => row && hasOwn(row, 'key')).map((row) => [row.key, remote.incoming.settings[row.key]]);
        }
        if (rawSettings && typeof rawSettings === 'object') {
          return Object.keys(rawSettings).map((key) => [key, remote.incoming.settings[key]]);
        }
        return [];
      }

      async function applyRemoteSnapshot(remote, { allowDirty = false, suppressCloudMark = false } = {}) {
        if (!remote || remote.unchanged) return false;
        // An allowDirty merge may be needed during cloud recovery, but it must never replace a live draft.
        if (isTextEditing() || isTypingPause()) {
          state.cloud.pendingSnapshot = remote;
          return false;
        }
        if (!allowDirty && !canApplyRemote()) {
          state.cloud.pendingSnapshot = remote;
          return false;
        }
        const firstEmptyCloudMigration = remote.empty
          && !state.cloud.initialPullDone
          && !state.cloud.baseSnapshot
          && state.projects.length > 0;
        if (firstEmptyCloudMigration) {
          await commitAppliedRemote(remote);
          state.cloud.pendingSnapshot = null;
          if (!suppressCloudMark && state.projects.length > 0 && !state.cloud.outbox) markCloudDirty();
          setSaveState('saved', 'Сохранено');
          return true;
        }

        const changed = remoteDataChanged(remote);
        const hadInitialPull = state.cloud.initialPullDone;
        const previousEditing = state.editingElementId;
        const previousNew = state.newElementId;
        const previousActive = state.activeProjectId;
        const previousScroll = dom.workspace.scrollTop;
        const previousVisibleIds = !state.videoComposer && !previousEditing && !previousNew && !state.search.trim() && !state.categoryFilter && previousActive
          ? elementsForProject(previousActive).map((element) => String(element.id)) : [];
        const previousElements = new Map(state.elements.map((element) => [String(element.id), element]));
        const projectMap = new Map(state.projects.map((project) => [String(project.id), project]));
        const elementMap = new Map(state.elements.map((element) => [String(element.id), element]));
        const currentProjectKeys = new Map(state.projects.map((project) => [String(project.id), project.id]));
        const currentElementKeys = new Map(state.elements.map((element) => [String(element.id), element.id]));
        const previousKnownProjects = new Set(state.cloud.knownProjectIds);
        const previousKnownElements = new Set(state.cloud.knownElementIds);
        const remoteProjectIds = new Set(remote.incoming.projects.map((project) => String(project.id)));
        const remoteElementIds = new Set(remote.incoming.elements.map((element) => String(element.id)));
        const deletedElementIds = new Set(knownRemoteDeletions(previousKnownElements, remoteElementIds));
        for (const id of deletedElementIds) elementMap.delete(id);
        const deletedProjectIds = new Set();
        for (const id of knownRemoteDeletions(previousKnownProjects, remoteProjectIds)) {
          const hasUnknownChild = [...elementMap.values()].some((element) => String(element.projectId) === id && !previousKnownElements.has(String(element.id)));
          if (!hasUnknownChild) {
            projectMap.delete(id);
            deletedProjectIds.add(id);
          }
        }
        for (const project of remote.incoming.projects) projectMap.set(String(project.id), project);
        const appliedRemoteElements = remote.incoming.elements.map((element) => {
          const next = remoteElementWithLocalImage(element, elementMap.get(String(element.id)));
          elementMap.set(String(element.id), next);
          return next;
        });
        const preservedUnknown = [...projectMap.keys()].some((id) => !remoteProjectIds.has(id) && !previousKnownProjects.has(id))
          || [...elementMap.keys()].some((id) => !remoteElementIds.has(id) && !previousKnownElements.has(id));

        let restored = { elements: [], projects: [], conflicts: [], count: 0 };
        state.cloud.applying = true;
        applyReadOnlyState();
        try {
          state.projects = [...projectMap.values()];
          state.elements = [...elementMap.values()].filter((element) => projectMap.has(String(element.projectId)));
          state.categories = categoryRecords(state.elements, remote.incoming.categories);
          state.settings = { ...state.settings, ...Object.fromEntries(remoteSettingsEntries(remote)) };
          state.activeProjectId = previousActive && findProject(previousActive) ? previousActive
            : (state.settings.activeProjectId && findProject(state.settings.activeProjectId) ? state.settings.activeProjectId : state.projects[0]?.id || null);
          state.editingElementId = previousEditing && findElement(previousEditing) ? previousEditing : null;
          state.newElementId = previousNew && findElement(previousNew) ? previousNew : null;
          restored = restoreDrafts();
          await commit(() => runTransaction(['projects', 'elements', 'categories', 'settings'], 'readwrite', (transaction) => {
            const projects = transaction.objectStore('projects');
            const elements = transaction.objectStore('elements');
            for (const id of deletedElementIds) elements.delete(currentElementKeys.get(id) ?? id);
            for (const id of deletedProjectIds) projects.delete(currentProjectKeys.get(id) ?? id);
            for (const project of remote.incoming.projects) projects.put(project);
            for (const element of appliedRemoteElements) elements.put(element);
            for (const element of restored.elements) elements.put(element);
            for (const project of restored.projects) projects.put(project);
            writeCategoryRecords(transaction);
            const settings = transaction.objectStore('settings');
            for (const [key, value] of remoteSettingsEntries(remote)) settings.put({ key, value });
          }), { backup: false });
          await commitAppliedRemote(remote);
          state.cloud.pendingSnapshot = null;
          applyTheme();
          if (changed) {
            const patched = patchRemoteFeed(previousActive, previousVisibleIds, new Set(
              appliedRemoteElements
                .filter((element) => !valuesEqual(previousElements.get(String(element.id)), element))
                .map((element) => String(element.id))
            ));
            if (!patched) {
              renderFeedPreservingPreviewImages();
              dom.workspace.scrollTop = previousScroll;
            }
          }
        } finally {
          state.cloud.applying = false;
          applyReadOnlyState();
        }
        if ((preservedUnknown || restored.count) && !suppressCloudMark) markCloudDirty();
        if (restored.conflicts.length) {
          showToast(`Ваш текст сохранён: партнёр правил ${[...new Set(restored.conflicts)].slice(0, 2).join(', ')}.`);
        }
        // The very first pull always differs from an empty catalog; that is not a partner.
        if (changed && hadInitialPull) markRemotePresence();
        setSaveState('saved', 'Сохранено');
        return changed;
      }

      async function applyPendingRemoteSnapshot() {
        const pending = state.cloud.pendingSnapshot;
        if (!pending || !canApplyRemote()) return;
        await applyRemoteSnapshot(pending);
      }

      async function getCloudSnapshot({ force = false, apply = true } = {}) {
        const headers = cloudHeaders(force ? {} : { 'If-None-Match': state.cloud.observedEtag || '""' });
        // A response that started before our own write finished is already stale: applying it
        // would roll the catalog back to the pre-write state.
        const writeGeneration = state.cloud.writeGeneration;
        const response = await fetch(GITHUB_CONTENTS_URL, { method: 'GET', headers, cache: 'no-store' });
        if (writeGeneration !== state.cloud.writeGeneration && !force) return { unchanged: true };
        if (response.status === 304) return { unchanged: true };
        const responseEtag = response.headers.get('ETag') || '';
        let remote;
        if (response.status === 404) {
          remote = prepareRemoteSnapshot(emptyCloudSnapshot(), { sha: '', etag: responseEtag });
        } else {
          if (!response.ok) throw new Error(`GitHub GET: ${response.status}`);
          const payload = await response.json();
          remote = await remoteSnapshotFromPayload(payload, responseEtag);
        }
        state.cloud.observedSha = remote.sha;
        state.cloud.observedEtag = remote.etag || responseEtag || state.cloud.observedEtag;
        state.cloud.remoteProjectCount = remote.incoming.projects.length;
        state.cloud.error = '';
        await rememberRemoteSnapshot(remote.raw);
        if (state.cloud.importing || state.cloud.pollPaused) return remote;
        if (apply) {
          if (writeGeneration !== state.cloud.writeGeneration) return remote;
          if (canApplyRemote()) await applyRemoteSnapshot(remote);
          else state.cloud.pendingSnapshot = remote;
        }
        return remote;
      }

      async function getPublishedSnapshot() {
        const separator = PUBLISHED_DATA_URL.includes('?') ? '&' : '?';
        const response = await fetch(`${PUBLISHED_DATA_URL}${separator}v=${Date.now()}`, {
          method: 'GET',
          headers: { Accept: 'application/json' },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(`data.json GET: ${response.status}`);
        return prepareRemoteSnapshot(await response.json(), {
          etag: response.headers.get('ETag') || ''
        });
      }

      async function refreshFromPublishedData({ force = false, notify = false } = {}) {
        if (dom.serverRefresh.disabled) return false;
        if (notify && (isTextEditing() || isTypingPause())) {
          showToast('Закончите редактирование: ваш текст не будет потерян.');
          return false;
        }
        dom.serverRefresh.disabled = true;
        dom.serverRefresh.textContent = 'Обновление…';
        try {
          const remote = await getPublishedSnapshot();
          const localReference = state.cloud.baseSnapshot;
          if (!force && !isPublishedSnapshotNewer(remote.raw, localReference)) return false;

          const unbasedLocalCatalog = !localReference && (state.projects.length > 0 || state.elements.length > 0);
          if ((state.cloud.dirty || unbasedLocalCatalog) && !validOutboxRecord(state.cloud.outbox)) {
            persistCloudOutbox(catalogSnapshot());
            await state.cloud.syncQueue;
          }

          const outbox = validOutboxRecord(state.cloud.outbox) ? state.cloud.outbox : null;
          if (outbox) {
            const rebased = await rebaseOutboxRecord(outbox, remote);
            if (rebased.ok) {
              await rehydrateOutboxCatalog(rebased.record);
              renderFeed();
              setSaveState('saving', 'В очереди');
              if (state.cloud.ready) scheduleCloudSave();
              if (notify) showToast('Сервер обновлён; локальные правки смёржены и сохранены.');
              return true;
            }

            const conflicts = rebased.conflicts.slice(0, 3).join(', ');
            const replace = globalThis.confirm(
              `На сервере новые данные, но автослияние не удалось${conflicts ? `: ${conflicts}` : '.'}\n\n` +
              'ОК — показать серверные данные. Локальные правки будут сохранены в резервной очереди, но не применятся автоматически.\n' +
              'Отмена — оставить локальные данные на экране.'
            );
            if (!replace) return false;
            if (!await archiveGuardedOutbox(outbox, 'published-refresh-merge-conflict')) {
              throw new Error('Не удалось сохранить резервную очередь.');
            }
            state.cloud.knownProjectIds = new Set(state.projects.map((project) => String(project.id)));
            state.cloud.knownElementIds = new Set(state.elements.map((element) => String(element.id)));
            await applyRemoteSnapshot(remote, { allowDirty: true, suppressCloudMark: true });
            if (notify) showToast('Серверные данные загружены; локальные правки в резервной очереди.');
            return true;
          }

          const changed = await applyRemoteSnapshot(remote, { allowDirty: true, suppressCloudMark: true });
          if (notify) showToast(changed ? 'Данные обновлены с сервера.' : 'На сервере нет изменений.');
          return changed;
        } finally {
          dom.serverRefresh.disabled = false;
          dom.serverRefresh.textContent = 'Обновить с сервера';
        }
      }

      async function archiveGuardedOutbox(record, reason = 'empty-local-remote-nonempty') {
        if (!validOutboxRecord(record) || state.cloud.outbox?.revision !== record.revision) return false;
        const archived = { ...record, blocked: true, blockedAt: Date.now(), reason };
        await enqueueCloudSync(() => writeCloudSyncBatch([['guardedOutbox', archived]], ['outbox']));
        saveLocalValue(CLOUD_GUARDED_OUTBOX_KEY, JSON.stringify({ version: 2, storage: 'indexedDB', key: 'guardedOutbox', revision: record.revision }));
        removeLocalValue(CLOUD_OUTBOX_KEY);
        state.cloud.outbox = null;
        state.cloud.dirty = state.cloud.outboxPending;
        state.cloud.outboxError = false;
        return true;
      }

      function applyCommittedAssetUrls(snapshot, replacements) {
        if (!isCloudSnapshot(snapshot)) return false;
        let changed = false;
        for (const replacement of replacements.elements) {
          const element = snapshot.elements.find((row) => String(row.id) === replacement.id);
          if (element?.image === replacement.source) {
            element.image = replacement.value;
            changed = true;
          }
        }
        const crop = replacements.lastCropSource;
        if (crop && snapshotSettingValue(snapshot, 'lastCropSource') === crop.source) {
          setSnapshotSettingValue(snapshot, 'lastCropSource', crop.value);
          changed = true;
        }
        return changed;
      }

      function prepareCommittedAssetUrlsForCatalog(replacements) {
        const elements = [];
        for (const replacement of replacements.elements) {
          const element = state.elements.find((row) => String(row.id) === replacement.id);
          if (element?.image === replacement.source) {
            elements.push({
              id: replacement.id,
              source: replacement.source,
              value: replacement.value,
              record: { ...cloneSnapshot(element), image: replacement.value }
            });
          }
        }
        const crop = replacements.lastCropSource;
        const lastCropSource = crop && state.settings.lastCropSource === crop.source
          ? { source: crop.source, value: crop.value }
          : null;
        return { elements, lastCropSource };
      }

      function applyPreparedAssetUrlsToCatalog(localChanges) {
        for (const change of localChanges.elements) {
          const element = state.elements.find((row) => String(row.id) === change.id);
          if (element?.image === change.source) {
            // The asset URL only starts working after the next Pages build; keep the frame visible.
            rememberLocalPreview(change.id, change.source);
            element.image = change.value;
          }
        }
        if (localChanges.lastCropSource && state.settings.lastCropSource === localChanges.lastCropSource.source) {
          state.settings.lastCropSource = localChanges.lastCropSource.value;
        }
      }

      function writeCloudFinalization(entries, deleteKeys, localChanges) {
        const storeNames = ['cloudSync'];
        if (localChanges.elements.length) storeNames.push('elements');
        if (localChanges.lastCropSource) storeNames.push('settings');
        return runTransaction(storeNames, 'readwrite', (transaction) => {
          const cloudSync = transaction.objectStore('cloudSync');
          for (const [key, value] of entries) cloudSync.put({ key, value, updatedAt: Date.now() });
          for (const key of deleteKeys) cloudSync.delete(key);
          if (localChanges.elements.length) {
            const elements = transaction.objectStore('elements');
            for (const change of localChanges.elements) elements.put(change.record);
          }
          if (localChanges.lastCropSource) {
            transaction.objectStore('settings').put({ key: 'lastCropSource', value: localChanges.lastCropSource.value });
          }
        });
      }

      async function finalizeCloudPut(sending, written) {
        if (state.cloud.outboxPending) {
          clearTimeout(state.cloud.outboxTimer);
          state.cloud.outboxTimer = null;
          state.cloud.outboxPending = false;
          persistCloudOutbox();
        }
        let pendingWrites;
        let pendingSync;
        do {
          pendingWrites = state.writeQueue;
          pendingSync = state.cloud.syncQueue;
          await Promise.all([pendingWrites, pendingSync]);
        } while (pendingWrites !== state.writeQueue || pendingSync !== state.cloud.syncQueue);

        const sha = written.dataBlobSha;
        const confirmedSnapshot = cloneSnapshot(written.snapshot);
        const localChanges = prepareCommittedAssetUrlsForCatalog(written.replacements);
        const baseRecord = baseRecordFrom(confirmedSnapshot, sha, '');
        const current = state.cloud.outbox;
        let nextOutbox = null;
        let mergeConflicts = [];
        if (current && current.revision !== sending.revision) {
          const currentSnapshot = cloneSnapshot(current.snapshot);
          const currentLocalSnapshot = isCloudSnapshot(current.localSnapshot)
            ? cloneSnapshot(current.localSnapshot)
            : cloneSnapshot(current.snapshot);
          applyCommittedAssetUrls(currentSnapshot, written.replacements);
          applyCommittedAssetUrls(currentLocalSnapshot, written.replacements);
          const rebased = mergeCloudSnapshots(sending.snapshot, confirmedSnapshot, currentSnapshot);
          if (rebased.ok) {
            nextOutbox = compactOutboxRecord({
              ...current,
              baseSha: sha,
              baseEtag: '',
              baseSnapshot: confirmedSnapshot,
              snapshot: rebased.snapshot,
              localSnapshot: currentLocalSnapshot,
              rebasedAt: Date.now()
            });
          } else {
            mergeConflicts = rebased.conflicts;
            nextOutbox = compactOutboxRecord({
              ...current,
              baseSha: sha,
              baseEtag: '',
              baseSnapshot: confirmedSnapshot,
              snapshot: currentSnapshot,
              localSnapshot: currentLocalSnapshot,
              localConflicts: [...(current.localConflicts || []), ...mergeConflicts]
            });
          }
          mergeConflicts = [...new Set([...(current.localConflicts || []), ...mergeConflicts])].sort();
        }

        const entries = [['base', baseRecord], ['cache', confirmedSnapshot]];
        const deleteKeys = [];
        if (!current || current.revision === sending.revision) deleteKeys.push('outbox');
        else entries.push(['outbox', nextOutbox]);

        state.cloud.applying = true;
        applyReadOnlyState();
        try {
          await enqueueCloudSync(() => writeCloudFinalization(entries, deleteKeys, localChanges));
        } finally {
          state.cloud.applying = false;
          applyReadOnlyState();
        }
        applyPreparedAssetUrlsToCatalog(localChanges);
        state.cloud.writeGeneration += 1;
        state.cloud.lastPushAt = Date.now();
        state.cloud.firstDirtyAt = 0;
        state.cloud.baseSha = sha;
        state.cloud.baseEtag = '';
        state.cloud.baseSnapshot = confirmedSnapshot;
        state.cloud.observedSha = sha;
        updateKnownRemoteIds(prepareImport(confirmedSnapshot));
        state.cloud.initialPullDone = true;
        state.cloud.pendingSnapshot = null;
        state.cloud.outbox = nextOutbox;
        state.cloud.dirty = Boolean(nextOutbox) || state.cloud.outboxPending;
        state.cloud.outboxError = false;

        if (state.cloud.outbox) saveOutboxMarker(state.cloud.outbox);
        else removeLocalValue(CLOUD_OUTBOX_KEY);
        if (localChanges.elements.length || localChanges.lastCropSource) renderFeed();
        return { ok: mergeConflicts.length === 0, conflicts: mergeConflicts };
      }

      async function saveCloud() {
        if (!state.cloud.dirty || state.cloud.saving || state.cloud.importing || state.cloud.outboxPending || state.cloud.outboxTimer) return;
        if (!state.cloud.token) {
          setCloudError('Только чтение: нет ключа');
          return;
        }
        await state.cloud.syncQueue;
        if (state.cloud.outboxPending || state.cloud.outboxTimer) return;
        let sending = state.cloud.outbox;
        if (!sending || state.cloud.outboxError) {
          setCloudError('Ошибка: локального хранилища');
          return;
        }
        if (sending.localConflicts?.length) {
          const hint = sending.localConflicts.slice(0, 2).join(', ');
          setCloudError(`Ошибка: конфликт полей${hint ? ` — ${hint}` : ''}`);
          return;
        }
        state.cloud.saving = true;
        state.cloud.error = '';
        const generation = state.cloud.generation;
        let status = '';
        let succeeded = false;
        let conflictDetails = [];
        let retryCount = 0;
        try {
          let remote = await getCloudSnapshot({ force: true, apply: false });
          if (generation !== state.cloud.generation || state.cloud.importing) {
            status = 'cancelled';
          } else if (sending.snapshot.projects.length === 0 && remote.incoming.projects.length > 0) {
            if (!await archiveGuardedOutbox(sending)) status = 'cancelled';
            else {
              await applyRemoteSnapshot(remote, { allowDirty: true, suppressCloudMark: true });
              status = 'guarded';
            }
          } else if (remote.sha !== asText(sending.baseSha).trim()) {
            const recovered = await recoverCommittedGitData(sending.snapshot, remote);
            if (recovered) {
              const finalized = await finalizeCloudPut(sending, recovered);
              succeeded = true;
              if (!finalized.ok) {
                conflictDetails = finalized.conflicts;
                status = 'post-put-conflict';
              }
            } else {
              const rebased = await rebaseOutboxRecord(sending, remote);
              if (rebased.stale) status = 'cancelled';
              else if (!rebased.ok) {
                conflictDetails = rebased.conflicts;
                status = 'merge-conflict';
              } else {
                sending = rebased.record;
              }
            }
          }

          while (!status && !succeeded) {
            if (generation !== state.cloud.generation || state.cloud.importing || state.cloud.outbox?.revision !== sending.revision) {
              status = 'cancelled';
              break;
            }
            if (sending.snapshot.projects.length === 0 && remote.incoming.projects.length > 0) {
              if (!await archiveGuardedOutbox(sending)) status = 'cancelled';
              else {
                await applyRemoteSnapshot(remote, { allowDirty: true, suppressCloudMark: true });
                status = 'guarded';
              }
              break;
            }
            if (!await persistConfirmedBackup(remote.raw, remote.sha)) {
              status = 'backup-error';
              break;
            }
            let written;
            try {
              written = await commitSnapshotWithGitData(
                sending.snapshot,
                sending.baseSha,
                () => generation !== state.cloud.generation || state.cloud.importing
              );
            } catch (error) {
              if (error.cloudCancelled) {
                status = 'cancelled';
                break;
              }
              if (!error.cloudRace) throw error;
              if (retryCount >= CLOUD_WRITE_RACE_RETRIES) {
                status = 'retry-conflict';
                break;
              }
              const fresh = await getCloudSnapshot({ force: true, apply: false });
              if (sending.snapshot.projects.length === 0 && fresh.incoming.projects.length > 0) {
                if (!await archiveGuardedOutbox(sending)) status = 'cancelled';
                else {
                  await applyRemoteSnapshot(fresh, { allowDirty: true, suppressCloudMark: true });
                  status = 'guarded';
                }
                break;
              }
              const rebased = await rebaseOutboxRecord(sending, fresh);
              if (rebased.stale) {
                status = 'cancelled';
                break;
              }
              if (!rebased.ok) {
                conflictDetails = rebased.conflicts;
                status = 'merge-conflict';
                break;
              }
              sending = rebased.record;
              remote = fresh;
              retryCount += 1;
              continue;
            }
            const finalized = await finalizeCloudPut(sending, written);
            succeeded = true;
            if (!finalized.ok) {
              conflictDetails = finalized.conflicts;
              status = 'post-put-conflict';
            }
            break;
          }
        } catch (error) {
          status = 'network';
        } finally {
          state.cloud.saving = false;
        }
        if (status === 'merge-conflict' || status === 'post-put-conflict') {
          const hint = conflictDetails.slice(0, 2).join(', ');
          setCloudError(`Ошибка: конфликт полей${hint ? ` — ${hint}` : ''}`);
        }
        else if (status === 'retry-conflict') setCloudError(`Ошибка: конфликт SHA после ${CLOUD_WRITE_RACE_RETRIES} повторов`);
        else if (status === 'backup-error') setCloudError('Ошибка: резервная копия не сохранена');
        else if (status === 'network') setCloudError('Ошибка: сети');
        else if (status === 'guarded') setSaveState('saved', 'Сохранено');
        else if (status === 'cancelled') {
          if (state.cloud.dirty && !state.cloud.importing) scheduleCloudSave();
          setSaveState(state.cloud.dirty ? 'saving' : 'saved', state.cloud.dirty ? 'Сохранение…' : 'Сохранено');
        }
        else if (!status && succeeded) {
          if (state.cloud.dirty) scheduleCloudSave();
          setSaveState('saved', 'Сохранено');
        }
      }

      async function pollCloud() {
        if (state.cloud.pollInFlight || state.cloud.pollPaused || state.cloud.importing) return;
        state.cloud.pollInFlight = true;
        try {
          await getCloudSnapshot();
          await applyPendingRemoteSnapshot();
          if (state.cloud.dirty && !state.cloud.saving) scheduleCloudSave();
        } catch (error) {
          if (!state.cloud.dirty && !state.cloud.saving) setCloudError('Ошибка: сети');
        } finally {
          state.cloud.pollInFlight = false;
        }
      }

      function startCloudPolling() {
        clearInterval(state.cloud.pollTimer);
        state.cloud.pollTimer = setInterval(pollCloud, CLOUD_POLL_INTERVAL);
      }

      async function initializeCloud() {
        let cloudLoaded = false;
        try {
          await getCloudSnapshot({ force: true, apply: true });
          cloudLoaded = true;
          if (state.cloud.dirty) scheduleCloudSave();
          if (!state.cloud.dirty) setSaveState('saved', 'Сохранено');
        } catch (error) {
          const cached = await getCloudSyncValue('cache').catch(() => null);
          if (!state.projects.length && isCloudSnapshot(cached)) {
            try {
              await applyRemoteSnapshot(prepareRemoteSnapshot(cached), { suppressCloudMark: true });
            } catch (cacheError) {
              // IndexedDB remains the safe offline cache when a cached cloud snapshot is invalid.
            }
          }
          setCloudError('Ошибка: сети');
        }
        startCloudPolling();
        applyReadOnlyState();
        if (state.cloud.dirty) scheduleCloudSave();
      }

      function presenceClientId() {
        try {
          const existing = sessionStorage.getItem(PRESENCE_CLIENT_KEY);
          if (existing) return existing;
          const clientId = makeId();
          sessionStorage.setItem(PRESENCE_CLIENT_KEY, clientId);
          return clientId;
        } catch (error) {
          return makeId();
        }
      }

      // Presence never writes to the repository: a commit per heartbeat exhausted the
      // GitHub Pages build budget (~10 builds/hour) and every deploy started to fail.
      function readPresencePeers() {
        try {
          const raw = JSON.parse(localValue(PRESENCE_LOCAL_KEY, '{}'));
          if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
          const peers = {};
          for (const [clientId, lastSeen] of Object.entries(raw)) {
            const timestamp = Number(lastSeen);
            if (clientId && Number.isFinite(timestamp) && timestamp > 0) peers[clientId] = timestamp;
          }
          return peers;
        } catch (error) {
          return {};
        }
      }

      function writePresencePeers(peers) {
        saveLocalValue(PRESENCE_LOCAL_KEY, JSON.stringify(peers));
      }

      function livePresencePeers(now = Date.now()) {
        for (const [clientId, lastSeen] of state.presence.peers) {
          if (now - lastSeen > PRESENCE_STALE_AFTER) state.presence.peers.delete(clientId);
        }
        return state.presence.peers;
      }

      function presenceCount(now = Date.now()) {
        const peers = livePresencePeers(now);
        const tabs = new Set([state.presence.clientId, ...peers.keys()]).size;
        const remote = now - state.presence.remoteActiveAt < PRESENCE_REMOTE_WINDOW ? 1 : 0;
        return { tabs, remote, total: tabs + remote };
      }

      function renderPresence() {
        const { tabs, remote, total } = presenceCount();
        state.presence.count = total;
        dom.onlinePresence.textContent = `${total} онлайн`;
        dom.onlinePresence.title = remote
          ? `Вкладок этого браузера: ${tabs}. Партнёр правил каталог менее ${Math.round(PRESENCE_REMOTE_WINDOW / 60000)} мин назад.`
          : `Вкладок этого браузера: ${tabs}. Правок с других машин недавно не было.`;
      }

      function markRemotePresence() {
        state.presence.remoteActiveAt = Date.now();
        renderPresence();
      }

      function heartbeatPresence() {
        const now = Date.now();
        const peers = readPresencePeers();
        for (const [clientId, lastSeen] of Object.entries(peers)) {
          if (clientId !== state.presence.clientId && now - lastSeen <= PRESENCE_STALE_AFTER) {
            state.presence.peers.set(clientId, lastSeen);
          }
        }
        peers[state.presence.clientId] = now;
        for (const [clientId, lastSeen] of Object.entries(peers)) {
          if (now - lastSeen > PRESENCE_STALE_AFTER) delete peers[clientId];
        }
        writePresencePeers(peers);
        try {
          state.presence.channel?.postMessage({ type: 'ping', clientId: state.presence.clientId, at: now });
        } catch (error) {
          // BroadcastChannel is optional; localStorage already carries the heartbeat.
        }
        renderPresence();
      }

      function initializePresence() {
        state.presence.clientId = presenceClientId();
        if (typeof BroadcastChannel === 'function') {
          try {
            state.presence.channel = new BroadcastChannel(PRESENCE_CHANNEL_NAME);
            state.presence.channel.addEventListener('message', (event) => {
              const message = event.data;
              if (!message || message.clientId === state.presence.clientId) return;
              if (message.type === 'leave') state.presence.peers.delete(message.clientId);
              else state.presence.peers.set(message.clientId, Date.now());
              renderPresence();
            });
          } catch (error) {
            state.presence.channel = null;
          }
        }
        globalThis.addEventListener('storage', (event) => {
          if (event.key === PRESENCE_LOCAL_KEY) {
            const now = Date.now();
            for (const [clientId, lastSeen] of Object.entries(readPresencePeers())) {
              if (clientId !== state.presence.clientId && now - lastSeen <= PRESENCE_STALE_AFTER) {
                state.presence.peers.set(clientId, lastSeen);
              }
            }
            renderPresence();
          }
        });
        globalThis.addEventListener('pagehide', () => {
          try {
            state.presence.channel?.postMessage({ type: 'leave', clientId: state.presence.clientId, at: Date.now() });
          } catch (error) {
            // Nothing to do while the tab is closing.
          }
          const peers = readPresencePeers();
          delete peers[state.presence.clientId];
          writePresencePeers(peers);
        });
        heartbeatPresence();
        clearInterval(state.presence.heartbeatTimer);
        state.presence.heartbeatTimer = setInterval(heartbeatPresence, PRESENCE_HEARTBEAT_INTERVAL);
      }

      function downloadText(filename, content, type = 'text/plain;charset=utf-8') {
        const blob = new Blob([content], { type });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }

      function exportJson() {
        downloadText('katalog-elementov.json', JSON.stringify(catalogSnapshot(), null, 2), 'application/json;charset=utf-8');
        showToast('JSON экспортирован.');
      }

      function importedSettings(rawSettings) {
        const result = { ...DEFAULT_SETTINGS };
        if (Array.isArray(rawSettings)) {
          for (const item of rawSettings) if (item && hasOwn(item, 'key')) result[item.key] = item.value;
        } else if (rawSettings && typeof rawSettings === 'object') {
          Object.assign(result, rawSettings);
        }
        if (state.settings.backupDirectoryHandle) result.backupDirectoryHandle = state.settings.backupDirectoryHandle;
        if (state.settings.backupLastWrittenAt) result.backupLastWrittenAt = state.settings.backupLastWrittenAt;
        return result;
      }

      function prepareImport(raw) {
        if (!raw || typeof raw !== 'object') throw new Error('Файл импорта не является каталогом.');
        const rawProjects = Array.isArray(raw.projects) ? raw.projects : (Array.isArray(raw.videos) ? raw.videos : null);
        const rawElements = Array.isArray(raw.elements) ? raw.elements : [];
        if (!rawProjects) throw new Error('В импорте отсутствуют ролики.');
        const projects = rawProjects.map((project) => normalizeProject(project));
        const ids = new Set();
        for (const project of projects) {
          const key = String(project.id);
          if (ids.has(key)) throw new Error('В импорте повторяется id ролика.');
          ids.add(key);
        }
        const elements = rawElements.map((element) => normalizeElement(element));
        const elementIds = new Set();
        for (const element of elements) {
          const key = String(element.id);
          if (elementIds.has(key)) throw new Error('В импорте повторяется id элемента.');
          if (!ids.has(String(element.projectId))) throw new Error('Элемент ссылается на отсутствующий ролик.');
          elementIds.add(key);
        }
        const categories = categoryRecords(elements, Array.isArray(raw.categories) ? raw.categories : []);
        const byKey = new Map(categories.map((category) => [category.key, category.name]));
        for (const element of elements) element.category = byKey.get(categoryKey(element.category)) || '';
        return { projects, elements, categories, settings: importedSettings(raw.settings) };
      }

      async function importCatalog(raw) {
        const incoming = prepareImport(raw);
        state.cloud.importing = true;
        state.cloud.pollPaused = true;
        state.cloud.generation += 1;
        clearTimeout(state.cloud.saveTimer);
        state.cloud.saveTimer = null;
        clearTimeout(state.cloud.outboxTimer);
        state.cloud.outboxTimer = null;
        state.cloud.outboxPending = false;
        state.cloud.pendingSnapshot = null;
        applyReadOnlyState();
        cancelAllScheduledCommits();
        stopAllProjectMetadata();
        clearTimeout(state.backupTimer);
        state.backupTimer = null;
        state.backupGeneration += 1;
        state.backupDirty = false;
        try {
          await state.writeQueue;
          await state.cloud.syncQueue;
          await commit(() => runTransaction(['projects', 'elements', 'categories', 'settings'], 'readwrite', (transaction) => {
            // Import is an explicit user replacement; cloud synchronization never clears stores.
            const projects = transaction.objectStore('projects');
            const elements = transaction.objectStore('elements');
            const categories = transaction.objectStore('categories');
            const settings = transaction.objectStore('settings');
            projects.clear();
            elements.clear();
            categories.clear();
            settings.clear();
            for (const project of incoming.projects) projects.put(project);
            for (const element of incoming.elements) elements.put(element);
            for (const category of incoming.categories) categories.put(category);
            for (const [key, value] of Object.entries(incoming.settings)) settings.put({ key, value });
          }));
          state.projects = incoming.projects;
          state.elements = incoming.elements;
          state.categories = incoming.categories;
          state.settings = incoming.settings;
          state.activeProjectId = state.settings.activeProjectId && findProject(state.settings.activeProjectId)
            ? state.settings.activeProjectId : state.projects[0]?.id || null;
          state.editingElementId = null;
          state.videoComposer = null;
          state.newElementId = null;
          markCloudDirty({ allowDuringImport: true });
          await state.cloud.syncQueue;
          if (state.cloud.outboxError) throw new Error('Импорт сохранён локально, но облачный outbox недоступен.');
          applyTheme();
          renderFeed();
          showToast('Импорт завершён.');
        } finally {
          state.cloud.importing = false;
          state.cloud.pollPaused = false;
          applyReadOnlyState();
          if (state.cloud.dirty) scheduleCloudSave();
        }
      }

      function markdownValue(value) {
        return asText(value).replace(/\r?\n/g, '\n  ');
      }

      function exportElementRows() {
        return chronologicalElements().flatMap((element, index) => {
          const project = findProject(element.projectId);
          return project ? [{
            project,
            element,
            globalNumber: index + 1,
            localNumber: elementNumber(element),
            anchor: elementAnchor(project, element)
          }] : [];
        });
      }

      function safeFilePart(value, fallback = 'element', maxLength = 72) {
        let part = asText(value).normalize('NFKC').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '-').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^[.\s-]+|[.\s-]+$/g, '');
        if (!part) part = fallback;
        if (/^(con|prn|aux|nul|com[1-9]|lpt[1-9])$/i.test(part)) part = `_${part}`;
        return [...part].slice(0, maxLength).join('') || fallback;
      }

      function timecodeFilePart(element) {
        const timecode = timecodesFrom(element)[0];
        return timecode ? safeFilePart(timecode.replace(/:/g, '-'), 'NO-TC', 24) : 'NO-TC';
      }

      function claudeImageName(row) {
        return `${String(row.globalNumber).padStart(3, '0')}_${timecodeFilePart(row.element)}_${safeFilePart(elementName(row.element), 'element')}.jpg`;
      }

      function claudeMarkdown(imageReferences = new Map()) {
        const lines = ['# Каталог монтажных элементов', ''];
        for (const project of state.projects) {
          const progress = projectProgress(project);
          lines.push(`## ${markdownValue(project.title || 'Без названия')}`);
          lines.push(`- Project ID: ${markdownValue(project.id)}`);
          lines.push(`- Anchor: ${projectSlug(project)}`);
          lines.push(`- URL: ${markdownValue(project.url) || '—'}`);
          lines.push(`- Channel: ${markdownValue(project.channel) || '—'}`);
          lines.push(`- Niche: ${markdownValue(project.niche) || '—'}`);
          lines.push(`- Duration: ${markdownValue(project.duration) || '—'}`);
          lines.push(`- Progress: ${progress}%`);
          lines.push(`- Progress mode: ${project.progressOverride === null ? 'Auto' : 'Manual override'}`);
          lines.push(`- Completed: ${project.completed ? 'true' : 'false'}`);
          lines.push(`- Host: ${markdownValue(project.host) || '—'}`);
          lines.push(`- Title source: ${markdownValue(project.titleSource) || '—'}`);
          lines.push(`- Channel source: ${markdownValue(project.channelSource) || '—'}`);
          lines.push(`- Created: ${markdownValue(project.createdAt) || '—'}`);
          lines.push(`- Updated: ${markdownValue(project.updatedAt) || '—'}`);
          lines.push('');
          for (const row of exportElementRows().filter((item) => String(item.project.id) === String(project.id))) {
            const { element } = row;
            const image = imageReferences.get(String(element.id)) || '—';
            lines.push(`### ${String(row.globalNumber).padStart(3, '0')} · #${String(row.localNumber).padStart(2, '0')} · ${markdownValue(elementName(element))}`);
            lines.push(`- Anchor: ${row.anchor}`);
            lines.push(`- ID: ${markdownValue(element.id)}`);
            lines.push(`- Project ID: ${markdownValue(element.projectId)}`);
            lines.push(`- Image: ${image}`);
            lines.push(`- Name: ${markdownValue(element.name) || '—'}`);
            lines.push(`- Description: ${markdownValue(element.description) || '—'}`);
            lines.push(`- Opinion: ${markdownValue(element.opinion) || '—'}`);
            lines.push(`- Application: ${markdownValue(element.application) || '—'}`);
            lines.push(`- Technique: ${markdownValue(element.technique) || '—'}`);
            lines.push(`- Category: ${markdownValue(element.category) || '—'}`);
            lines.push(`- Timecode: ${timecodesFrom(element)[0] || '—'}`);
            lines.push(`- Repeat count: ${element.repeatCount}`);
            lines.push(`- Created: ${markdownValue(element.createdAt) || '—'}`);
            lines.push(`- Updated: ${markdownValue(element.updatedAt) || '—'}`);
            lines.push('');
          }
        }
        return lines.join('\n');
      }

      async function blobFromDataUrl(dataUrl) {
        const match = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(dataUrl);
        if (!match) throw new Error('Неверный формат изображения.');
        const mime = match[1] || 'application/octet-stream';
        const body = match[3];
        if (match[2]) {
