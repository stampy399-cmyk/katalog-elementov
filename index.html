          ${isExpanded ? editor : `<div class="element-compact">${familyMeta(element)}${element.category ? `<span class="element-category-chip"><span class="category-icon">${categoryIcon(element.category)}</span>${escapeHtml(element.category)}</span>` : ''}<div class="element-description-preview ${preview ? '' : 'is-empty'}">${preview ? linkifyReferences(preview, total) : 'Что это и как работает'}</div>${extras.length ? `<div class="element-extra-preview">${extras.join(' · ')}</div>` : ''}${backlinkNumbers.length ? `<div class="element-backlinks">упоминается в: ${backlinkNumbers.map((from) => `<button class="ref-link" type="button" data-ref-number="${from}" title="Перейти к элементу #${String(from).padStart(2, '0')}">#${String(from).padStart(2, '0')}</button>`).join(' ')}</div>` : ''}</div>`}
          <button class="repeat-badge" type="button" data-heat="${repeatHeatLevel(weight)}" data-repeat-count="${element.repeatCount}" style="--heat:${(repeatHeatLevel(weight) / 6).toFixed(3)}" title="Клик: +1, Alt+клик: −1. Вес повторяемости ${weight} (×${element.repeatCount}${backlinkNumbers.length ? ` и ${backlinkNumbers.length} ссылок #NN` : ''})." aria-label="Повторы ${element.repeatCount}">×${element.repeatCount}</button>
          <div class="element-top-actions" aria-label="Действия элемента">${isExpanded ? '<button class="element-top-action element-collapse" type="button" data-collapse-element title="Свернуть" aria-label="Свернуть">−</button>' : ''}<button class="element-top-action delete" type="button" data-delete-element title="Удалить" aria-label="Удалить"><svg class="action-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 4.5h9M6 4.5V3h4v1.5M5 6.5l.5 6h5l.5-6"></path></svg></button></div>
          <div class="card-actions" aria-label="Действия элемента"><button class="card-action" type="button" data-copy-element title="Копировать" aria-label="Копировать"><svg class="action-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.25" y="5.25" width="8" height="8" rx="1.5"></rect><path d="M10.75 5.25V3.5A1.5 1.5 0 0 0 9.25 2h-5.5A1.75 1.75 0 0 0 2 3.75v5.5a1.5 1.5 0 0 0 1.5 1.5h1.75"></path></svg></button></div>
        </article>`;
      }

      function videoComposer() {
        const draft = state.videoComposer?.draft || {};
        return `<section class="video-composer" data-video-composer><h1 class="composer-title">Новый ролик</h1><div class="composer-grid">
          ${composerInput(draft, 'url', 'URL', 'Адрес ролика')}${composerInput(draft, 'title', 'Название', 'Название ролика')}${composerInput(draft, 'channel', 'Канал', 'Канал')}${composerInput(draft, 'niche', 'Ниша', 'Ниша')}${composerInput(draft, 'duration', 'Длительность', '19:21')}${composerInput(draft, 'host', 'Кто ведёт', 'Имя, опционально')}
        </div><p class="composer-note">Enter — создать ролик</p></section>`;
      }

      function composerInput(draft, field, label, placeholder) {
        return `<div class="field"><label>${label}</label><input data-video-field="${field}" value="${escapeAttribute(draft[field] || '')}" placeholder="${escapeAttribute(placeholder)}" autocomplete="off"></div>`;
      }

      // The sidebar is patched in place: rebuilding its markup on every sync made the
      // progress row visibly jump while the user was working.
      function patchVideoRow(row, project) {
        const active = String(state.activeProjectId) === String(project.id);
        const untitled = !asText(project.title).trim() || project.title === 'Без названия';
        const progress = projectProgress(project);
        const elements = elementsForProject(project.id);
        row.classList.toggle('is-active', active);
        row.classList.toggle('is-untitled', untitled);
        row.classList.toggle('is-complete', progress >= 100);
        const currentProgress = row.style.getPropertyValue('--progress');
        if (currentProgress !== `${progress}%`) row.style.setProperty('--progress', `${progress}%`);
        const setText = (selector, text) => {
          const node = row.querySelector(selector);
          if (node && node.textContent !== text) node.textContent = text;
        };
        setText('.video-row-title', project.title || 'Без названия');
        setText('.video-row-channel', project.channel || project.niche || 'Канал не указан');
        setText('.row-number', `${progress}%`);
        setText('.row-count', `${elements.length} эл.`);
        const select = row.querySelector('.video-row-select');
        if (select) select.setAttribute('aria-current', active ? 'page' : 'false');
      }

      function renderSidebar() {
        const query = state.search.trim();
        const visible = state.projects.filter((project) => matchesProject(project, query, state.categoryFilter));
        const rows = [...dom.videoList.querySelectorAll('.video-row')];
        const sameOrder = rows.length === visible.length
          && rows.every((row, index) => row.dataset.selectProject === String(visible[index].id));
        if (sameOrder && visible.length) {
          rows.forEach((row, index) => patchVideoRow(row, visible[index]));
        } else {
          dom.videoList.innerHTML = visible.map(videoRow).join('') || '<div class="empty-state">Ничего не найдено</div>';
        }
        const counter = `${visible.length}/${state.projects.length}`;
        if (dom.videoListCount.textContent !== counter) dom.videoListCount.textContent = counter;
      }

      function comparisonLevelPercent(value) {
        if (value === '1:1') return 100;
        const match = String(value || '').match(/(\d{1,3})\s*%/);
        return match ? clamp(Number(match[1]), 0, 100) : 0;
      }

      function techFieldMarkup(label, value, code = false) {
        const text = asText(value).trim() || 'TODO: инвентарь';
        const todo = text.startsWith('TODO:') ? ' is-todo' : '';
        const content = code ? `<code>${escapeHtml(text)}</code>` : escapeHtml(text);
        return `<div class="tech-field${todo}"><dt>${escapeHtml(label)}</dt><dd>${content}</dd></div>`;
      }

      function techPassportMarkup(family) {
        const record = state.oursTech?.[family] || {};
        const available = record.status === 'умеем';
        const status = available ? 'УМЕЕМ' : record.status === 'не умеем' ? 'НЕ УМЕЕМ' : 'TODO: СТАТУС';
        return `<details class="tech-passport"><summary><span>Как воспроизвести</span><span class="tech-status${available ? '' : ' is-unavailable'}">${status}</span></summary><dl class="tech-passport-body">
          ${techFieldMarkup('tech_path', record.tech_path, true)}
          ${techFieldMarkup('tool', record.tool)}
          ${techFieldMarkup('how_to', record.how_to, true)}
          ${techFieldMarkup('sample', record.sample, true)}
        </dl></details>`;
      }

      function comparisonMediaMarkup(entry) {
        if (!entry.our_media) return '<div class="comparison-media-placeholder">Нашего образца пока нет</div>';
        const media = escapeAttribute(entry.our_media);
        const poster = entry.our_poster ? ` poster="${escapeAttribute(entry.our_poster)}"` : '';
        const label = `Наш образец ${entry.family}`;
        if (/\.mp4(?:[?#]|$)/i.test(entry.our_media)) {
          return `<video controls preload="none"${poster} data-comparison-video="${media}" data-lightbox-media data-lightbox-type="video" data-lightbox-label="${escapeAttribute(label)}" aria-label="${escapeAttribute(label)}"></video>`;
        }
        return `<img src="${media}" alt="${escapeAttribute(label)}" data-lightbox-media data-lightbox-type="image" data-lightbox-label="${escapeAttribute(label)}" loading="lazy">`;
      }

      function comparisonCard(entry) {
        const references = Array.isArray(entry.competitor_refs) ? entry.competitor_refs.filter(Boolean).slice(0, 3) : [];
        const competitors = references.length
          ? references.map((source, index) => `<figure class="competitor-card"><img src="${escapeAttribute(source)}" alt="Референс конкурента ${escapeAttribute(entry.family)} ${index + 1}" data-lightbox-media data-lightbox-type="image" data-lightbox-label="Референс конкурента ${escapeAttribute(entry.family)} ${index + 1}" loading="lazy"><span>Референс ${index + 1}</span></figure>`).join('')
          : '<div class="comparison-media-placeholder">Референсов нет</div>';
        const pairButton = entry.our_media && references.length
          ? `<button class="comparison-pair-button" type="button" data-lightbox-pair="${escapeAttribute(entry.family)}">Сравнить бок о бок</button>`
          : '';
        return `<article class="comparison-card" data-comparison-family="${escapeAttribute(entry.family)}">
          <header class="comparison-card-header"><h2 class="comparison-family">${escapeHtml(entry.family)}</h2><span class="comparison-level">${escapeHtml(entry.level || 'нет')}</span><div class="comparison-level-bar" style="--level:${comparisonLevelPercent(entry.level)}%"><span></span></div></header>
          <div class="comparison-columns"><section class="comparison-side"><h3>Наш образец</h3><div class="comparison-media">${comparisonMediaMarkup(entry)}</div>${pairButton}${techPassportMarkup(entry.family)}</section><section class="comparison-side"><h3>Конкурент</h3><div class="competitor-grid">${competitors}</div></section></div>
          <p class="comparison-notes">${escapeHtml(entry.notes || 'Комментарий не добавлен.')}</p>
        </article>`;
      }

      function lightboxMediaMarkup(source, type, label, poster = '') {
        const src = escapeAttribute(source);
        const title = escapeAttribute(label);
        if (type === 'video') {
          const posterAttribute = poster ? ` poster="${escapeAttribute(poster)}"` : '';
          return `<video class="lightbox-media" src="${src}"${posterAttribute} controls autoplay aria-label="${title}"></video>`;
        }
        return `<img class="lightbox-media" src="${src}" alt="${title}">`;
      }

      function renderLightbox() {
        const current = state.lightbox;
        if (!current) return;
        const pair = current.mode === 'pair';
        if (pair) {
          const references = current.entry.competitor_refs.filter(Boolean).slice(0, 3);
          current.index = (current.index + references.length) % references.length;
          const ourType = /\.mp4(?:[?#]|$)/i.test(current.entry.our_media) ? 'video' : 'image';
          dom.lightboxContent.innerHTML = `<div class="lightbox-pair"><section class="lightbox-pane"><div class="lightbox-label">Наш образец · ${escapeHtml(current.entry.family)}</div><div class="lightbox-pane-media" data-lightbox-backdrop>${lightboxMediaMarkup(current.entry.our_media, ourType, `Наш образец ${current.entry.family}`, current.entry.our_poster)}</div></section><section class="lightbox-pane"><div class="lightbox-label">Референс конкурента ${current.index + 1}</div><div class="lightbox-pane-media" data-lightbox-backdrop>${lightboxMediaMarkup(references[current.index], 'image', `Референс конкурента ${current.entry.family} ${current.index + 1}`)}</div></section></div>`;
          dom.lightboxCounter.textContent = `${current.index + 1} / ${references.length}`;
        } else {
          dom.lightboxContent.innerHTML = lightboxMediaMarkup(current.source, current.type, current.label, current.poster);
          dom.lightboxCounter.textContent = '';
        }
        for (const button of dom.lightbox.querySelectorAll('[data-lightbox-prev], [data-lightbox-next]')) button.hidden = !pair;
      }

      function showLightbox(next) {
        state.lightbox = { ...next, lastFocus: document.activeElement };
        renderLightbox();
        dom.lightbox.classList.add('is-open');
        dom.lightbox.setAttribute('aria-hidden', 'false');
        document.body.classList.add('has-lightbox');
        dom.lightbox.querySelector('[data-lightbox-close]')?.focus();
      }

      function closeLightbox() {
        const lastFocus = state.lightbox?.lastFocus;
        for (const video of dom.lightbox.querySelectorAll('video')) video.pause();
        state.lightbox = null;
        dom.lightbox.classList.remove('is-open');
        dom.lightbox.setAttribute('aria-hidden', 'true');
        dom.lightboxContent.innerHTML = '';
        dom.lightboxCounter.textContent = '';
        document.body.classList.remove('has-lightbox');
        lastFocus?.focus?.();
      }

      function moveLightbox(direction) {
        if (state.lightbox?.mode !== 'pair') return;
        state.lightbox.index += direction;
        renderLightbox();
      }

      function openPairLightbox(family) {
        const entry = globalThis.SRAVNENIE?.families?.find((candidate) => candidate.family === family);
        if (!entry?.our_media || !entry.competitor_refs?.filter(Boolean).length) return;
        showLightbox({ mode: 'pair', entry, index: 0 });
      }

      function openMediaLightbox(media) {
        const source = media.dataset.comparisonVideo || media.currentSrc || media.src;
        if (!source) return;
        showLightbox({
          mode: 'single',
          source,
          type: media.dataset.lightboxType || (media.tagName === 'VIDEO' ? 'video' : 'image'),
          label: media.dataset.lightboxLabel || media.alt || media.getAttribute('aria-label') || 'Медиа',
          poster: media.poster || media.getAttribute('poster') || ''
        });
      }

      async function loadOursTech() {
        try {
          const response = await fetch(OURS_TECH_URL, { headers: { Accept: 'application/json' }, cache: 'no-store' });
          if (!response.ok) throw new Error(`ours_tech.json GET: ${response.status}`);
          const data = await response.json();
          state.oursTech = data && typeof data === 'object' && !Array.isArray(data) ? data : {};
        } catch (error) {
          state.oursTech = {};
        }
      }

      function renderComparison() {
        dom.playerDock.hidden = true;
        const source = Array.isArray(globalThis.SRAVNENIE?.families) ? globalThis.SRAVNENIE.families : [];
        const query = state.search.trim().toLocaleLowerCase();
        const shown = source.filter((entry) => {
          if (state.familyFilter !== 'all' && entry.family !== state.familyFilter) return false;
          if (!query) return true;
          return [entry.family, entry.level, entry.notes].map(asText).join(' ').toLocaleLowerCase().includes(query);
        });
        const cards = shown.map(comparisonCard).join('');
        dom.workspaceInner.innerHTML = `<section class="comparison-page"><header class="comparison-intro"><div><h1>Сравнение: мы vs конкурент</h1><p>18 семейств: слева наш воспроизводимый образец, справа репрезентативные карточки каталога конкурента.</p></div><span class="comparison-count">${shown.length}/${source.length} семейств</span></header>${cards || '<div class="family-empty">По выбранному фильтру сравнений нет</div>'}</section>`;
      }

      function renderWorkspace() {
        if (state.view === 'comparison') {
          renderComparison();
          return;
        }
        const project = findProject(state.activeProjectId);
        if (state.videoComposer) {
          dom.workspaceInner.innerHTML = videoComposer();
        } else if (!project) {
          dom.workspaceInner.innerHTML = '<div class="workspace-empty"><div><strong>Пока здесь пусто</strong>Добавьте ролик, затем вставляйте скрины через Cmd+V.</div></div>';
        } else {
          const query = state.search.trim();
          const shown = elementsForProject(project.id).filter((element) => matchesElement(project, element, query, state.categoryFilter) && tierMatches(element) && familyMatches(element));
          const editing = shown.filter((element) => String(element.id) === String(state.editingElementId));
          const collapsed = shown.filter((element) => String(element.id) !== String(state.editingElementId));
          const familySections = FAMILY_ORDER.map((family) => {
            const elements = collapsed.filter((element) => familyOf(element) === family);
            if (!elements.length) return '';
            const example = elements[0];
            const tier = example.tier === 'base' ? 'base' : 'unique';
            return `<section class="family-section" data-family="${escapeAttribute(family)}"><header class="family-heading"><h2>${escapeHtml(family)}</h2><span class="family-heading-meta">${elements.length} в ролике · ${example.freq_videos}/${state.projects.length} видео · ${example.freq_total} всего · ${tierLabel(tier)}</span></header><div class="element-grid" aria-label="${escapeAttribute(family)}">${elements.map((element) => elementCard(project, element)).join('')}</div></section>`;
          }).join('');
          const editingMarkup = editing.length ? `<section class="editing-element" aria-label="Редактируемый элемент">${editing.map((element) => elementCard(project, element)).join('')}</section>` : '';
          const emptyMarkup = !familySections && !editingMarkup ? '<div class="family-empty">По выбранному фильтру элементов нет</div>' : '';
          dom.workspaceInner.innerHTML = `${projectHeader(project)}${editingMarkup}<div id="elementGrid" aria-label="Кадры элементов">${familySections}${emptyMarkup}<button class="grid-add" type="button" data-add-element="${escapeAttribute(project.id)}">+ элемент</button></div>`;
        }
        renderPlayerDock();
        requestAnimationFrame(() => resizeDescriptions());
        if (state.videoComposer) requestAnimationFrame(() => dom.workspaceInner.querySelector('[data-video-field="url"]')?.focus());
        if (state.newElementId) {
          const id = state.newElementId;
          requestAnimationFrame(() => {
            const card = [...dom.workspaceInner.querySelectorAll('[data-element-id]')].find((node) => node.dataset.elementId === String(id));
            card?.querySelector('[data-element-field="description"]')?.focus();
            state.newElementId = null;
          });
        }
      }

      function renderFeed() {
        if (!findProject(state.activeProjectId)) state.activeProjectId = state.projects[0]?.id || null;
        renderTierFilter();
        renderFamilyFilter();
        renderViewSwitch();
        renderCategoryFilter();
        renderSidebar();
        renderWorkspace();
        if (state.statsOpen) renderStats();
      }

      function renderTierFilter() {
        for (const button of dom.tierFilter.querySelectorAll('[data-tier-filter]')) {
          const active = button.dataset.tierFilter === state.tierFilter;
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-pressed', String(active));
        }
      }

      function renderFamilyFilter() {
        const options = ['<option value="all">Все семейства</option>', ...FAMILY_ORDER.map((family) => `<option value="${escapeAttribute(family)}">${escapeHtml(family)}</option>`)].join('');
        if (dom.familyFilter.innerHTML !== options) dom.familyFilter.innerHTML = options;
        dom.familyFilter.value = FAMILY_ORDER.includes(state.familyFilter) ? state.familyFilter : 'all';
      }

      function renderViewSwitch() {
        dom.catalogToolbar.dataset.view = state.view;
        for (const button of dom.viewSwitch.querySelectorAll('[data-view]')) {
          const active = button.dataset.view === state.view;
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-pressed', String(active));
        }
      }

      function setView(view, updateHash = true) {
        if (!['catalog', 'comparison'].includes(view)) return;
        if (state.lightbox) closeLightbox();
        state.view = view;
        state.editingElementId = null;
        if (updateHash) {
          const target = view === 'comparison' ? '#comparison' : `${globalThis.location?.pathname || 'index.html'}${globalThis.location?.search || ''}`;
          try {
            if (globalThis.history?.replaceState) globalThis.history.replaceState(null, '', target);
            else globalThis.location.hash = view === 'comparison' ? 'comparison' : '';
          } catch (error) {
            globalThis.location.hash = view === 'comparison' ? 'comparison' : '';
          }
        }
        renderFeed();
      }

      function categoryByKey(key) {
        return state.categories.find((category) => category.key === key) || null;
      }

      function renderCategoryFilter() {
        const category = categoryByKey(state.categoryFilter);
        if (!category) {
          state.categoryFilter = '';
          dom.categoryFilter.hidden = true;
          dom.categoryFilter.textContent = '';
          return;
        }
        dom.categoryFilter.hidden = false;
        dom.categoryFilter.textContent = `Категория: ${category.name} ×`;
      }

      function setCategoryFilter(value) {
        const key = categoryKey(value);
        state.categoryFilter = state.categoryFilter === key ? '' : key;
        renderFeed();
      }

      function showCategoryMenu(input) {
        const combo = input.closest('.category-combo');
        const menu = combo?.querySelector('.category-menu');
        if (!combo || !menu) return;
        const value = categoryName(input.value);
        const query = categoryKey(value);
        const matches = state.categories.filter((category) => !query || category.key.includes(query));
        const exact = state.categories.some((category) => category.key === query);
        const card = input.closest('[data-element-id]');
        const selectedKey = categoryKey(card ? findElement(card.dataset.elementId)?.category : '');
        const options = matches.map((category) => `<button class="category-option ${category.key === selectedKey ? 'is-selected' : ''}" type="button" role="option" aria-selected="${category.key === selectedKey}" data-category-choice="${escapeAttribute(category.name)}"><span><span class="category-icon">${categoryIcon(category.name)}</span>${escapeHtml(category.name)}</span>${category.key === selectedKey ? '<span class="option-check" aria-hidden="true">✓</span>' : ''}</button>`);
        if (value && !exact) options.push(`<button class="category-option is-create" type="button" role="option" data-category-choice="${escapeAttribute(value)}"><span><span class="category-icon">${categoryIcon(value)}</span>Создать: «${escapeHtml(value)}»</span></button>`);
        menu.innerHTML = options.join('') || '<div class="category-option" aria-disabled="true">Нет категорий</div>';
        combo.classList.add('is-open');
        card?.classList.add('has-open-category');
        input.setAttribute('aria-expanded', 'true');
      }

      function hideCategoryMenu(input) {
        const combo = input.closest('.category-combo');
        if (!combo) return;
        combo.classList.remove('is-open');
        combo.closest('.element-card')?.classList.remove('has-open-category');
        input.setAttribute('aria-expanded', 'false');
      }

      function selectCategory(element, value) {
        const key = categoryKey(value);
        const category = categoryByKey(key);
        element.category = category?.name || categoryName(value);
        saveElement(element);
        const card = [...dom.workspaceInner.querySelectorAll('[data-element-id]')].find((node) => node.dataset.elementId === String(element.id));
        const input = card?.querySelector('[data-category-input]');
        if (input) {
          input.value = element.category;
          hideCategoryMenu(input);
        }
        const check = card?.querySelector('.category-check');
        if (check) check.classList.toggle('is-visible', Boolean(element.category));
        updateProjectCounts(element.projectId);
        scheduleStatsUpdate();
      }

      function resizeDescription(textarea) {
        if (!textarea) return;
        textarea.style.height = 'auto';
        textarea.style.height = `${Math.max(104, textarea.scrollHeight)}px`;
      }

      function resizeDescriptions(root = dom.workspaceInner) {
        for (const textarea of root.querySelectorAll('.element-description')) resizeDescription(textarea);
      }

      function updateProjectVisual(project) {
        const progress = projectProgress(project);
        project.progress = progress;
        for (const node of dom.appShell.querySelectorAll(`[data-project-id="${CSS.escape(String(project.id))}"]`)) {
          node.style.setProperty('--progress', `${progress}%`);
          const title = node.querySelector('.workspace-title');
          if (title) title.textContent = project.title || 'Без названия';
          const meta = node.querySelector('.workspace-meta');
          if (meta) meta.textContent = `${projectMeta(project)}${project.duration ? ` · ${project.duration}` : ''}`;
          const percent = node.querySelector('.project-percent');
          if (percent) percent.textContent = `${progress}%`;
          const range = node.querySelector('[data-project-field="progress"]');
          if (range && document.activeElement !== range) range.value = String(progress);
          const rangeValue = node.querySelector('.range-value');
          if (rangeValue) rangeValue.textContent = `${progress}%`;
          const completion = node.querySelector('[data-project-complete]');
          if (completion) completion.checked = Boolean(project.completed);
          const auto = node.querySelector('[data-project-auto]');
          if (auto) auto.disabled = project.progressOverride === null && !project.completed;
          for (const field of ['url', 'title', 'channel', 'niche', 'duration', 'host']) {
            const input = node.querySelector(`[data-project-field="${field}"]`);
            if (input && document.activeElement !== input) input.value = asText(project[field]);
          }
        }
        scheduleSidebarRefresh();
        if (state.videoComposer?.projectId && String(state.videoComposer.projectId) === String(project.id)) {
          for (const field of ['url', 'title', 'channel', 'niche', 'duration', 'host']) {
            const input = dom.workspaceInner.querySelector(`[data-video-field="${field}"]`);
            if (input && document.activeElement !== input) input.value = asText(project[field]);
          }
        }
      }

      function updateProjectCounts(projectId) {
        const projectElements = elementsForProject(projectId);
        const project = findProject(projectId);
        if (project) updateProjectVisual(project);
        const header = dom.workspaceInner.querySelector(`[data-project-id="${CSS.escape(String(projectId))}"] .workspace-count`);
        if (header) header.textContent = `${projectElements.length} элементов · ${totalRepeats(projectElements)} повторов`;
      }

      function scheduleSidebarRefresh() {
        clearTimeout(state.sidebarRefreshTimer);
        state.sidebarRefreshTimer = setTimeout(renderSidebar, 350);
      }

      function openVideoComposer() {
        if (!state.videoComposer) {
          state.videoComposer = { draft: { url: '', title: '', channel: '', niche: '', duration: '', host: '' }, projectId: null };
          renderFeed();
        } else {
          dom.workspaceInner.querySelector('[data-video-field="url"]')?.focus();
        }
      }

      function revisionsForProject(projectId) {
        const key = String(projectId);
        let revisions = state.fieldRevisions.get(key);
        if (!revisions) {
          revisions = { title: 0, channel: 0 };
          state.fieldRevisions.set(key, revisions);
        }
        return revisions;
      }

      function markProjectFieldManual(project, field) {
        if (field !== 'title' && field !== 'channel') return;
        project[`${field}Source`] = 'manual';
        revisionsForProject(project.id)[field] += 1;
      }

      function stopProjectMetadata(projectId) {
        const key = String(projectId);
        const timer = state.metadataTimers.get(key);
        if (timer !== undefined) clearTimeout(timer);
        state.metadataTimers.delete(key);
        const request = state.metadataRequests.get(key);
        request?.controller?.abort();
        state.metadataRequests.delete(key);
      }

      function stopAllProjectMetadata() {
        for (const projectId of new Set([
          ...state.metadataTimers.keys(),
          ...state.metadataRequests.keys()
        ])) stopProjectMetadata(projectId);
      }

      function scheduleProjectMetadata(project) {
        const url = asText(project.url).trim();
        stopProjectMetadata(project.id);
        if (!url || typeof fetch !== 'function') return;
        const key = String(project.id);
        const request = {
          url,
          titleRevision: revisionsForProject(project.id).title,
          channelRevision: revisionsForProject(project.id).channel,
          titleSource: project.titleSource,
          channelSource: project.channelSource,
          controller: typeof AbortController === 'function' ? new AbortController() : null
        };
        state.metadataRequests.set(key, request);
        const timer = setTimeout(() => {
          state.metadataTimers.delete(key);
          fetchProjectMetadata(project.id, request);
        }, SAVE_DELAY);
        state.metadataTimers.set(key, timer);
      }

      async function fetchProjectMetadata(projectId, request) {
        const key = String(projectId);
        try {
          const response = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(request.url),
            request.controller ? { signal: request.controller.signal } : undefined);
          if (!response.ok) throw new Error('Метаданные ролика недоступны.');
          const metadata = await response.json();
          if (state.metadataRequests.get(key) !== request) return;
          const project = findProject(projectId);
          if (!project || project.url.trim() !== request.url) return;
          const revisions = revisionsForProject(project.id);
          let changed = false;
          if (request.titleSource === 'auto' && project.titleSource === 'auto'
              && revisions.title === request.titleRevision && asText(metadata?.title).trim()) {
            project.title = asText(metadata.title).trim();
            project.titleSource = 'auto';
            changed = true;
          }
          if (request.channelSource === 'auto' && project.channelSource === 'auto'
              && revisions.channel === request.channelRevision && asText(metadata?.author_name).trim()) {
            project.channel = asText(metadata.author_name).trim();
            project.channelSource = 'auto';
            changed = true;
          }
          if (changed) {
            if (state.videoComposer?.projectId && String(state.videoComposer.projectId) === String(project.id)) state.videoComposer.draft = project;
            saveProject(project);
            updateProjectVisual(project);
          }
        } catch (error) {
          // Metadata is optional, so a network failure must not affect local editing.
        } finally {
          if (state.metadataRequests.get(key) === request) state.metadataRequests.delete(key);
        }
      }

      function ensureVideoDraftProject() {
        if (!state.videoComposer) return null;
        if (state.videoComposer.projectId) return findProject(state.videoComposer.projectId);
        const project = normalizeProject({ id: makeId(), ...state.videoComposer.draft });
        state.projects.unshift(project);
        state.videoComposer.projectId = project.id;
        state.videoComposer.draft = project;
        state.activeProjectId = project.id;
        state.settings.activeProjectId = project.id;
        saveProject(project, false).catch(() => undefined);
        saveSettings(['activeProjectId']);
        return project;
      }

      function finishVideoComposer() {
        if (!state.videoComposer) return;
        const project = ensureVideoDraftProject();
        if (project && !project.title) project.title = 'Без названия';
        if (project) saveProject(project, false).catch(() => undefined);
        state.videoComposer = null;
        renderFeed();
      }

      function addElement(projectId, image = '', timecode = currentCatalogPlayerTimecode(projectId)) {
        const element = normalizeElement({ id: makeId(), projectId, image, timecodes: timecode ? [timecode] : [], repeatCount: 1 });
        rememberLocalPreview(element.id, image);
        state.elements.push(element);
        state.activeProjectId = projectId;
        state.newElementId = element.id;
        state.editingElementId = element.id;
        saveElement(element, false).catch(() => undefined);
        renderFeed();
        updateProjectCounts(projectId);
        return element;
      }

      function updateVideoDraft(field, value) {
        if (!state.videoComposer) return;
        state.videoComposer.draft[field] = value;
        const project = ensureVideoDraftProject();
        if (!project) return;
        project[field] = value;
        markProjectFieldManual(project, field);
        if (field === 'url') scheduleProjectMetadata(project);
        saveProject(project);
        renderSidebar();
      }

      function updateProject(project, field, value) {
        if (field === 'progress') {
          project.progressOverride = clamp(Number(value) || 0, 0, 100);
          project.completed = false;
        } else {
          project[field] = value;
          markProjectFieldManual(project, field);
          if (field === 'url') {
            scheduleProjectMetadata(project);
            renderPlayerDock();
          }
        }
        saveProject(project);
        updateProjectVisual(project);
        scheduleStatsUpdate();
      }

      function updateElement(element, field, value) {
        if (field === 'timecode') {
          element.timecodes = timecodesFrom({ timecodes: [value] });
        } else {
          element[field] = value;
        }
        saveElement(element);
        updateProjectCounts(element.projectId);
        scheduleStatsUpdate();
      }

      function updateRepeat(element, decrement, button) {
        const next = Math.max(1, element.repeatCount + (decrement ? -1 : 1));
        if (next === element.repeatCount) return;
        element.repeatCount = next;
        saveElement(element);
        for (const badge of dom.appShell.querySelectorAll('.repeat-badge')) {
          const card = badge.closest('[data-element-id]');
          if (card?.dataset.elementId === String(element.id)) {
            badge.textContent = `×${next}`;
            badge.setAttribute('aria-label', `Повторы ${next}`);
            badge.classList.remove('is-pulsing');
            void badge.offsetWidth;
            badge.classList.add('is-pulsing');
          }
        }
        refreshReferenceVisuals(element.projectId);
        updateProjectCounts(element.projectId);
        scheduleStatsUpdate();
      }

      function copyElement(source) {
        const clone = normalizeElement({ ...source, id: makeId(), createdAt: Date.now(), updatedAt: Date.now() });
        state.elements.push(clone);
        state.newElementId = clone.id;
        saveElement(clone, false).catch(() => undefined);
        renderFeed();
        updateProjectCounts(clone.projectId);
      }

      function removeElement(element) {
        const index = state.elements.findIndex((candidate) => String(candidate.id) === String(element.id));
        if (index < 0) return;
        const card = [...dom.workspaceInner.querySelectorAll('[data-element-id]')].find((node) => node.dataset.elementId === String(element.id));
        cancelElementCommit(element.id);
        state.elements.splice(index, 1);
        if (String(state.editingElementId) === String(element.id)) state.editingElementId = null;
        deleteElementFromDatabase(element.id).catch(() => undefined);
        updateProjectCounts(element.projectId);
        if (card) {
          card.classList.add('is-removing');
          setTimeout(renderFeed, 210);
        } else {
          renderFeed();
        }
      }

      function removeProject(project) {
        const index = state.projects.findIndex((candidate) => String(candidate.id) === String(project.id));
        if (index < 0) return;
        const projectElements = elementsForProject(project.id);
        cancelScheduledCommit(`project:${String(project.id)}`);
        for (const element of projectElements) cancelElementCommit(element.id);
        stopProjectMetadata(project.id);
        const wasActive = String(state.activeProjectId) === String(project.id);
        state.projects.splice(index, 1);
        state.elements = state.elements.filter((element) => String(element.projectId) !== String(project.id));
        if (wasActive) {
          const nextProject = state.projects[Math.min(index, state.projects.length - 1)] || null;
          state.activeProjectId = nextProject?.id || null;
          state.settings.activeProjectId = state.activeProjectId;
        }
        state.editingElementId = null;
        state.newElementId = null;
        if (String(state.videoComposer?.projectId) === String(project.id)) state.videoComposer = null;
        deleteProjectFromDatabase(project, projectElements).catch(() => undefined);
        renderFeed();
      }

      function showToast(text, undoAction) {
        clearTimeout(state.undoTimer);
        dom.toast.textContent = '';
        const label = document.createElement('span');
        label.textContent = text;
        dom.toast.append(label);
        if (undoAction) {
          const dot = document.createElement('span');
          dot.textContent = '·';
          const button = document.createElement('button');
          button.className = 'undo-button';
          button.type = 'button';
          button.textContent = 'Вернуть';
          button.addEventListener('click', undoAction, { once: true });
          dom.toast.append(dot, button);
        }
        dom.toast.classList.add('is-showing');
        state.undoTimer = setTimeout(() => {
          dom.toast.classList.remove('is-showing');
          state.undo = null;
        }, undoAction ? 5000 : 2600);

      function deleteConfirmationMatches(value) {

      function renderModal() {
        const modal = state.modal;
        if (!modal) {
          dom.modalSurface.classList.remove('is-open');
          dom.modalSurface.innerHTML = '';
          return;
        }
        // Deleting a video destroys every element inside it, so it asks for the typed word.
        // Deleting a single element only asks for a deliberate second click.
        const typedRequired = modal.kind === 'project';
        const deletionConfirmed = !typedRequired || deleteConfirmationMatches(modal.confirmation);
        const elements = typedRequired ? elementsForProject(modal.record?.id).length : 0;
        dom.modalSurface.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <h2 id="modalTitle">Удалить ${typedRequired ? 'ролик' : 'элемент'}?</h2>
          <p>${typedRequired
            ? `Ролик «${escapeHtml(modal.record?.title || 'Без названия')}» и ${elements} ${elements === 1 ? 'элемент' : 'элементов'} будут удалены безвозвратно.`
            : 'Элемент будет удалён безвозвратно.'}</p>
          ${typedRequired ? `<label class="modal-help" for="deleteConfirmation">Введите «${DELETE_CONFIRMATION}» для подтверждения.</label>
          <input id="deleteConfirmation" data-delete-confirmation value="${escapeAttribute(modal.confirmation || '')}" autocomplete="off" aria-label="Подтверждение удаления">` : ''}
          <div class="modal-actions"><button class="modal-button" type="button" data-modal-action="cancel">Отмена</button><button class="modal-button modal-button-danger" type="button" data-modal-action="delete" ${deletionConfirmed ? '' : 'disabled'}>Удалить</button></div>
        </div>`;
        dom.modalSurface.classList.add('is-open');

          const field = dom.modalSurface.querySelector('input');

      function showDeleteModal(kind, record) {

      function closeMenu() {

        dom.menuButton.setAttribute('aria-expanded', 'false');

      function applyTheme() {
        const theme = state.settings.theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        const themeButton = dom.menuPanel.querySelector('[data-action="theme"]');
        if (themeButton) themeButton.innerHTML = `<span class="menu-icon">◐</span>${theme === 'dark' ? 'Светлая тема' : 'Тёмная тема'}`;
      }

      function cropFrameStyle(frame) {
        return `left:${frame.x * 100}%;top:${frame.y * 100}%;width:${frame.w * 100}%;height:${frame.h * 100}%;`;
      }

      function normalizeCrop(crop) {
        const fallback = { x: .1, y: .1, w: .8, h: .8 };
        if (!crop || typeof crop !== 'object') return fallback;
        const w = clamp(Number(crop.w) || fallback.w, .05, 1);
        const h = clamp(Number(crop.h) || fallback.h, .05, 1);
        return {
          x: clamp(Number(crop.x) || 0, 0, 1 - w),
          y: clamp(Number(crop.y) || 0, 0, 1 - h),
          w,
          h
        };
      }

      function renderCalibration() {
        const calibration = state.calibration;
        if (!calibration) {
          dom.calibrationSurface.classList.remove('is-open');
          dom.calibrationSurface.innerHTML = '';
          return;
        }
        dom.calibrationSurface.innerHTML = `
          <div class="calibration-card">
            <div class="calibration-head"><div><strong>Калибровка рамки</strong><br><span>Перетащите рамку и потяните за угол.</span></div><button class="icon-button" type="button" data-close-calibration aria-label="Закрыть">×</button></div>
            <div id="cropStage" class="crop-stage"><img src="${escapeAttribute(calibration.source)}" alt="Исходный скрин"><div id="cropFrame" class="crop-frame" style="${cropFrameStyle(calibration.frame)}"><span class="crop-handle" data-crop-handle="resize"></span></div></div>
            <div class="calibration-actions"><button id="cropDone" class="primary-button" type="button">Готово</button></div>
          </div>`;
        dom.calibrationSurface.classList.add('is-open');
      }

      function startCalibration(source, targetElementId = null) {
        state.calibration = { source, targetElementId, frame: normalizeCrop(state.settings.crop) };
        renderCalibration();
      }

      function closeCalibration() {
        state.calibration = null;
        state.cropDrag = null;
        renderCalibration();
      }

      function beginCropDrag(event) {
        if (!state.calibration) return;
        const stage = byId('cropStage');
        if (!stage) return;
        const rect = stage.getBoundingClientRect();
        state.cropDrag = {
          type: event.target.closest('[data-crop-handle]') ? 'resize' : 'move',
          startX: event.clientX,
          startY: event.clientY,
          stageWidth: rect.width,
          stageHeight: rect.height,
          frame: { ...state.calibration.frame }
        };
        event.preventDefault();
      }

      function moveCropDrag(event) {
        const drag = state.cropDrag;
        const calibration = state.calibration;
        if (!drag || !calibration) return;
        const dx = (event.clientX - drag.startX) / drag.stageWidth;
        const dy = (event.clientY - drag.startY) / drag.stageHeight;
        let next = { ...drag.frame };
        if (drag.type === 'resize') {
          next.w = clamp(drag.frame.w + dx, .05, 1 - drag.frame.x);
          next.h = clamp(drag.frame.h + dy, .05, 1 - drag.frame.y);
        } else {
          next.x = clamp(drag.frame.x + dx, 0, 1 - next.w);
          next.y = clamp(drag.frame.y + dy, 0, 1 - next.h);
        }
        calibration.frame = next;
        const frame = byId('cropFrame');
        if (frame) frame.style.cssText = cropFrameStyle(next);
      }

      async function imageFromDataUrl(dataUrl) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error('Скрин не удалось прочитать.'));
          image.src = dataUrl;
        });
      }

      async function cropImage(dataUrl, crop) {
        const image = await imageFromDataUrl(dataUrl);
        const frame = normalizeCrop(crop);
        const sourceWidth = Math.max(1, Math.round(image.naturalWidth * frame.w));
        const sourceHeight = Math.max(1, Math.round(image.naturalHeight * frame.h));
        const scale = Math.min(1, 1280 / Math.max(sourceWidth, sourceHeight));
        const width = Math.max(1, Math.round(sourceWidth * scale));
        const height = Math.max(1, Math.round(sourceHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');
        context.drawImage(image, Math.round(image.naturalWidth * frame.x), Math.round(image.naturalHeight * frame.y), sourceWidth, sourceHeight, 0, 0, width, height);
        return canvas.toDataURL('image/jpeg', .8);
      }

      async function compressImageDataUrl(dataUrl) {
        const image = await imageFromDataUrl(dataUrl);
        const sourceWidth = Math.max(1, image.naturalWidth || image.width);
        const sourceHeight = Math.max(1, image.naturalHeight || image.height);
        const scale = Math.min(1, 1280 / Math.max(sourceWidth, sourceHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(sourceWidth * scale));
        canvas.height = Math.max(1, Math.round(sourceHeight * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', .8);
      }

      async function completeCalibration() {
        const calibration = state.calibration;
        if (!calibration) return;
        const frame = normalizeCrop(calibration.frame);
        state.settings.crop = frame;
        state.settings.cropCalibrated = true;
        saveSettings(['crop', 'cropCalibrated']);
        closeCalibration();
        if (!calibration.targetElementId) {
          showToast('Рамка сохранена.');
          return;
        }
        try {
          const element = findElement(calibration.targetElementId);
          if (!element) return;
          element.image = await cropImage(calibration.source, frame);
          rememberLocalPreview(element.id, element.image);
          saveElement(element, false).catch(() => undefined);
          renderFeed();
        } catch (error) {
          showToast(error.message || 'Обрезка не удалась.');
        }
      }

      function dataUrlFromFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('Не удалось прочитать буфер обмена.'));
          reader.readAsDataURL(file);
        });
      }

      function currentProjectId() {
        if (state.activeProjectId && findProject(state.activeProjectId)) return findProject(state.activeProjectId).id;
        return state.projects[0]?.id || null;
      }

      function youtubeVideoId(value) {
        try {
          const url = new URL(asText(value).trim());
          const host = url.hostname.toLocaleLowerCase().replace(/^www\./, '');
          let id = '';
          if (host === 'youtu.be') id = url.pathname.split('/').filter(Boolean)[0] || '';
          if (host === 'youtube.com' || host.endsWith('.youtube.com')) {
            id = url.searchParams.get('v') || '';
            if (!id) {
              const parts = url.pathname.split('/').filter(Boolean);
              if (['embed', 'shorts', 'live'].includes(parts[0])) id = parts[1] || '';
            }
          }
          return /^[\w-]{6,}$/.test(id) ? id : '';
        } catch (error) {
          return '';
        }
      }

      function youtubeStartSeconds(value) {
        try {
          const url = new URL(asText(value).trim());
          const raw = asText(url.searchParams.get('t') || url.searchParams.get('start')).trim().toLocaleLowerCase();
          if (/^\d+(?:\.\d+)?s?$/.test(raw)) return Math.max(0, Math.floor(Number(raw.replace(/s$/, ''))));
          const parts = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/.exec(raw);
          if (!parts || !parts.slice(1).some(Boolean)) return 0;
          return Number(parts[1] || 0) * 3600 + Number(parts[2] || 0) * 60 + Number(parts[3] || 0);
        } catch (error) {
          return 0;
        }
      }

      function loadYouTubePlayerApi() {
        if (globalThis.YT?.Player) return Promise.resolve(globalThis.YT);
        if (state.player.apiPromise) return state.player.apiPromise;
        const promise = new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('YouTube Player API timeout')), 10000);
          const previousReady = globalThis.onYouTubeIframeAPIReady;
          globalThis.onYouTubeIframeAPIReady = () => {
            clearTimeout(timeout);
            try {
              if (typeof previousReady === 'function') previousReady();
            } finally {
              if (globalThis.YT?.Player) resolve(globalThis.YT);
              else reject(new Error('YouTube Player API unavailable'));
            }
          };
          let script = document.querySelector('script[src="https://www.youtube.com/iframe_api"]');
          if (!script) {
            script = document.createElement('script');
            script.src = 'https://www.youtube.com/iframe_api';
            script.async = true;
            document.head.append(script);
          }
          script.addEventListener('error', () => {
            clearTimeout(timeout);
            reject(new Error('YouTube Player API load failed'));
          }, { once: true });
        });
        state.player.apiPromise = promise.catch((error) => {
          state.player.apiPromise = null;
          throw error;
        });
        return state.player.apiPromise;
      }

      function resetCatalogPlayer() {
        state.player.generation += 1;
        clearInterval(state.player.clockTimer);
        state.player.clockTimer = null;
        try {
          state.player.instance?.destroy?.();
        } catch (error) {
          // A detached third-party iframe can already be destroyed by the browser.
        }
        state.player.instance = null;
        state.player.projectId = null;
        state.player.videoId = '';
        state.player.ready = false;
        dom.playerFrame.replaceChildren();
        dom.playerClock.textContent = '—';
      }

      function capturedTimecodeFromPlayer(player) {
        try {
          return formatCapturedTimecode(player?.getCurrentTime?.());
        } catch (error) {
          return '';
        }
      }

      function currentCatalogPlayerTimecode(projectId = currentProjectId()) {
        if (!state.player.ready || String(state.player.projectId) !== String(projectId)) return '';
        return capturedTimecodeFromPlayer(state.player.instance);
      }

      function updateCatalogPlayerClock() {
        if (!state.player.ready) return;
        const timecode = currentCatalogPlayerTimecode(state.player.projectId);
        dom.playerClock.textContent = timecode || '—';
        dom.playerStatus.textContent = timecode
          ? 'Этот таймкод будет записан при добавлении элемента или вставке скрина.'
          : 'Позиция плеера пока недоступна.';
      }

      function renderPlayerDock() {
        const project = state.videoComposer ? null : findProject(state.activeProjectId);
        const videoId = youtubeVideoId(project?.url);
        if (!project || !videoId) {
          dom.playerDock.hidden = true;
          if (state.player.instance || state.player.videoId) resetCatalogPlayer();
          return;
        }
        dom.playerDock.hidden = false;
        dom.playerLink.href = project.url;
        if (state.player.videoId === videoId && String(state.player.projectId) === String(project.id)) {
          updateCatalogPlayerClock();
          return;
        }

        resetCatalogPlayer();
        const generation = state.player.generation;
        state.player.projectId = project.id;
        state.player.videoId = videoId;
        dom.playerStatus.textContent = 'Загрузка плеера…';
        const mount = document.createElement('div');
        mount.id = 'catalogYoutubePlayer';
        dom.playerFrame.append(mount);
        loadYouTubePlayerApi().then((YT) => {
          if (generation !== state.player.generation || !mount.isConnected) return;
          const playerVars = { playsinline: 1, rel: 0, start: youtubeStartSeconds(project.url) };
          if (/^https?:$/.test(location.protocol)) playerVars.origin = location.origin;
          state.player.instance = new YT.Player(mount, {
            videoId,
            playerVars,
            events: {
              onReady: () => {
                if (generation !== state.player.generation) return;
                state.player.ready = true;
                clearInterval(state.player.clockTimer);
                state.player.clockTimer = setInterval(updateCatalogPlayerClock, 500);
                updateCatalogPlayerClock();
              },
              onStateChange: () => {
                if (generation === state.player.generation) updateCatalogPlayerClock();
              },
              onError: () => {
                if (generation !== state.player.generation) return;
                state.player.ready = false;
                dom.playerClock.textContent = '—';
                dom.playerStatus.textContent = 'Плеер недоступен. Откройте ролик по ссылке и укажите таймкод вручную.';
              }
            }
          });
        }).catch(() => {
          if (generation !== state.player.generation) return;
          dom.playerClock.textContent = '—';
          dom.playerStatus.textContent = 'Плеер не загрузился. Проверьте сеть или укажите таймкод вручную.';
        });
      }

      function formatCapturedTimecode(value) {
        const seconds = Number(value);
        if (!Number.isFinite(seconds) || seconds < 0) return '';
        const wholeSeconds = Math.floor(seconds);
        const hours = Math.floor(wholeSeconds / 3600);
        const minutes = Math.floor(wholeSeconds % 3600 / 60);
        const remainder = wholeSeconds % 60;
        return hours
          ? `${hours}:${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`
          : `${minutes}:${String(remainder).padStart(2, '0')}`;
      }

      function capturedTimecodeFromText(value) {
        const text = asText(value);
        const pair = /(^|[^\d:])((?:\d+:)?\d{1,2}:\d{2})\s*(?:\/|из)\s*(?:\d+:)?\d{1,2}:\d{2}(?=$|[^\d:])/i.exec(text);
        if (pair) return formatCapturedTimecode(parseTimecode(pair[2]));
        const urlTime = /[?#&](?:t|start)=(\d+(?:\.\d+)?)(?:s)?(?:[&#]|$)/i.exec(text);
        return urlTime ? formatCapturedTimecode(urlTime[1]) : '';
      }

      function capturedTimecodeFromMedia() {
        if (typeof HTMLMediaElement === 'undefined') return '';
        const media = [...document.querySelectorAll('video, audio')]
          .filter((candidate) => candidate instanceof HTMLMediaElement && Number.isFinite(candidate.currentTime) && candidate.currentTime >= 0);
        const current = media.find((candidate) => !candidate.paused && !candidate.ended) || media[0];
        return current ? formatCapturedTimecode(current.currentTime) : '';
      }

      function captureTimecodeAtPaste(clipboardData = null) {
        const playerTimecode = currentCatalogPlayerTimecode();
        if (playerTimecode) return playerTimecode;
        const mediaTimecode = capturedTimecodeFromMedia();
        if (mediaTimecode) return mediaTimecode;
        if (!clipboardData?.getData) return '';
        return capturedTimecodeFromText(clipboardData.getData('text/plain'))
          || capturedTimecodeFromText(clipboardData.getData('text/uri-list'));
      }

      async function detectTimecodeFromScreenshot(source) {
        if (typeof globalThis.TextDetector !== 'function') return '';
        try {
          const image = await imageFromDataUrl(source);
          const detections = await new globalThis.TextDetector().detect(image);
          return capturedTimecodeFromText(detections.map((detection) => detection.rawValue).join('\n'));
        } catch (error) {
          return '';
        }
      }

      async function handleImagePaste(file, capturedTimecode = captureTimecodeAtPaste()) {
        const projectId = currentProjectId();
        if (!projectId) {
          openVideoComposer();
          showToast('Сначала создайте ролик для этого скрина.');
          return;
        }
        try {
          const source = await compressImageDataUrl(await dataUrlFromFile(file));
          const timecode = capturedTimecode || await detectTimecodeFromScreenshot(source);
          state.settings.lastCropSource = source;
          saveSettings(['lastCropSource']);
          const element = addElement(projectId, source, timecode);
          if (state.settings.cropCalibrated && state.settings.crop) {
            element.image = await cropImage(source, state.settings.crop);
            rememberLocalPreview(element.id, element.image);
            saveElement(element, false).catch(() => undefined);
            renderFeed();
          } else {
            startCalibration(source, element.id);
          }
        } catch (error) {
          showToast(error.message || 'Вставка скрина не удалась.');
        }
      }

      function parseTimecode(value) {
        const parts = asText(value).trim().split(':');
        if (!parts.length || parts.some((part) => !/^\d+(?:\.\d+)?$/.test(part))) return null;
        let seconds = 0;
        for (const part of parts) seconds = seconds * 60 + Number(part);
        return Number.isFinite(seconds) ? seconds : null;
      }

      function groupedElements() {
        const groups = new Map();
        for (const element of state.elements) {
          const key = elementName(element).toLocaleLowerCase().replace(/\s+/g, ' ').trim();
          const group = groups.get(key) || { name: elementName(element), count: 0, image: element.image, niches: new Set() };
          group.count += Math.max(1, element.repeatCount || 1);
          if (!group.image && element.image) group.image = element.image;
          const project = findProject(element.projectId);
          group.niches.add(project?.niche || 'Без ниши');
          groups.set(key, group);
        }
        return [...groups.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
      }

      function timelineMarkup(project) {
        const duration = parseTimecode(project.duration);
        const elements = elementsForProject(project.id);
        let stack = 0;
        const markers = [];
        for (const element of elements) {
          const time = elementStartSeconds(element);
          if (duration && Number.isFinite(time) && time <= duration) {
            const position = clamp((time / duration) * 100, 0, 100);
            markers.push(`<button class="timeline-marker" type="button" style="left:${position}%" aria-label="${escapeAttribute(elementName(element))}"><span class="timeline-tooltip">${escapeHtml(elementName(element))}</span></button>`);
          } else {
            stack += 1;
          }
        }
        const progress = projectProgress(project);
        return `<div class="timeline-row"><div class="timeline-name">${escapeHtml(project.title || 'Без названия')}</div><div class="timeline" data-duration="${escapeAttribute(project.duration || '—')}">${markers.join('')}${stack ? `<span class="timeline-stack">+${stack}</span>` : ''}</div><div class="mini-progress ${progress >= 100 ? 'is-complete' : ''}" style="--progress:${progress}%"><span></span></div></div>`;
      }

      const STAT_STOP_WORDS = new Set(('и в во не на что как с по для от до это а но или мы вы они он она оно ' +
        'the and for with from this that are was were have has into about your our you not all ' +
        'und der die das ein eine mit für von auf ist sind den dem nicht').split(/\s+/));

      function statisticsFor(projects) {
        const projectIds = new Set(projects.map((project) => String(project.id)));
        const elements = chronologicalElements(state.elements.filter((element) => projectIds.has(String(element.projectId))));
        const categories = new Map();
        const techniques = new Map();
        const keywords = new Map();
        for (const element of elements) {
          const category = categoryName(element.category) || 'Без категории';
          const categoryStat = categories.get(category) || { name: category, count: 0, repeats: 0 };
          categoryStat.count += 1;
          categoryStat.repeats += Math.max(1, Number(element.repeatCount) || 1);
          categories.set(category, categoryStat);
          const technique = asText(element.technique).trim();
          if (technique) techniques.set(technique, (techniques.get(technique) || 0) + 1);
          const words = `${element.description} ${element.technique}`.toLocaleLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
          for (const word of words) {
            if ([...word].length < 3 || STAT_STOP_WORDS.has(word)) continue;
            keywords.set(word, (keywords.get(word) || 0) + 1);
          }
        }
        const duration = projects.reduce((sum, project) => sum + (parseTimecode(project.duration) || 0), 0);
        // Timeline coverage is the last marked frame against the video length, not a guess.
        const coveredSeconds = projects.reduce((sum, project) => {
          const times = elementsForProject(project.id)
            .map(elementStartSeconds)
            .filter(Number.isFinite);
          return sum + (times.length ? Math.max(...times) : 0);
        }, 0);
        const mentions = new Map();
        for (const project of projects) {
          const list = elementsForProject(project.id);
          for (const [number, sources] of referenceBacklinks(project.id)) {
            const target = list[number - 1];
            if (target) mentions.set(String(target.id), { element: target, project, count: sources.size, sources: [...sources].sort((a, b) => a - b), number });
          }
        }
        const repeated = elements
          .filter((element) => Math.max(1, Number(element.repeatCount) || 1) > 1)
          .sort((left, right) => (right.repeatCount || 1) - (left.repeatCount || 1) || compareElementsChronologically(left, right));
        return {
          coveredSeconds,
          mentions: [...mentions.values()].sort((left, right) => right.count - left.count || left.number - right.number),
          repeated,
          marked: elements.filter((element) => asText(element.description).trim() || asText(element.category).trim()).length,
          projects,
          elements,
          repeats: totalRepeats(elements),
          categories: [...categories.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ru')),
          techniques: [...techniques.entries()].map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ru')),
          keywords: [...keywords.entries()].map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ru')),
          withImage: elements.filter((element) => Boolean(element.image)).length,
          withTimecode: elements.filter((element) => timecodesFrom(element).length > 0).length,
          completed: projects.filter((project) => project.completed).length,
          duration
        };
      }

      function formatSeconds(seconds) {
        const total = Math.max(0, Math.round(seconds));
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
      }

      function statsSummaryMarkup(stats, includeProjects) {
        const completePercent = stats.projects.length ? Math.round((stats.completed / stats.projects.length) * 100) : 0;
        return `<div class="stat-summary">
          ${includeProjects ? `<div class="kpi"><div class="kpi-value">${stats.projects.length}</div><div class="kpi-label">Роликов</div></div>` : ''}
          <div class="kpi"><div class="kpi-value">${stats.elements.length}</div><div class="kpi-label">Элементов</div></div>
          <div class="kpi"><div class="kpi-value">${stats.repeats}</div><div class="kpi-label">Повторов ×N</div></div>
          <div class="kpi"><div class="kpi-value">${stats.marked}/${stats.elements.length}</div><div class="kpi-label">Размечено</div></div>
          <div class="kpi"><div class="kpi-value">${stats.withImage}/${stats.elements.length}</div><div class="kpi-label">С картинкой</div></div>
          <div class="kpi"><div class="kpi-value">${completePercent}%</div><div class="kpi-label">Закончен</div></div>
        </div>`;
      }

      function statsListMarkup(items, total, kind) {
        if (!items.length) return '<div class="stat-note">Пока нет данных</div>';
        return `<div class="stat-list">${items.slice(0, 10).map((item) => {
          const percent = total ? Math.round((item.count / total) * 100) : 0;
          const label = kind === 'category' ? `${item.count} эл. · ${percent}%` : `${item.count} раз`;
          return `<div class="stat-entry"><span class="stat-entry-name">${kind === 'category' ? `<span class="category-icon">${categoryIcon(item.name)}</span>` : ''}${escapeHtml(item.name)}</span><span class="stat-entry-value">${label}</span>${kind === 'category' ? `<div class="stat-bar ${percent >= 100 ? 'is-complete' : ''}" style="--progress:${percent}%"><span></span></div>` : ''}</div>`;
        }).join('')}</div>`;
      }

      // Repetition of a technique shows up two ways: the ×N badge and #NN mentions in texts.
      function repetitionsMarkup(stats) {
        const label = (number) => `#${String(number).padStart(2, '0')}`;
        const mentions = stats.mentions.slice(0, 10).map((row) => `<div class="stat-entry"><span class="stat-entry-name"><button class="ref-link" type="button" data-ref-number="${row.number}">${label(row.number)}</button> ${escapeHtml(elementName(row.element))}</span><span class="stat-entry-value">${row.count} упом. · ${row.sources.map(label).join(', ')}</span></div>`);
        const repeated = stats.repeated.slice(0, 10).map((element) => `<div class="stat-entry"><span class="stat-entry-name"><button class="ref-link" type="button" data-ref-number="${elementNumber(element)}">${label(elementNumber(element))}</button> ${escapeHtml(elementName(element))}</span><span class="stat-entry-value">×${element.repeatCount}</span></div>`);
        return `<h4>Чаще всего упоминают (#NN в текстах)</h4>${mentions.length ? `<div class="stat-list">${mentions.join('')}</div>` : '<div class="stat-note">Ссылок #NN пока нет</div>'}<h4>Повторы приёма (×N)</h4>${repeated.length ? `<div class="stat-list">${repeated.join('')}</div>` : '<div class="stat-note">Повторов пока нет</div>'}`;
      }

      function familyStatisticsMarkup() {
        const baseTotal = state.elements.filter((element) => element.tier === 'base').length;
        const uniqueTotal = state.elements.length - baseTotal;
        const rows = FAMILY_ORDER.map((family) => {

          const videos = new Set(elements.map((element) => String(element.projectId))).size;

          const unique = elements.length - base;
          const tier = base >= unique ? 'base' : 'unique';
          return `<div class="stat-entry"><span class="stat-entry-name">${escapeHtml(family)}</span><span class="stat-entry-value">${videos}/${state.projects.length} видео · база ${base} · уник. ${unique} · <span class="family-stat-tier is-${tier}">${tierLabel(tier)}</span></span></div>`;
        });
        return `<div class="stat-summary"><div class="kpi"><div class="kpi-value">${baseTotal}</div><div class="kpi-label">База</div></div><div class="kpi"><div class="kpi-value">${uniqueTotal}</div><div class="kpi-label">Уникальные</div></div><div class="kpi"><div class="kpi-value">${FAMILY_ORDER.length}</div><div class="kpi-label">Семейств</div></div><div class="kpi"><div class="kpi-value">${state.projects.length}</div><div class="kpi-label">Видео</div></div></div><div class="stat-note">Порог базы: ≥${Math.round(BASE_VIDEO_THRESHOLD * 100)}% project-записей</div><div class="stat-list">${rows.join('')}</div>`;
      }

      function updateStatsPanel() {

        byId('statsTechniques').innerHTML = `<h4>Текущий ролик</h4>${statsListMarkup(current.techniques, current.elements.length, 'technique')}<h4>Все ролики</h4>${statsListMarkup(all.techniques, all.elements.length, 'technique')}`;

        const coverage = (stats) => stats.duration

        byId('statsRepetitions').innerHTML = repetitionsMarkup(current);

      function drawBars(canvas) {
        if (!canvas) return;
        const rows = state.projects.map((project) => ({
          name: project.title || 'Без названия',
          value: elementsForProject(project.id).length + totalRepeats(elementsForProject(project.id))
        }));
        const bounds = canvas.getBoundingClientRect();
        const ratio = Math.max(1, globalThis.devicePixelRatio || 1);
        canvas.width = Math.max(1, Math.floor(bounds.width * ratio));
        canvas.height = Math.max(1, Math.floor(bounds.height * ratio));
        const context = canvas.getContext('2d');
        context.scale(ratio, ratio);
        const width = bounds.width;
        const height = bounds.height;
        const maximum = Math.max(1, ...rows.map((row) => row.value));
        const start = performance.now();
        const duration = 500;
        const styles = getComputedStyle(document.documentElement);
        const accent = styles.getPropertyValue('--accent').trim();
        const muted = styles.getPropertyValue('--muted').trim();
        const surface = styles.getPropertyValue('--surface-raised').trim();
        const draw = (time) => {
          const progress = clamp((time - start) / duration, 0, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          context.clearRect(0, 0, width, height);
          context.fillStyle = surface;
          context.fillRect(0, 0, width, height);
          const left = 18;
          const bottom = 30;
          const chartHeight = Math.max(20, height - 48);
          const slot = (width - left * 2) / Math.max(1, rows.length);
          const barWidth = Math.max(5, Math.min(42, slot * .62));
          context.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
          context.textAlign = 'center';
          rows.forEach((row, index) => {
            const barHeight = (row.value / maximum) * chartHeight * eased;
            const x = left + index * slot + (slot - barWidth) / 2;
            const y = height - bottom - barHeight;
            context.fillStyle = accent;
            context.beginPath();
            context.roundRect(x, y, barWidth, barHeight, 3);
            context.fill();
            context.fillStyle = muted;
            const label = row.name.length > 12 ? `${row.name.slice(0, 11)}…` : row.name;
            context.fillText(label, x + barWidth / 2, height - 12);
          });
          if (progress < 1 && state.statsOpen) requestAnimationFrame(draw);
        };
        requestAnimationFrame(draw);
      }
