      function importedSettings(rawSettings) {
        const result = { ...DEFAULT_SETTINGS };
        if (Array.isArray(rawSettings)) {
          for (const item of rawSettings) if (item && hasOwn(item, 'key')) result[item.key] = item.value;
        } else if (rawSettings && typeof rawSettings === 'object') {
          Object.assign(result, rawSettings);
        }
        if (state.settings.backupDirectoryHandle) result.backupDirectoryHandle = state.settings.backupDirectoryHandle;
        if (state.settings.backupLastWrittenAt) result.backupLastWrittenAt = state.settings.backupLastWrittenAt;
        return result;
      }

      function prepareImport(raw) {
        if (!raw || typeof raw !== 'object') throw new Error('Файл импорта не является каталогом.');
        const rawProjects = Array.isArray(raw.projects) ? raw.projects : (Array.isArray(raw.videos) ? raw.videos : null);
        const rawElements = Array.isArray(raw.elements) ? raw.elements : [];
        if (!rawProjects) throw new Error('В импорте отсутствуют ролики.');
        const projects = rawProjects.map((project) => normalizeProject(project));
        const ids = new Set();
        for (const project of projects) {
          const key = String(project.id);
          if (ids.has(key)) throw new Error('В импорте повторяется id ролика.');
          ids.add(key);
        }
        const elements = rawElements.map((element) => normalizeElement(element));
        const elementIds = new Set();
        for (const element of elements) {
          const key = String(element.id);
          if (elementIds.has(key)) throw new Error('В импорте повторяется id элемента.');
          if (!ids.has(String(element.projectId))) throw new Error('Элемент ссылается на отсутствующий ролик.');
          elementIds.add(key);
        }
        const categories = categoryRecords(elements, Array.isArray(raw.categories) ? raw.categories : []);
        const byKey = new Map(categories.map((category) => [category.key, category.name]));
        for (const element of elements) element.category = byKey.get(categoryKey(element.category)) || '';
        return { projects, elements, categories, settings: importedSettings(raw.settings) };
      }

      async function importCatalog(raw) {
        const incoming = prepareImport(raw);
        state.cloud.importing = true;
        state.cloud.pollPaused = true;
        state.cloud.generation += 1;
        clearTimeout(state.cloud.saveTimer);
        state.cloud.pendingSnapshot = null;
        applyReadOnlyState();
        cancelAllScheduledCommits();
        stopAllProjectMetadata();
        clearTimeout(state.backupTimer);
        state.backupTimer = null;
        state.backupGeneration += 1;
        state.backupDirty = false;
        try {
          await state.writeQueue;
          await state.cloud.syncQueue;
          await commit(() => runTransaction(['projects', 'elements', 'categories', 'settings'], 'readwrite', (transaction) => {
            // Import is an explicit user replacement; cloud synchronization never clears stores.
            const projects = transaction.objectStore('projects');
            const elements = transaction.objectStore('elements');
            const categories = transaction.objectStore('categories');
            const settings = transaction.objectStore('settings');
            projects.clear();
            elements.clear();
            categories.clear();
            settings.clear();
            for (const project of incoming.projects) projects.put(project);
            for (const element of incoming.elements) elements.put(element);
            for (const category of incoming.categories) categories.put(category);
            for (const [key, value] of Object.entries(incoming.settings)) settings.put({ key, value });
          }));
          state.projects = incoming.projects;
          state.elements = incoming.elements;
          state.categories = incoming.categories;
          state.settings = incoming.settings;
          state.activeProjectId = state.settings.activeProjectId && findProject(state.settings.activeProjectId)
            ? state.settings.activeProjectId : state.projects[0]?.id || null;
          state.editingElementId = null;
          state.videoComposer = null;
          state.newElementId = null;
          const automatic = applyAutomaticTimecodes();
          if (automatic.length) {
            await commit(() => runTransaction(['elements'], 'readwrite', (transaction) => {
              for (const element of automatic) transaction.objectStore('elements').put(element);
            }), { backup: false });
          }
          markCloudDirty({ allowDuringImport: true });
          await state.cloud.syncQueue;
          if (state.cloud.outboxError) throw new Error('Импорт сохранён локально, но облачный outbox недоступен.');
          applyTheme();
          renderFeed();
          showToast('Импорт завершён.');
        } finally {
          state.cloud.importing = false;
          state.cloud.pollPaused = false;
          applyReadOnlyState();
          if (state.cloud.dirty && state.cloud.token) scheduleCloudSave();
        }
      }

      function markdownValue(value) {
        return asText(value).replace(/\r?\n/g, '\n  ');
      }

      function exportElementRows() {
        let globalNumber = 0;
        return state.projects.flatMap((project) => elementsForProject(project.id).map((element) => ({
          project,
          element,
          globalNumber: ++globalNumber,
          localNumber: elementNumber(element),
          anchor: elementAnchor(project, element)
        })));
      }

      function safeFilePart(value, fallback = 'element', maxLength = 72) {
        let part = asText(value).normalize('NFKC').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '-').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^[.\s-]+|[.\s-]+$/g, '');
        if (!part) part = fallback;
        if (/^(con|prn|aux|nul|com[1-9]|lpt[1-9])$/i.test(part)) part = `_${part}`;
        return [...part].slice(0, maxLength).join('') || fallback;
      }

      function timecodeFilePart(element) {
        const timecode = timecodesFrom(element)[0];
        return timecode ? safeFilePart(timecode.replace(/:/g, '-'), 'NO-TC', 24) : 'NO-TC';
      }

      function claudeImageName(row) {
        return `${String(row.globalNumber).padStart(3, '0')}_${timecodeFilePart(row.element)}_${safeFilePart(elementName(row.element), 'element')}.jpg`;
      }

      function claudeMarkdown(imageReferences = new Map()) {
        const lines = ['# Каталог монтажных элементов', ''];
        for (const project of state.projects) {
          const progress = projectProgress(project);
          lines.push(`## ${markdownValue(project.title || 'Без названия')}`);
          lines.push(`- Project ID: ${markdownValue(project.id)}`);
          lines.push(`- Anchor: ${projectSlug(project)}`);
          lines.push(`- URL: ${markdownValue(project.url) || '—'}`);
          lines.push(`- Channel: ${markdownValue(project.channel) || '—'}`);
          lines.push(`- Niche: ${markdownValue(project.niche) || '—'}`);
          lines.push(`- Duration: ${markdownValue(project.duration) || '—'}`);
          lines.push(`- Progress: ${progress}%`);
          lines.push(`- Progress mode: ${project.progressOverride === null ? 'Auto' : 'Manual override'}`);
          lines.push(`- Completed: ${project.completed ? 'true' : 'false'}`);
          lines.push(`- Host: ${markdownValue(project.host) || '—'}`);
          lines.push(`- Title source: ${markdownValue(project.titleSource) || '—'}`);
          lines.push(`- Channel source: ${markdownValue(project.channelSource) || '—'}`);
          lines.push(`- Created: ${markdownValue(project.createdAt) || '—'}`);
          lines.push(`- Updated: ${markdownValue(project.updatedAt) || '—'}`);
          lines.push('');
          for (const row of exportElementRows().filter((item) => String(item.project.id) === String(project.id))) {
            const { element } = row;
            const image = imageReferences.get(String(element.id)) || '—';
            lines.push(`### ${String(row.globalNumber).padStart(3, '0')} · #${String(row.localNumber).padStart(2, '0')} · ${markdownValue(elementName(element))}`);
            lines.push(`- Anchor: ${row.anchor}`);
            lines.push(`- ID: ${markdownValue(element.id)}`);
            lines.push(`- Project ID: ${markdownValue(element.projectId)}`);
            lines.push(`- Image: ${image}`);
            lines.push(`- Name: ${markdownValue(element.name) || '—'}`);
            lines.push(`- Description: ${markdownValue(element.description) || '—'}`);
            lines.push(`- Opinion: ${markdownValue(element.opinion) || '—'}`);
            lines.push(`- Application: ${markdownValue(element.application) || '—'}`);
            lines.push(`- Technique: ${markdownValue(element.technique) || '—'}`);
            lines.push(`- Category: ${markdownValue(element.category) || '—'}`);
            lines.push(`- Timecode: ${timecodesFrom(element)[0] || '—'}`);
            lines.push(`- Repeat count: ${element.repeatCount}`);
            lines.push(`- Created: ${markdownValue(element.createdAt) || '—'}`);
            lines.push(`- Updated: ${markdownValue(element.updatedAt) || '—'}`);
            lines.push('');
          }
        }
        return lines.join('\n');
      }

      async function blobFromDataUrl(dataUrl) {
        const match = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(dataUrl);
        if (!match) throw new Error('Неверный формат изображения.');
        const mime = match[1] || 'application/octet-stream';
        const body = match[3];
        if (match[2]) {
          const binary = atob(body);
          const bytes = new Uint8Array(binary.length);
          for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
          return new Blob([bytes], { type: mime });
        }
        return new Blob([decodeURIComponent(body)], { type: mime });
      }

      async function writeFile(directory, name, content) {
        const handle = await directory.getFileHandle(name, { create: true });
        const stream = await handle.createWritable();
        await stream.write(content);
        await stream.close();
      }

      function downloadBlob(filename, blob) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }

      async function jpegFromDataUrl(dataUrl) {
        const image = await imageFromDataUrl(dataUrl);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, image.naturalWidth || image.width);
        canvas.height = Math.max(1, image.naturalHeight || image.height);
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        return new Promise((resolve, reject) => canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Не удалось подготовить JPEG.'));
        }, 'image/jpeg', .9));
      }

      async function exportForClaude() {
        closeMenu();
        const rows = exportElementRows();
        const imageReferences = new Map();
        const prepared = [];
        for (const row of rows) {
          if (!row.element.image) continue;
          const filename = claudeImageName(row);
          const blob = await jpegFromDataUrl(row.element.image);
          prepared.push({ filename, blob });
          imageReferences.set(String(row.element.id), filename);
        }
        const markdown = claudeMarkdown(imageReferences);
        if (typeof window.showDirectoryPicker !== 'function') {
          downloadText('KATALOG.md', markdown);
          for (const file of prepared) downloadBlob(file.filename, file.blob);
          showToast('KATALOG.md и JPEG загружены отдельно.');
          return;
        }
        try {
          const parent = await window.showDirectoryPicker({ mode: 'readwrite' });
          const directory = parent.name === 'KATALOG-ANALIZ' ? parent : await parent.getDirectoryHandle('KATALOG-ANALIZ', { create: true });
          for (const file of prepared) await writeFile(directory, file.filename, file.blob);
          await writeFile(directory, 'KATALOG.md', markdown);
          showToast(`KATALOG-ANALIZ сохранён: ${prepared.length} JPEG.`);
        } catch (error) {
          if (error?.name === 'AbortError') return;
          downloadText('KATALOG.md', markdown);
          for (const file of prepared) downloadBlob(file.filename, file.blob);
          showToast('Папка недоступна; KATALOG.md и JPEG загружены отдельно.');
        }
      }

      async function chooseBackupFolder() {
        closeMenu();
        if (typeof window.showDirectoryPicker !== 'function') {
          showToast('Выбор папки не поддерживается этим браузером.');
          return;
        }
        try {
          clearTimeout(state.backupTimer);
          state.backupGeneration += 1;
          state.backupDirty = false;
          state.settings.backupDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          const permission = typeof state.settings.backupDirectoryHandle.requestPermission === 'function'
            ? await state.settings.backupDirectoryHandle.requestPermission({ mode: 'readwrite' }) : 'granted';
          if (permission !== 'granted') throw new Error('Нет доступа к папке бэкапа.');
          await saveSettings(['backupDirectoryHandle'], false, { backup: false });
          await writeBackup();
          showToast('Папка бэкапа подключена.');
        } catch (error) {
          if (error?.name !== 'AbortError') showToast('Папка бэкапа недоступна.');
        }
      }

      function scheduleBackup() {
        if (!state.settings.backupDirectoryHandle) return;
        state.backupDirty = true;
        clearTimeout(state.backupTimer);
        const generation = state.backupGeneration;
        state.backupTimer = setTimeout(() => writeBackup(generation).catch((error) => {
          state.saveError = error.message || 'Ошибка бэкапа';
          showToast('Автобэкап не записан: требуется доступ к папке.');
        }), 700);
      }

      async function backupPermission(directory, request = false) {
        if (!directory?.getFileHandle) return 'denied';
        if (typeof directory.queryPermission !== 'function') return 'granted';
        const current = await directory.queryPermission({ mode: 'readwrite' });
        if (current === 'granted' || !request || typeof directory.requestPermission !== 'function') return current;
        return directory.requestPermission({ mode: 'readwrite' });
      }

      async function refreshBackupPermission() {
        const directory = state.settings.backupDirectoryHandle;
        if (!directory?.getFileHandle) return;
        try {
          const permission = await backupPermission(directory);
          if (permission !== 'granted') showToast('Автобэкап ждёт доступа к выбранной папке.');
        } catch (error) {
          showToast('Не удалось проверить папку автобэкапа.');
        }
      }

      async function writeBackupFile(directory, snapshot) {
        await writeFile(directory, 'katalog-elementov-backup.json.tmp', snapshot);
        await writeFile(directory, 'katalog-elementov-backup.json', snapshot);
        try { await directory.removeEntry('katalog-elementov-backup.json.tmp'); } catch (error) { /* best-effort cleanup */ }
      }

      async function writeBackup(generation = state.backupGeneration) {
        const directory = state.settings.backupDirectoryHandle;
        if (!directory?.getFileHandle || generation !== state.backupGeneration) return;
        state.backupDirty = true;
        if (state.backupInFlight) return;
        state.backupInFlight = true;
        try {
          while (state.backupDirty && generation === state.backupGeneration) {
            state.backupDirty = false;
            const permission = await backupPermission(directory);
            if (permission !== 'granted') throw new Error('Доступ к папке бэкапа не подтверждён.');
            await writeBackupFile(directory, JSON.stringify(catalogSnapshot(), null, 2));
            state.settings.backupLastWrittenAt = Date.now();
            await saveSettings(['backupLastWrittenAt'], false, { backup: false, cloud: false });
          }
        } finally {
          state.backupInFlight = false;
          if (state.backupDirty && generation === state.backupGeneration) scheduleBackup();
        }
      }

        if (categoryInput) {
          setTimeout(() => {
            const combo = categoryInput.closest('.category-combo');
            if (combo && !combo.contains(document.activeElement)) hideCategoryMenu(categoryInput);
          }, 0);
        }
        setTimeout(() => applyPendingRemoteSnapshot().catch(() => undefined), 0);
      });

      dom.appShell.addEventListener('mousedown', (event) => {
        const choice = event.target.closest('[data-category-choice]');
        if (!choice) return;
        const card = choice.closest('[data-element-id]');
        const element = card && findElement(card.dataset.elementId);
        if (!element) return;
        event.preventDefault();
        selectCategory(element, choice.dataset.categoryChoice);
      });

      dom.appShell.addEventListener('keydown', (event) => {
        const categoryInput = event.target.closest('[data-category-input]');
        if (categoryInput) {
          const card = categoryInput.closest('[data-element-id]');
          const element = card && findElement(card.dataset.elementId);
          if (!element) return;
          if (event.key === 'Enter') {
            event.preventDefault();
            selectCategory(element, categoryInput.value);
          } else if (event.key === 'Escape') {
            event.preventDefault();
            event.stopPropagation();
            categoryInput.value = element.category;
            hideCategoryMenu(categoryInput);
          }
          return;
        }
        if (event.key === 'Enter' && !event.shiftKey && event.target.closest('[data-video-composer]')) {
          event.preventDefault();
          finishVideoComposer();
          return;
        }
        const card = event.target.closest('.element-card');
        if (card && event.target === card && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          state.editingElementId = card.dataset.elementId;
          renderWorkspace();
        }
      });

      dom.search.addEventListener('input', () => {
        state.search = dom.search.value;
        renderFeed();
      });

      dom.categoryFilter.addEventListener('click', () => {
        state.categoryFilter = '';
        renderFeed();
      });

      dom.menuButton.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleMenu();
      });

      dom.menuPanel.addEventListener('click', (event) => {
        const action = event.target.closest('[data-action]')?.dataset.action;
        if (!action) return;
        if (isCloudReadOnly() && !['export-json', 'export-claude', 'stats', 'change-token', 'theme'].includes(action)) {
          closeMenu();
          showToast('Для изменений вставьте GitHub-токен.');
          return;
        }
        if (action === 'export-json') exportJson();
        if (action === 'import-json') {
          closeMenu();
          dom.importFile.click();
        }
        if (action === 'export-claude') exportForClaude();
        if (action === 'backup-folder') chooseBackupFolder();
        if (action === 'crop') showCropStatus();
        if (action === 'recalibrate') reCalibrate();
        if (action === 'theme') toggleTheme();
        if (action === 'stats') openStats();
        if (action === 'change-token') {
          closeMenu();
          showTokenModal();
        }
      });

      dom.importFile.addEventListener('change', async () => {
        const [file] = dom.importFile.files;
        dom.importFile.value = '';
        if (!file) return;
        if (isCloudReadOnly()) {
          showToast('Для импорта вставьте GitHub-токен.');
          return;
        }
        try {
          await importCatalog(JSON.parse(await file.text()));
        } catch (error) {
          showToast(error.message || 'Импорт не удался.');
        }
      });

      dom.statsPanel.addEventListener('click', (event) => {
        if (event.target.closest('[data-close-stats]')) closeStats();
      });

      dom.calibrationSurface.addEventListener('click', (event) => {
        if (event.target.closest('[data-close-calibration]')) closeCalibration();
        if (event.target.closest('#cropDone')) completeCalibration();
      });
      dom.calibrationSurface.addEventListener('pointerdown', (event) => {
        if (event.target.closest('#cropFrame')) beginCropDrag(event);
      });
      document.addEventListener('pointermove', moveCropDrag);
      document.addEventListener('pointerup', () => { state.cropDrag = null; });

      dom.modalSurface.addEventListener('click', (event) => {
        const action = event.target.closest('[data-modal-action]')?.dataset.modalAction;
        if (!action) return;
        const modal = state.modal;
        if (!modal) return;
        if (action === 'cancel' || action === 'readonly') {
          closeModal();
          return;
        }
        if (action === 'save-token') {
          saveTokenFromModal();
          return;
        }
        if (action === 'delete') {
          closeModal();
          if (modal.kind === 'project') removeProject(modal.record);
          else removeElement(modal.record);
        }
      });
      dom.modalSurface.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && state.modal?.type === 'token') {
          event.preventDefault();
          saveTokenFromModal();
        }
        if (event.key === 'Escape') closeModal();
      });

      document.addEventListener('paste', (event) => {
        if (isTextEditing(event.target)) return;
        const item = [...(event.clipboardData?.items || [])].find((candidate) => candidate.type.startsWith('image/'));
        if (!item) return;
        if (isCloudReadOnly()) {
          showToast('Для изменений вставьте GitHub-токен.');
          return;
        }
        event.preventDefault();
        handleImagePaste(item.getAsFile());
      });

      document.addEventListener('click', (event) => {
        if (state.menuOpen && !dom.menuPanel.contains(event.target) && !dom.menuButton.contains(event.target)) closeMenu();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (state.categoryFilter) {
          state.categoryFilter = '';
          renderFeed();
        }
        if (state.menuOpen) closeMenu();
        if (state.statsOpen) closeStats();
        if (state.calibration) closeCalibration();
        if (state.modal) closeModal();
      });

      async function initialize() {
        try {
          state.db = await openDatabase();
          await loadCatalog();
        } catch (error) {
          setSaveState('error', 'Ошибка');
          dom.workspaceInner.innerHTML = '<div class="workspace-empty"><div><strong>Локальная база недоступна</strong>Проверьте, что браузер разрешает IndexedDB для локального файла.</div></div>';
          showToast(error.message || 'Не удалось открыть базу.');
          return;
        }
        try {
          await loadCloudSyncState();
          state.cloud.ready = true;
          applyReadOnlyState();
          renderFeed();
          if (!state.cloud.token && !localValue(CLOUD_PROMPTED_KEY)) showTokenModal(true);
          setSaveState(state.cloud.dirty ? 'saving' : 'saved');
          await initializeCloud();
        } catch (error) {
          setSaveState('error', 'Ошибка интерфейса');
          dom.workspaceInner.innerHTML = '<div class="workspace-empty"><div><strong>Не удалось отрисовать каталог</strong>Данные в локальной базе сохранены. Обновите страницу.</div></div>';
          showToast(error.message || 'Не удалось отрисовать каталог.');
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
