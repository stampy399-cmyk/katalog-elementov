          const binary = atob(body);
          const bytes = new Uint8Array(binary.length);
          for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
          return new Blob([bytes], { type: mime });
        }
        return new Blob([decodeURIComponent(body)], { type: mime });
      }

      async function writeFile(directory, name, content) {
        const handle = await directory.getFileHandle(name, { create: true });
        const stream = await handle.createWritable();
        await stream.write(content);
        await stream.close();
      }

      function downloadBlob(filename, blob) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }

      async function jpegFromDataUrl(dataUrl) {
        const image = await imageFromDataUrl(dataUrl);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, image.naturalWidth || image.width);
        canvas.height = Math.max(1, image.naturalHeight || image.height);
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        return new Promise((resolve, reject) => canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Не удалось подготовить JPEG.'));
        }, 'image/jpeg', .9));
      }

      async function exportForClaude() {
        closeMenu();
        const rows = exportElementRows();
        const imageReferences = new Map();
        const prepared = [];
        for (const row of rows) {
          if (!row.element.image) continue;
          const filename = claudeImageName(row);
          const blob = await jpegFromDataUrl(row.element.image);
          prepared.push({ filename, blob });
          imageReferences.set(String(row.element.id), filename);
        }
        const markdown = claudeMarkdown(imageReferences);
        if (typeof window.showDirectoryPicker !== 'function') {
          downloadText('KATALOG.md', markdown);
          for (const file of prepared) downloadBlob(file.filename, file.blob);
          showToast('KATALOG.md и JPEG загружены отдельно.');
          return;
        }
        try {
          const parent = await window.showDirectoryPicker({ mode: 'readwrite' });
          const directory = parent.name === 'KATALOG-ANALIZ' ? parent : await parent.getDirectoryHandle('KATALOG-ANALIZ', { create: true });
          for (const file of prepared) await writeFile(directory, file.filename, file.blob);
          await writeFile(directory, 'KATALOG.md', markdown);
          showToast(`KATALOG-ANALIZ сохранён: ${prepared.length} JPEG.`);
        } catch (error) {
          if (error?.name === 'AbortError') return;
          downloadText('KATALOG.md', markdown);
          for (const file of prepared) downloadBlob(file.filename, file.blob);
          showToast('Папка недоступна; KATALOG.md и JPEG загружены отдельно.');
        }
      }

      async function chooseBackupFolder() {
        closeMenu();
        if (typeof window.showDirectoryPicker !== 'function') {
          showToast('Выбор папки не поддерживается этим браузером.');
          return;
        }
        try {
          clearTimeout(state.backupTimer);
          state.backupGeneration += 1;
          state.backupDirty = false;
          state.settings.backupDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          const permission = typeof state.settings.backupDirectoryHandle.requestPermission === 'function'
            ? await state.settings.backupDirectoryHandle.requestPermission({ mode: 'readwrite' }) : 'granted';
          if (permission !== 'granted') throw new Error('Нет доступа к папке бэкапа.');
          await saveSettings(['backupDirectoryHandle'], false, { backup: false });
          await writeBackup();
          showToast('Папка бэкапа подключена.');
        } catch (error) {
          if (error?.name !== 'AbortError') showToast('Папка бэкапа недоступна.');
        }
      }

      function scheduleBackup() {
        if (!state.settings.backupDirectoryHandle) return;
        state.backupDirty = true;
        clearTimeout(state.backupTimer);
        const generation = state.backupGeneration;
        state.backupTimer = setTimeout(() => writeBackup(generation).catch((error) => {
          state.saveError = error.message || 'Ошибка бэкапа';
          showToast('Автобэкап не записан: требуется доступ к папке.');
        }), 700);
      }

      async function backupPermission(directory, request = false) {
        if (!directory?.getFileHandle) return 'denied';
        if (typeof directory.queryPermission !== 'function') return 'granted';
        const current = await directory.queryPermission({ mode: 'readwrite' });
        if (current === 'granted' || !request || typeof directory.requestPermission !== 'function') return current;
        return directory.requestPermission({ mode: 'readwrite' });
      }

      async function refreshBackupPermission() {
        const directory = state.settings.backupDirectoryHandle;
        if (!directory?.getFileHandle) return;
        try {
          const permission = await backupPermission(directory);
          if (permission !== 'granted') showToast('Автобэкап ждёт доступа к выбранной папке.');
        } catch (error) {
          showToast('Не удалось проверить папку автобэкапа.');
        }
      }

      async function writeBackupFile(directory, snapshot) {
        await writeFile(directory, 'katalog-elementov-backup.json.tmp', snapshot);
        await writeFile(directory, 'katalog-elementov-backup.json', snapshot);
        try { await directory.removeEntry('katalog-elementov-backup.json.tmp'); } catch (error) { /* best-effort cleanup */ }
      }

      async function writeBackup(generation = state.backupGeneration) {
        const directory = state.settings.backupDirectoryHandle;
        if (!directory?.getFileHandle || generation !== state.backupGeneration) return;
        state.backupDirty = true;
        if (state.backupInFlight) return;
        state.backupInFlight = true;
        try {
          while (state.backupDirty && generation === state.backupGeneration) {
            state.backupDirty = false;
            const permission = await backupPermission(directory);
            if (permission !== 'granted') throw new Error('Доступ к папке бэкапа не подтверждён.');
            await writeBackupFile(directory, JSON.stringify(catalogSnapshot(), null, 2));
            state.settings.backupLastWrittenAt = Date.now();
            await saveSettings(['backupLastWrittenAt'], false, { backup: false, cloud: false });
          }
        } finally {
          state.backupInFlight = false;
          if (state.backupDirty && generation === state.backupGeneration) scheduleBackup();
        }
      }

          closeStats();
          highlightElementNumber(referenceLink.dataset.refNumber);
        }
      });

      dom.calibrationSurface.addEventListener('click', (event) => {
        if (event.target.closest('[data-close-calibration]')) closeCalibration();
        if (event.target.closest('#cropDone')) completeCalibration();
      });
      dom.calibrationSurface.addEventListener('pointerdown', (event) => {
        if (event.target.closest('#cropFrame')) beginCropDrag(event);
      });
      document.addEventListener('pointermove', moveCropDrag);
      document.addEventListener('pointerup', () => { state.cropDrag = null; });

      dom.modalSurface.addEventListener('click', (event) => {
        const action = event.target.closest('[data-modal-action]')?.dataset.modalAction;
        if (!action) return;
        const modal = state.modal;
        if (!modal) return;
        if (action === 'cancel') {
          closeModal();
          return;
        }
        if (action === 'delete') {
          if (modal.kind === 'project') {
            const confirmation = dom.modalSurface.querySelector('[data-delete-confirmation]')?.value || '';
            if (!deleteConfirmationMatches(confirmation)) {
              showToast(`Введите «${DELETE_CONFIRMATION}» для удаления.`);
              return;
            }
          }
          closeModal();
          if (modal.kind === 'project') removeProject(modal.record);
          else removeElement(modal.record);
        }
      });
      dom.modalSurface.addEventListener('input', (event) => {
        const confirmation = event.target.closest('[data-delete-confirmation]');
        if (!confirmation || !state.modal) return;
        state.modal.confirmation = confirmation.value;
        const button = dom.modalSurface.querySelector('[data-modal-action="delete"]');
        if (button) button.disabled = !deleteConfirmationMatches(confirmation.value);
      });
      dom.modalSurface.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeModal();
        if (event.key === 'Enter' && event.target.matches('[data-delete-confirmation]')) {
          event.preventDefault();
          dom.modalSurface.querySelector('[data-modal-action="delete"]')?.click();
        }
      });

      document.addEventListener('paste', (event) => {
        if (isTextEditing(event.target)) return;
        const item = [...(event.clipboardData?.items || [])].find((candidate) => candidate.type.startsWith('image/'));
        if (!item) return;
        if (isCloudReadOnly()) {
          showToast('Каталог обновляется.');
          return;
        }
        event.preventDefault();
        const capturedTimecode = captureTimecodeAtPaste(event.clipboardData);
        handleImagePaste(item.getAsFile(), capturedTimecode);
      });

      document.addEventListener('click', (event) => {
        if (state.menuOpen && !dom.menuPanel.contains(event.target) && !dom.menuButton.contains(event.target)) closeMenu();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (state.categoryFilter) {
          state.categoryFilter = '';
          renderFeed();
        }
        if (state.menuOpen) closeMenu();
        if (state.statsOpen) closeStats();
        if (state.calibration) closeCalibration();
        if (state.modal) closeModal();
      });

      function runCatalogSelfTest() {
        const failures = [];
        let total = 0;
        const expect = (condition, label) => {
          total += 1;
          if (!condition) failures.push(label);
        };
        expect(capturedTimecodeFromText('0:51 / 15:02') === '0:51', 'screenshot timecode');
        expect(capturedTimecodeFromText('https://youtu.be/example?t=61') === '1:01', 'URL timecode');
        expect(capturedTimecodeFromText('0:51') === '', 'ambiguous text is ignored');
        expect(formatCapturedTimecode(3661.9) === '1:01:01', 'media timecode format');
        const earlyRange = { id: 'early', timecodes: ['0:03–0:10'] };
        const middleRange = { id: 'middle', timecodes: ['2:51–2:59'] };
        const lateRange = { id: 'late', timecodes: ['10:55.0–10:56.5'] };
        expect(elementStartSeconds(earlyRange) === 3, 'range start 0:03 is numeric 3');
        expect(elementStartSeconds(middleRange) === 171, 'range start 2:51 is numeric 171');
        expect(elementStartSeconds(lateRange) === 655, 'range start 10:55.0 is numeric 655');
        const stableOrder = chronologicalElements([lateRange, middleRange, earlyRange, { ...middleRange, id: 'middle-2' }]).map((element) => element.id);
        expect(stableOrder.join() === 'early,middle,middle-2,late', 'range ordering is numeric and stable');
        expect(youtubeVideoId('https://www.youtube.com/watch?v=QOUszAHEZAE&t=211s') === 'QOUszAHEZAE', 'YouTube video ID');
        expect(youtubeStartSeconds('https://youtu.be/QOUszAHEZAE?t=3m31s') === 211, 'YouTube start time');
        expect(capturedTimecodeFromPlayer({ getCurrentTime: () => 51.9 }) === '0:51', 'live player timecode');
        expect(capturedTimecodeFromPlayer(null) === '', 'missing player timecode');
        expect(catalogAssetUrl('assets/elements/example.jpg?v=abc').includes('assets/elements/example.jpg?v=abc'), 'asset URL resolution');
        expect(deleteConfirmationMatches('УДАЛИТЬ') && !deleteConfirmationMatches('Удалить'), 'delete confirmation word');

        expect(linkifyReferences('ровно как #05 и #24', 30).match(/data-ref-number="(\d+)"/g)?.join() === 'data-ref-number="5",data-ref-number="24"', '#NN links in text');
        expect(!linkifyReferences('#99', 5).includes('data-ref-number'), 'unknown #NN stays plain text');
        expect(linkifyReferences('<b>#03</b>', 5).startsWith('&lt;b&gt;'), 'reference text stays escaped');
        expect([...referenceNumbersIn('см. #05, #24 и #5')].join() === '5,24', 'reference numbers parsed');

        const previewElement = { id: 'preview-test', image: 'assets/elements/preview-test.jpg?v=7' };
        expect(previewSourceList(previewElement).length === 3, 'published preview falls back to raw URL');
        state.previewCache.set('preview-test', 'data:image/jpeg;base64,AAAA');
        expect(previewSourceList(previewElement)[0].startsWith('data:'), 'captured frame is shown before the build lands');
        state.previewCache.delete('preview-test');

        const draftElement = normalizeElement({ id: 'draft-test', projectId: 'draft-project', description: 'remote text' });
        state.elements.push(draftElement);
        state.drafts.set(draftKey('element', 'draft-test', 'description'), { kind: 'element', id: 'draft-test', field: 'description', value: 'мой черновик', at: Date.now() });
        const restoredDrafts = restoreDrafts();
        expect(restoredDrafts.count === 1 && draftElement.description === 'мой черновик', 'draft survives an incoming snapshot');
        expect(restoredDrafts.conflicts.length === 1, 'overwritten remote text is reported');
        state.elements = state.elements.filter((element) => element.id !== 'draft-test');
        state.drafts.clear();

        const typingAt = state.lastTypingAt;
        state.lastTypingAt = Date.now();
        expect(!canApplyRemote(), 'incoming sync waits while the user types');
        state.lastTypingAt = typingAt;

        const capturedFrame = 'data:image/jpeg;base64,AAAA';
        const capturedElement = normalizeElement({ id: 'capture-test', projectId: 'capture-project', image: capturedFrame });
        state.elements.push(capturedElement);
        rememberLocalPreview(capturedElement.id, capturedFrame);
        applyPreparedAssetUrlsToCatalog({ elements: [{ id: 'capture-test', source: capturedFrame, value: 'assets/elements/capture-test.jpg?v=1' }], lastCropSource: null });
        expect(capturedElement.image === 'assets/elements/capture-test.jpg?v=1', 'externalized asset URL is applied to the catalog');
        expect(previewSourceList(capturedElement)[0] === capturedFrame, 'captured frame stays visible until the Pages build lands');
        expect(previewImageMarkup(capturedElement).includes('data:image/jpeg'), 'card markup keeps the captured frame');
        state.elements = state.elements.filter((element) => element.id !== 'capture-test');
        forgetLocalPreview('capture-test');

        expect(CLOUD_PUSH_MIN_INTERVAL >= 30000 && CLOUD_PUSH_DELAY >= 30000, 'cloud pushes are batched');
        expect(presenceCount().total >= 1, 'presence counts at least this tab');
        const publishedBase = { version: 5, exportedAt: '2026-08-11T09:00:00Z', projects: [], elements: [] };
        expect(isPublishedSnapshotNewer({ ...publishedBase, exportedAt: '2026-08-11T10:00:00Z' }, publishedBase), 'newer exportedAt wins');
        expect(isPublishedSnapshotNewer({ ...publishedBase, version: 6, exportedAt: '2020-01-01T00:00:00Z' }, publishedBase), 'newer version wins');
        expect(!isPublishedSnapshotNewer({ ...publishedBase }, publishedBase), 'equal published snapshot is not newer');
        expect(!isPublishedSnapshotNewer({ ...publishedBase, version: 4, exportedAt: '2030-01-01T00:00:00Z' }, publishedBase), 'older version does not replace newer schema');

        const base = { version: 5, projects: [], elements: [{ id: 'element', description: 'base', technique: 'base', updatedAt: 1 }], categories: [], settings: {} };
        const remote = cloneSnapshot(base);
        remote.elements[0].description = 'remote';
        remote.elements[0].updatedAt = 2;
        const local = cloneSnapshot(base);
        local.elements[0].technique = 'local';
        local.elements[0].updatedAt = 3;
        const merged = mergeCloudSnapshots(base, remote, local);
        expect(merged.ok && merged.snapshot.elements[0].description === 'remote' && merged.snapshot.elements[0].technique === 'local', 'independent field merge');
        local.elements[0].description = 'local';
        const conflict = mergeCloudSnapshots(base, remote, local);
        expect(!conflict.ok && conflict.conflicts.includes('elements[element].description'), 'same-field conflict only');
        return Object.freeze({ passed: total - failures.length, total, failures: Object.freeze(failures) });
      }

      globalThis.__catalogSelfTest = runCatalogSelfTest;

      dom.saveState.addEventListener('click', () => {
        if (state.cloud.dirty) {
          showToast('Отправляю правки в облако…');
          flushCloudSave(true);
        } else {
          showToast('Все правки уже в облаке.');
        }
      });

      dom.serverRefresh.addEventListener('click', () => {
        refreshFromPublishedData({ force: true, notify: true }).catch((error) => {
          setCloudError('Ошибка: сети');
          showToast(error.message || 'Не удалось обновить data.json.');
        });
      });

      globalThis.addEventListener('beforeunload', (event) => {
        if (!state.cloud.dirty) return;
        event.preventDefault();
        event.returnValue = '';
      });

      async function initialize() {
        loadPreviewCache();
        try {
          state.db = await openDatabase();
          await loadCatalog();
        } catch (error) {
          setSaveState('error', 'Ошибка');
          dom.workspaceInner.innerHTML = '<div class="workspace-empty"><div><strong>Локальная база недоступна</strong>Проверьте, что браузер разрешает IndexedDB для локального файла.</div></div>';
          showToast(error.message || 'Не удалось открыть базу.');
          return;
        }
        try {
          await loadCloudSyncState();
          state.cloud.ready = true;
          applyReadOnlyState();
          try {
            await refreshFromPublishedData();
          } catch (error) {
            // The GitHub API fallback below still gets a chance when Pages is unavailable.
          }
          renderFeed();
          setSaveState(state.cloud.dirty ? 'saving' : 'saved');
          initializePresence();
          await initializeCloud();
        } catch (error) {
          setSaveState('error', 'Ошибка интерфейса');
          dom.workspaceInner.innerHTML = '<div class="workspace-empty"><div><strong>Не удалось отрисовать каталог</strong>Данные в локальной базе сохранены. Обновите страницу.</div></div>';
          showToast(error.message || 'Не удалось отрисовать каталог.');
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
